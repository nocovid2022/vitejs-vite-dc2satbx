<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetDesk — Auto in Spain</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F8FAFC;color:#0F172A;font-family:'Inter',sans-serif;min-height:100vh;font-size:14px}
::-webkit-scrollbar{height:4px;width:4px}::-webkit-scrollbar-track{background:#F1F5F9}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:2px}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:500;border-radius:8px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#2563EB;color:#fff;padding:8px 16px;font-size:13px}.btn-primary:hover{background:#1D4ED8}
.btn-secondary{background:#F1F5F9;color:#475569;padding:8px 16px;font-size:13px;border:1px solid #E2E8F0}.btn-secondary:hover{background:#E2E8F0}
.btn-danger{background:#FEF2F2;color:#DC2626;padding:7px 14px;font-size:13px;border:1px solid #FECACA}.btn-danger:hover{background:#FEE2E2}
.btn-google{background:#fff;color:#374151;padding:8px 16px;font-size:13px;border:1px solid #D1D5DB;cursor:pointer;font-family:inherit;font-weight:500;border-radius:8px;transition:all .15s;display:inline-flex;align-items:center;gap:8px}.btn-google:hover{background:#F9FAFB;box-shadow:0 1px 4px #0001}
.btn-sm{padding:6px 12px;font-size:12px}
.input{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:9px 12px;color:#0F172A;font-size:13px;width:100%;outline:none;transition:border .15s;font-family:inherit}.input:focus{border-color:#2563EB;box-shadow:0 0 0 3px #2563EB15}
.label{font-size:11px;font-weight:600;color:#94A3B8;letter-spacing:.06em;display:block;margin-bottom:5px}
.modal-overlay{position:fixed;inset:0;background:#00000050;backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border:1px solid #E2E8F0;border-radius:16px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px #0002}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;transition:all .2s}
.card:hover{border-color:#CBD5E1;box-shadow:0 2px 12px #0001}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.view-tab{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:#94A3B8;padding:7px 14px;border-radius:7px;transition:all .15s}.view-tab.active{background:#fff;color:#0F172A;box-shadow:0 1px 4px #0001}
.tl-cell{transition:filter .1s}.tl-cell.clickable{cursor:pointer}.tl-cell.clickable:hover{filter:brightness(.92)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.fade-up{animation:fadeUp .2s ease}
@keyframes spin{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:spin 1s linear infinite}
.hint-box{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.divider{height:1px;background:#F1F5F9;margin:14px 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;
const CLIENT_ID="546196176766-060ji046vk8r8kem36ko66dr6d4gme9n.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/calendar";
const STORAGE_KEY="fleet_ais_v3";
const CARS_KEY="fleet_ais_cars_v3";
const CAR_COLORS=["#2563EB","#059669","#D97706","#DC2626","#7C3AED","#0891B2","#EA580C","#DB2777","#0D9488","#65A30D","#E11D48","#9333EA"];

const DEFAULT_CARS=[
  {id:1,brand:"Volkswagen",model:"Polo",plate:"",city:"",color:CAR_COLORS[0]},
  {id:2,brand:"Volkswagen",model:"Golf",plate:"",city:"",color:CAR_COLORS[1]},
  {id:3,brand:"Lexus",model:"CT200h",plate:"",city:"",color:CAR_COLORS[2]},
  {id:4,brand:"Toyota",model:"Yaris Hybrid",plate:"",city:"",color:CAR_COLORS[3]},
  {id:5,brand:"Skoda",model:"Scala",plate:"",city:"",color:CAR_COLORS[4]},
  {id:6,brand:"Hyundai",model:"Ionic",plate:"",city:"",color:CAR_COLORS[5]},
  {id:7,brand:"Skoda",model:"Superb",plate:"",city:"",color:CAR_COLORS[6]},
  {id:8,brand:"Volkswagen",model:"Passat",plate:"",city:"",color:CAR_COLORS[7]},
  {id:9,brand:"Fiat",model:"500e (Alicante)",plate:"",city:"Alicante",color:CAR_COLORS[8]},
  {id:10,brand:"Fiat",model:"500e (Valencia)",plate:"",city:"Valencia",color:CAR_COLORS[9]},
  {id:11,brand:"BMW",model:"218d Gran Tourer",plate:"",city:"",color:CAR_COLORS[10]},
  {id:12,brand:"Toyota",model:"Yaris",plate:"",city:"",color:CAR_COLORS[11]},
];

// Ключевые слова для распознавания машины из названия события календаря
const CAR_KW=[
  {id:1,kw:["polo","vw polo","volkswagen polo"]},
  {id:2,kw:["golf","vw golf","volkswagen golf"]},
  {id:3,kw:["lexus","ct200","ct 200"]},
  {id:4,kw:["yaris hybrid","yaris гибрид"]},
  {id:5,kw:["scala"]},
  {id:6,kw:["ionic","ioniq"]},
  {id:7,kw:["superb"]},
  {id:8,kw:["passat"]},
  {id:9,kw:["500e alicante","500 alicante","fiat alicante"]},
  {id:10,kw:["500e","fiat 500","500e valencia"]},
  {id:11,kw:["218","gran tourer","218d","bmw 218"]},
  {id:12,kw:["yaris"]},
];

function findCarId(text,cars){
  const t=text.toLowerCase();
  // Сначала ищем по стандартным ключевым словам
  for(const ck of CAR_KW){
    if(ck.kw.some(k=>t.includes(k)))return ck.id;
  }
  // Потом ищем по названиям машин из localStorage (для новых авто)
  for(const car of cars){
    if(t.includes(car.model.toLowerCase())||t.includes(car.brand.toLowerCase()+" "+car.model.toLowerCase()))return car.id;
  }
  return null;
}

function parseEvent(ev,cars){
  const title=ev.summary||"";
  const desc=ev.description||"";
  const phoneMatch=title.match(/\+[\d\s\-()]{8,15}/);
  const phone=phoneMatch?phoneMatch[0].trim():"";
  let rest=title.replace(/\+[\d\s\-()]{8,15}/,"").trim();
  rest=rest.replace(/оплата.*/i,"").replace(/аванс.*/i,"").replace(/залог.*/i,"").replace(/депозит.*/i,"").trim();
  const carId=findCarId(rest,cars)||findCarId(title,cars);
  let remainder=rest;
  if(carId){
    const ck=CAR_KW.find(x=>x.id===carId);
    if(ck){for(const k of ck.kw){remainder=remainder.replace(new RegExp(k,"gi"),"").trim()}}
    // Также убираем по названию авто
    const car=cars.find(c=>c.id===carId);
    if(car){remainder=remainder.replace(new RegExp(car.model,"gi"),"").replace(new RegExp(car.brand,"gi"),"").trim()}
  }
  // Убираем лишние пробелы и знаки
  remainder=remainder.replace(/\s+/g," ").replace(/^[-,·\s]+|[-,·\s]+$/g,"").trim();
  const parts=remainder.split(/\s+/).filter(Boolean);
  // Определяем город и имя
  const CITIES=["валенсия","мадрид","барселона","аликанте","севилья","малага","valencia","madrid","barcelona","alicante","sevilla","malaga","бенидорм","торревьеха","murcia","мурсия"];
  let city="",clientName="";
  if(parts.length>0&&CITIES.some(c=>parts[0].toLowerCase()===c)){
    city=parts[0];clientName=parts.slice(1).join(" ");
  } else {
    clientName=parts.join(" ");
  }
  // Из описания берём дополнительные поля
  const g=k=>{const m=desc.match(new RegExp(k+"[:\\s]+(.+)","i"));return m?m[1].trim():""};
  return{
    id:ev.id,googleEventId:ev.id,carId,
    clientName:clientName||title,phone,city:city||g("город")||g("city")||g("ciudad"),
    location:g("место")||g("location")||g("lugar")||g("аэропорт")?g("место")||g("аэропорт"):"",
    price:g("цена")||g("price")||g("precio"),
    documents:g("документы")||g("docs"),
    notes:desc,
    startDate:ev.start?.date||(ev.start?.dateTime?ev.start.dateTime.split("T")[0]:""),
    endDate:ev.end?.date||(ev.end?.dateTime?ev.end.dateTime.split("T")[0]:""),
    active:true,fromGoogle:true,
  };
}

function toGoogleEvent(r,cars){
  const car=cars.find(c=>c.id===r.carId);
  const label=car?`${car.brand} ${car.model}`:"";
  const title=`${r.city?r.city+" ":""}${r.clientName} ${label}${r.phone?" "+r.phone:""}`.trim();
  const lines=[
    r.price&&`Цена: ${r.price} €`,
    r.location&&`Место: ${r.location}`,
    r.documents&&`Документы: ${r.documents}`,
    r.notes&&r.notes,
  ].filter(Boolean);
  return{summary:title,description:lines.join("\n"),start:{date:r.startDate},end:{date:r.endDate}};
}

function fmtDate(d){return d.toISOString().split("T")[0]}
function parseDate(s){if(!s)return new Date();const[y,m,d]=s.split("-");return new Date(+y,+m-1,+d)}
function daysLeft(e){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(e)-n)/86400000)}
function fmtRu(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})}
function fmtFull(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"})}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function App(){
  const[cars,setCars]=useState(()=>{try{const s=localStorage.getItem(CARS_KEY);return s?JSON.parse(s):DEFAULT_CARS}catch{return DEFAULT_CARS}});
  const[rentals,setRentals]=useState(()=>{try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):[]}catch{return[]}});
  const[view,setView]=useState("timeline");
  const[monthOffset,setMonthOffset]=useState(0);
  const[showForm,setShowForm]=useState(false);
  const[showCarForm,setShowCarForm]=useState(false);
  const[showGuide,setShowGuide]=useState(false);
  const[editRental,setEditRental]=useState(null);
  const[selected,setSelected]=useState(null);
  const[gapiReady,setGapiReady]=useState(false);
  const[gisReady,setGisReady]=useState(false);
  const[signedIn,setSignedIn]=useState(false);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[syncCount,setSyncCount]=useState(0);
  const[tokenClient,setTokenClient]=useState(null);
  const carsRef=useRef(cars);
  useEffect(()=>{carsRef.current=cars},[cars]);

  useEffect(()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(rentals))},[rentals]);
  useEffect(()=>{localStorage.setItem(CARS_KEY,JSON.stringify(cars))},[cars]);

  useEffect(()=>{
    const s1=document.createElement("script");s1.src="https://apis.google.com/js/api.js";
    s1.onload=()=>{window.gapi.load("client",async()=>{await window.gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"]});setGapiReady(true)})};
    document.head.appendChild(s1);
    const s2=document.createElement("script");s2.src="https://accounts.google.com/gsi/client";
    s2.onload=()=>{const tc=window.google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:(r)=>{if(!r.error){setSignedIn(true);doSync()}}});setTokenClient(tc);setGisReady(true)};
    document.head.appendChild(s2);
  },[]);

  async function doSync(){
    setSyncStatus("syncing");
    try{
      const now=new Date();
      const r=await window.gapi.client.calendar.events.list({calendarId:"primary",timeMin:new Date(now.getFullYear(),now.getMonth()-3,1).toISOString(),timeMax:new Date(now.getFullYear(),now.getMonth()+5,1).toISOString(),singleEvents:true,orderBy:"startTime",maxResults:500});
      const currentCars=carsRef.current;
      const evs=(r.result.items||[]).filter(e=>e.summary&&e.summary.trim().length>1).map(e=>parseEvent(e,currentCars)).filter(x=>x.carId&&x.startDate&&x.endDate);
      setRentals(prev=>[...prev.filter(x=>!x.fromGoogle),...evs]);
      setSyncCount(evs.length);setSyncStatus("done");setTimeout(()=>setSyncStatus("idle"),4000);
    }catch(e){console.error(e);setSyncStatus("error")}
  }

  async function createCalEvent(r){if(!signedIn)return null;try{const res=await window.gapi.client.calendar.events.insert({calendarId:"primary",resource:toGoogleEvent(r,cars)});return res.result.id}catch{return null}}
  async function updateCalEvent(r){if(!signedIn||!r.googleEventId)return;try{await window.gapi.client.calendar.events.update({calendarId:"primary",eventId:r.googleEventId,resource:toGoogleEvent(r,cars)})}catch{}}
  async function deleteCalEvent(id){if(!signedIn||!id)return;try{await window.gapi.client.calendar.events.delete({calendarId:"primary",eventId:id})}catch{}}

  async function saveRental(data){
    if(editRental){const u={...editRental,...data};await updateCalEvent(u);setRentals(r=>r.map(x=>x.id===editRental.id?u:x))}
    else{const n={...data,id:Date.now(),active:true};const gid=await createCalEvent(n);if(gid)n.googleEventId=gid;setRentals(r=>[...r,n])}
    setShowForm(false);setEditRental(null);
  }
  async function endRental(id){const r=rentals.find(x=>x.id===id);if(r?.googleEventId)await deleteCalEvent(r.googleEventId);setRentals(r=>r.map(x=>x.id===id?{...x,active:false}:x));setSelected(null)}
  function addCar(data){const color=CAR_COLORS[cars.length%CAR_COLORS.length];setCars(c=>[...c,{...data,id:Date.now(),color}]);setShowCarForm(false)}
  function deleteCar(id){if(!window.confirm("Удалить авто?"))return;setCars(c=>c.filter(x=>x.id!==id));setRentals(r=>r.filter(x=>x.carId!==id))}

  const today=new Date();today.setHours(0,0,0,0);
  const vm=new Date(today.getFullYear(),today.getMonth()+monthOffset,1);
  const days=Array.from({length:new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate()},(_,i)=>new Date(vm.getFullYear(),vm.getMonth(),i+1));
  const monthLabel=vm.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  function activeRentals(cid){return rentals.filter(r=>r.carId===cid&&r.active)}
  function rentalForDay(cid,day){return rentals.find(r=>{if(!r.active||r.carId!==cid)return false;const s=parseDate(r.startDate);s.setHours(0,0,0,0);const e=parseDate(r.endDate);e.setHours(0,0,0,0);return day>=s&&day<=e})}
  const stats={total:cars.length,active:cars.filter(c=>activeRentals(c.id).length>0).length,free:cars.filter(c=>activeRentals(c.id).length===0).length,overdue:rentals.filter(r=>r.active&&daysLeft(r.endDate)<0).length};

  return(
    <div style={{minHeight:"100vh",background:"#F8FAFC"}}>
      {/* Header */}
      <div style={{background:"#fff",borderBottom:"1px solid #E2E8F0",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:34,height:34,background:"#2563EB",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>🚗</div>
          <div>
            <div style={{fontSize:15,fontWeight:700,color:"#0F172A",letterSpacing:"-.02em"}}>Auto in Spain</div>
            <div style={{fontSize:11,color:"#94A3B8",fontFamily:"'JetBrains Mono'"}}>{stats.active} в аренде · {stats.free} свободно</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-secondary btn-sm" onClick={()=>setShowGuide(true)}>📋 Формат календаря</button>
          {!signedIn?(
            <button className="btn-google btn-sm" onClick={()=>gapiReady&&gisReady&&tokenClient.requestAccessToken({prompt:""})}>
              <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              {gapiReady&&gisReady?"Google Calendar":"Загрузка..."}
            </button>
          ):(
            <button className="btn btn-secondary btn-sm" onClick={doSync} disabled={syncStatus==="syncing"}>
              <span className={syncStatus==="syncing"?"spin":""}>🔄</span>
              {syncStatus==="syncing"?"Синхронизация...":syncStatus==="done"?`✓ ${syncCount} аренд`:syncStatus==="error"?"Ошибка":"Синхронизировать"}
            </button>
          )}
          <div style={{background:"#F1F5F9",borderRadius:9,padding:"3px",display:"flex"}}>
            <button className={"view-tab"+(view==="timeline"?" active":"")} onClick={()=>setView("timeline")}>📅 Таймлайн</button>
            <button className={"view-tab"+(view==="cards"?" active":"")} onClick={()=>setView("cards")}>⊞ Карточки</button>
          </div>
          <button className="btn btn-secondary btn-sm" onClick={()=>setShowCarForm(true)}>+ Авто</button>
          <button className="btn btn-primary btn-sm" onClick={()=>{setEditRental(null);setShowForm(true)}}>+ Аренда</button>
        </div>
      </div>

      <div style={{padding:"20px 24px",maxWidth:1600,margin:"0 auto"}}>
        {/* Stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
          {[{l:"Всего авто",v:stats.total,c:"#2563EB",bg:"#EFF6FF",i:"🚗"},{l:"В аренде",v:stats.active,c:"#059669",bg:"#ECFDF5",i:"🔑"},{l:"Свободно",v:stats.free,c:"#64748B",bg:"#F8FAFC",i:"🅿️"},{l:"Просрочено",v:stats.overdue,c:"#DC2626",bg:"#FEF2F2",i:"⚠️"}].map(s=>(
            <div key={s.l} style={{background:s.bg,border:`1px solid ${s.c}20`,borderRadius:12,padding:"14px 18px",display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontSize:24}}>{s.i}</div>
              <div><div style={{fontSize:28,fontWeight:700,color:s.c,fontFamily:"'JetBrains Mono'",lineHeight:1}}>{s.v}</div><div style={{fontSize:12,color:"#64748B",marginTop:2}}>{s.l}</div></div>
            </div>
          ))}
        </div>

        {view==="timeline"?
          <Timeline cars={cars} days={days} today={today} monthLabel={monthLabel} monthOffset={monthOffset} setMonthOffset={setMonthOffset} rentalForDay={rentalForDay} onRentalClick={setSelected}/>:
          <Cards cars={cars} activeRentals={activeRentals} onRentalClick={setSelected} onDelete={deleteCar} onNewRental={()=>{setEditRental(null);setShowForm(true)}}/>
        }
      </div>

      {/* Guide Modal */}
      {showGuide&&(
        <div className="modal-overlay" onClick={()=>setShowGuide(false)}>
          <div className="modal fade-up" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontSize:16,fontWeight:700}}>📋 Как заполнять Google Calendar</div>
              <button className="btn btn-secondary btn-sm" onClick={()=>setShowGuide(false)}>✕</button>
            </div>
            <div className="hint-box">
              <div style={{fontSize:12,fontWeight:600,color:"#1D4ED8",marginBottom:8}}>НАЗВАНИЕ СОБЫТИЯ (обязательно)</div>
              <div style={{fontFamily:"'JetBrains Mono'",fontSize:13,background:"#fff",borderRadius:6,padding:"10px 12px",border:"1px solid #BFDBFE",color:"#1E40AF"}}>
                Валенсия Владислав Passat +34644136487
              </div>
              <div style={{fontSize:12,color:"#3B82F6",marginTop:8}}>Формат: <b>Город Имя Модель Телефон</b></div>
            </div>
            <div style={{fontSize:12,fontWeight:600,color:"#64748B",marginBottom:10}}>ОПИСАНИЕ СОБЫТИЯ (опционально)</div>
            <div style={{fontFamily:"'JetBrains Mono'",fontSize:12,background:"#F8FAFC",borderRadius:8,padding:"12px",border:"1px solid #E2E8F0",lineHeight:2,color:"#475569"}}>
              Цена: 420 €<br/>
              Место: Аэропорт T4<br/>
              Документы: Паспорт РФ серия 1234<br/>
            </div>
            <div className="divider"/>
            <div style={{fontSize:12,color:"#64748B",marginBottom:8,fontWeight:600}}>МОДЕЛИ МАШИН (используй в названии)</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {DEFAULT_CARS.map(c=>(
                <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:"#F8FAFC",borderRadius:6,fontSize:12}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:c.color}}></div>
                  <span style={{fontFamily:"'JetBrains Mono'",fontWeight:500}}>{c.model}</span>
                </div>
              ))}
            </div>
            <div className="divider"/>
            <div style={{fontSize:12,color:"#94A3B8"}}>После заполнения нажми «Синхронизировать» в шапке — данные подтянутся автоматически.</div>
          </div>
        </div>
      )}

      {/* Detail */}
      {selected&&(<div className="modal-overlay" onClick={()=>setSelected(null)}><div className="modal fade-up" onClick={e=>e.stopPropagation()}><Detail rental={selected} cars={cars} onEdit={()=>{setEditRental(selected);setSelected(null);setShowForm(true)}} onEnd={()=>endRental(selected.id)} onClose={()=>setSelected(null)}/></div></div>)}

      {/* Rental Form */}
      {showForm&&(<div className="modal-overlay" onClick={()=>{setShowForm(false);setEditRental(null)}}><div className="modal fade-up" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div style={{fontSize:16,fontWeight:700}}>{editRental?"Редактировать аренду":"Новая аренда"}</div>
          <button className="btn btn-secondary btn-sm" onClick={()=>{setShowForm(false);setEditRental(null)}}>✕</button>
        </div>
        <RentalForm cars={cars} initial={editRental||{}} onSave={saveRental} onCancel={()=>{setShowForm(false);setEditRental(null)}}/>
      </div></div>)}

      {/* Car Form */}
      {showCarForm&&(<div className="modal-overlay" onClick={()=>setShowCarForm(false)}><div className="modal fade-up" style={{maxWidth:420}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div style={{fontSize:16,fontWeight:700}}>Добавить автомобиль</div>
          <button className="btn btn-secondary btn-sm" onClick={()=>setShowCarForm(false)}>✕</button>
        </div>
        <div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#92400E"}}>
          ⚠️ После добавления авто — добавь его модель в названия событий Google Calendar в таком же формате чтобы синхронизация работала.
        </div>
        <CarForm onSave={addCar} onCancel={()=>setShowCarForm(false)}/>
      </div></div>)}
    </div>
  );
}

function Timeline({cars,days,today,monthLabel,monthOffset,setMonthOffset,rentalForDay,onRentalClick}){
  const CW=30,RH=36;
  function cs(r,day,car){
    if(!r)return{};
    const s=parseDate(r.startDate);s.setHours(0,0,0,0);
    const e=parseDate(r.endDate);e.setHours(0,0,0,0);
    const iS=sameDay(day,s),iE=sameDay(day,e);
    const overdue=daysLeft(r.endDate)<0;
    const col=overdue?"#DC2626":car.color;
    return{background:col+(overdue?"22":"18"),borderTop:`2px solid ${col}`,borderBottom:`2px solid ${col}`,borderLeft:iS?`2px solid ${col}`:"none",borderRight:iE?`2px solid ${col}`:"none",borderRadius:iS&&iE?"6px":iS?"6px 0 0 6px":iE?"0 6px 6px 0":"0"};
  }
  return(
    <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:12,overflow:"hidden"}}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid #E2E8F0",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#fff"}}>
        <button className="btn btn-secondary btn-sm" onClick={()=>setMonthOffset(o=>o-1)}>← Пред.</button>
        <div style={{fontSize:14,fontWeight:600,textTransform:"capitalize"}}>{monthLabel}</div>
        <button className="btn btn-secondary btn-sm" onClick={()=>setMonthOffset(o=>o+1)}>След. →</button>
      </div>
      <div style={{overflowX:"auto"}}>
        <div style={{minWidth:190+days.length*CW}}>
          {/* Header */}
          <div style={{display:"flex",borderBottom:"1px solid #E2E8F0",background:"#F8FAFC",position:"sticky",top:0,zIndex:10}}>
            <div style={{width:190,minWidth:190,padding:"8px 14px",fontSize:11,fontWeight:600,color:"#94A3B8",letterSpacing:".06em"}}>АВТОМОБИЛЬ</div>
            {days.map(day=>{
              const iT=sameDay(day,today),iW=day.getDay()===0||day.getDay()===6;
              return <div key={day.toISOString()} style={{width:CW,minWidth:CW,textAlign:"center",padding:"5px 0",fontSize:10,fontFamily:"'JetBrains Mono'",color:iT?"#2563EB":iW?"#CBD5E1":"#94A3B8",background:iT?"#EFF6FF":"transparent",fontWeight:iT?700:400,borderLeft:"1px solid #F1F5F9"}}>
                <div style={{fontSize:8,marginBottom:1}}>{["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][day.getDay()]}</div>
                <div>{day.getDate()}</div>
              </div>;
            })}
          </div>
          {/* Rows */}
          {cars.map((car,ci)=>(
            <div key={car.id} style={{display:"flex",borderBottom:"1px solid #F1F5F9",background:ci%2?"#FAFBFC":"#fff"}}>
              <div style={{width:190,minWidth:190,padding:"0 14px",display:"flex",alignItems:"center",gap:8,height:RH,borderRight:"1px solid #F1F5F9"}}>
                <div style={{width:7,height:7,borderRadius:"50%",background:car.color,flexShrink:0}}></div>
                <div style={{overflow:"hidden"}}>
                  <div style={{fontSize:12,fontWeight:600,color:"#1E293B",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{car.brand} {car.model}</div>
                  {car.plate&&<div style={{fontSize:10,color:"#94A3B8",fontFamily:"'JetBrains Mono'"}}>{car.plate}</div>}
                </div>
              </div>
              {days.map(day=>{
                const r=rentalForDay(car.id,day);
                const style=cs(r,day,car);
                const iS=r&&sameDay(day,parseDate(r.startDate));
                const iT=sameDay(day,today);
                return <div key={day.toISOString()} className={"tl-cell"+(r?" clickable":"")}
                  style={{width:CW,minWidth:CW,height:RH,display:"flex",alignItems:"center",position:"relative",borderLeft:iT?"1px solid #2563EB40":"1px solid #F1F5F905",...style}}
                  onClick={()=>r&&onRentalClick(r)} title={r?`${r.clientName}${r.city?" · "+r.city:""} · ${fmtRu(r.startDate)}–${fmtRu(r.endDate)}`:"Свободно"}>
                  {iS&&r&&<div style={{position:"absolute",left:4,fontSize:9,fontWeight:600,color:daysLeft(r.endDate)<0?"#DC2626":car.color,whiteSpace:"nowrap",overflow:"hidden",maxWidth:CW*6,pointerEvents:"none",zIndex:5}}>{r.clientName.split(" ")[0]}</div>}
                </div>;
              })}
            </div>
          ))}
        </div>
      </div>
      {/* Legend */}
      <div style={{padding:"8px 16px",borderTop:"1px solid #F1F5F9",display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",background:"#FAFBFC"}}>
        {cars.map(car=><div key={car.id} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#64748B"}}><div style={{width:6,height:6,borderRadius:"50%",background:car.color}}></div>{car.brand} {car.model}</div>)}
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:5,fontSize:10,color:"#64748B"}}><div style={{width:12,height:3,background:"#DC2626",borderRadius:2}}></div>Просрочено</div>
      </div>
    </div>
  );
}

function Cards({cars,activeRentals,onRentalClick,onDelete,onNewRental}){
  return <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
    {cars.map(car=>{
      const r=activeRentals(car.id)[0]||null;
      const dl=r?daysLeft(r.endDate):null;
      const isFree=!r,isOv=r&&dl<0;
      return <div key={car.id} className="card" style={{padding:0,overflow:"hidden"}}>
        {/* Car header */}
        <div style={{padding:"14px 16px",borderBottom:"1px solid #F1F5F9",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:32,height:32,borderRadius:8,background:car.color+"15",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <div style={{width:10,height:10,borderRadius:"50%",background:car.color}}></div>
            </div>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:"#0F172A"}}>{car.brand} {car.model}</div>
              {car.plate&&<div style={{fontSize:11,color:"#94A3B8",fontFamily:"'JetBrains Mono'"}}>{car.plate}</div>}
            </div>
          </div>
          <span className="tag" style={{background:isFree?"#F1F5F9":isOv?"#FEF2F2":"#ECFDF5",color:isFree?"#64748B":isOv?"#DC2626":"#059669"}}>
            {isFree?"Свободна":isOv?"Просрочена":"В аренде"}
          </span>
        </div>
        {/* Client info */}
        {r?(
          <div style={{padding:"14px 16px",cursor:"pointer"}} onClick={()=>onRentalClick(r)}>
            <div style={{fontSize:15,fontWeight:700,color:"#0F172A",marginBottom:10}}>{r.clientName}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              <div>
                <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:2}}>ТЕЛЕФОН</div>
                <div style={{fontSize:13,color:"#2563EB",fontWeight:500}}>{r.phone||"—"}</div>
              </div>
              <div>
                <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:2}}>ГОРОД</div>
                <div style={{fontSize:13,color:"#0F172A"}}>{r.city||"—"}</div>
              </div>
              <div>
                <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:2}}>НАЧАЛО</div>
                <div style={{fontSize:12,fontFamily:"'JetBrains Mono'",color:"#475569"}}>{fmtRu(r.startDate)}</div>
              </div>
              <div>
                <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:2}}>КОНЕЦ</div>
                <div style={{fontSize:12,fontFamily:"'JetBrains Mono'",color:"#475569"}}>{fmtRu(r.endDate)}</div>
              </div>
            </div>
            {r.location&&<div style={{fontSize:12,color:"#64748B",marginBottom:6}}>📍 {r.location}</div>}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:10,borderTop:"1px solid #F1F5F9"}}>
              {r.price?<div style={{fontSize:13,fontWeight:700,color:"#059669"}}>{r.price} €</div>:<div/>}
              <div style={{fontSize:13,fontWeight:700,fontFamily:"'JetBrains Mono'",color:isOv?"#DC2626":dl<=2?"#D97706":"#059669"}}>
                {dl<0?`Просрочено ${Math.abs(dl)} дн.`:dl===0?"Сегодня возврат":`${dl} дн. осталось`}
              </div>
            </div>
          </div>
        ):(
          <div style={{padding:"14px 16px"}}>
            <div style={{textAlign:"center",padding:"10px 0",color:"#CBD5E1",fontSize:13}}>Машина свободна</div>
            <button className="btn btn-primary" style={{width:"100%",justifyContent:"center",marginTop:4}} onClick={onNewRental}>+ Оформить аренду</button>
          </div>
        )}
      </div>;
    })}
  </div>;
}

function Detail({rental,cars,onEdit,onEnd,onClose}){
  const car=cars.find(c=>c.id===rental.carId);
  const dl=daysLeft(rental.endDate),isOv=dl<0;
  return <>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
      <div>
        <div style={{fontSize:19,fontWeight:700,color:"#0F172A"}}>{rental.clientName}</div>
        {car&&<div style={{fontSize:13,color:"#64748B",marginTop:3,display:"flex",alignItems:"center",gap:6}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:car.color}}></div>
          {car.brand} {car.model}
          {rental.fromGoogle&&<span className="tag" style={{background:"#EFF6FF",color:"#2563EB",fontSize:10}}>📅 Google</span>}
        </div>}
      </div>
      <button className="btn btn-secondary btn-sm" onClick={onClose}>✕</button>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
      {[{l:"ТЕЛЕФОН",v:rental.phone,c:"#2563EB"},{l:"ГОРОД",v:rental.city},{l:"МЕСТО ПОДАЧИ",v:rental.location||"—"},{l:"ЦЕНА",v:rental.price?`${rental.price} €`:"—",c:"#059669"}].map(f=>(
        <div key={f.l} style={{background:"#F8FAFC",borderRadius:9,padding:"10px 13px"}}>
          <div style={{fontSize:10,color:"#94A3B8",marginBottom:3,fontWeight:600,letterSpacing:".06em"}}>{f.l}</div>
          <div style={{fontSize:13,fontWeight:600,color:f.c||"#0F172A"}}>{f.v||"—"}</div>
        </div>
      ))}
    </div>

    <div style={{background:"#F8FAFC",borderRadius:9,padding:"12px 14px",marginBottom:12}}>
      <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:10,letterSpacing:".06em"}}>ПЕРИОД АРЕНДЫ</div>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:10,color:"#94A3B8",marginBottom:2}}>НАЧАЛО</div>
          <div style={{fontFamily:"'JetBrains Mono'",fontSize:13,fontWeight:600}}>{fmtRu(rental.startDate)}</div>
        </div>
        <div style={{flex:1,height:2,background:"#E2E8F0",borderRadius:1,position:"relative"}}>
          <div style={{position:"absolute",inset:0,background:`linear-gradient(90deg, ${isOv?"#DC2626":"#059669"}, ${isOv?"#DC2626":"#059669"})`,borderRadius:1,opacity:.5}}></div>
        </div>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:10,color:"#94A3B8",marginBottom:2}}>КОНЕЦ</div>
          <div style={{fontFamily:"'JetBrains Mono'",fontSize:13,fontWeight:600}}>{fmtRu(rental.endDate)}</div>
        </div>
        <span className="tag" style={{background:isOv?"#FEF2F2":"#ECFDF5",color:isOv?"#DC2626":"#059669",fontFamily:"'JetBrains Mono'"}}>
          {isOv?`-${Math.abs(dl)} дн.`:dl===0?"сегодня":`${dl} дн.`}
        </span>
      </div>
    </div>

    {rental.documents&&<div style={{background:"#F8FAFC",borderRadius:9,padding:"10px 13px",marginBottom:10}}>
      <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:3,letterSpacing:".06em"}}>ДОКУМЕНТЫ</div>
      <div style={{fontSize:13,color:"#0F172A"}}>{rental.documents}</div>
    </div>}
    {rental.notes&&<div style={{background:"#F8FAFC",borderRadius:9,padding:"10px 13px",marginBottom:10}}>
      <div style={{fontSize:10,color:"#94A3B8",fontWeight:600,marginBottom:3,letterSpacing:".06em"}}>ПРИМЕЧАНИЯ</div>
      <div style={{fontSize:13,color:"#475569",lineHeight:1.6}}>{rental.notes}</div>
    </div>}

    <div style={{display:"flex",gap:8,marginTop:16}}>
      <button className="btn btn-secondary" style={{flex:1,justifyContent:"center"}} onClick={onEdit}>✏️ Редактировать</button>
      <button className="btn btn-danger" style={{flex:1,justifyContent:"center"}} onClick={onEnd}>Завершить аренду</button>
    </div>
  </>;
}

function RentalForm({cars,initial,onSave,onCancel}){
  const[f,setF]=useState({carId:"",clientName:"",phone:"",city:"",location:"",startDate:fmtDate(new Date()),endDate:"",price:"",documents:"",notes:"",...initial,carId:initial.carId?String(initial.carId):""});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function submit(){if(!f.carId||!f.clientName||!f.endDate)return alert("Заполните: авто, имя, дата окончания");onSave({...f,carId:Number(f.carId)})}
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div>
      <label className="label">АВТОМОБИЛЬ *</label>
      <select className="input" value={f.carId} onChange={e=>s("carId",e.target.value)}>
        <option value="">Выберите авто...</option>
        {cars.map(c=><option key={c.id} value={c.id}>{c.brand} {c.model}{c.plate?" · "+c.plate:""}</option>)}
      </select>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">ИМЯ КЛИЕНТА *</label><input className="input" value={f.clientName} onChange={e=>s("clientName",e.target.value)} placeholder="Владислав"/></div>
      <div><label className="label">ТЕЛЕФОН</label><input className="input" value={f.phone} onChange={e=>s("phone",e.target.value)} placeholder="+34 644 136 487"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">ГОРОД</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="Валенсия"/></div>
      <div><label className="label">МЕСТО ПОДАЧИ</label><input className="input" value={f.location} onChange={e=>s("location",e.target.value)} placeholder="Аэропорт T4"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
      <div><label className="label">НАЧАЛО</label><input className="input" type="date" value={f.startDate} onChange={e=>s("startDate",e.target.value)}/></div>
      <div><label className="label">КОНЕЦ *</label><input className="input" type="date" value={f.endDate} onChange={e=>s("endDate",e.target.value)}/></div>
      <div><label className="label">ЦЕНА €/сут.</label><input className="input" type="number" value={f.price} onChange={e=>s("price",e.target.value)} placeholder="40"/></div>
    </div>
    <div><label className="label">ДОКУМЕНТЫ</label><input className="input" value={f.documents} onChange={e=>s("documents",e.target.value)} placeholder="Паспорт РФ, права..."/></div>
    <div><label className="label">ПРИМЕЧАНИЯ</label><textarea className="input" rows={2} value={f.notes} onChange={e=>s("notes",e.target.value)} style={{resize:"vertical"}} placeholder="Депозит, особые условия..."/></div>
    <div style={{display:"flex",gap:8,marginTop:4}}>
      <button className="btn btn-secondary" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-primary" style={{flex:2,justifyContent:"center"}} onClick={submit}>Сохранить</button>
    </div>
  </div>;
}

function CarForm({onSave,onCancel}){
  const[f,setF]=useState({brand:"",model:"",plate:"",city:""});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function submit(){if(!f.brand||!f.model)return alert("Укажите марку и модель");onSave(f)}
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">МАРКА *</label><input className="input" value={f.brand} onChange={e=>s("brand",e.target.value)} placeholder="Toyota"/></div>
      <div><label className="label">МОДЕЛЬ *</label><input className="input" value={f.model} onChange={e=>s("model",e.target.value)} placeholder="Yaris"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">НОМЕР АВТО</label><input className="input" value={f.plate} onChange={e=>s("plate",e.target.value)} placeholder="1234 AB"/></div>
      <div><label className="label">ГОРОД БАЗИРОВАНИЯ</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="Valencia"/></div>
    </div>
    <div style={{background:"#F8FAFC",borderRadius:8,padding:"10px 12px",fontSize:12,color:"#64748B"}}>
      После добавления используй название модели <b>{f.model||"Модель"}</b> в событиях Google Calendar для автосинхронизации.
    </div>
    <div style={{display:"flex",gap:8}}>
      <button className="btn btn-secondary" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-primary" style={{flex:2,justifyContent:"center"}} onClick={submit}>Добавить авто</button>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
