  async function createCalEvent(r){if(!signedIn)return null;try{const res=await window.gapi.client.calendar.events.insert({calendarId:"primary",resource:toGoogleEvent(r,carsRef.current)});return res.result.id}catch(e){console.error("Calendar create error",e);return null}}
  async function updateCalEvent(r){
    if(!signedIn)return null;
    if(!r.googleEventId)return await createCalEvent(r);
    try{await window.gapi.client.calendar.events.update({calendarId:"primary",eventId:r.googleEventId,resource:toGoogleEvent(r,carsRef.current)})}catch(e){console.error("Calendar update error",e)}
    return r.googleEventId;
  }
  async function deleteCalEvent(r){
    if(!signedIn||!r.googleEventId)return;
    try{await window.gapi.client.calendar.events.delete({calendarId:"primary",eventId:r.googleEventId})}catch(e){console.error("Calendar delete error",e)}
  }

  async function saveRental(data){
    if(editRental){
      let u={...editRental,...data,updatedAt:nowISO()};
      const gid=await updateCalEvent(u);
      if(gid&&!u.googleEventId)u={...u,googleEventId:gid};
      setRentals(r=>r.map(x=>x.id===editRental.id?u:x));
    }
    else{
      const n={...data,id:Date.now(),active:true,updatedAt:nowISO()};
      const gid=await createCalEvent(n);
      if(gid)n.googleEventId=gid;
      setRentals(r=>[...r,n]);
    }
    setShowForm(false);setEditRental(null);setPrefillCarId(null);
  }

  // Завершение аренды: открывает модалку. Реальное завершение — в confirmEndRental.
  function openEndRental(rental){setEndingRental(rental);setSelected(null)}
  async function confirmEndRental(updates){
    if(!endingRental)return;
    const r=rentalsRef.current.find(x=>x.id===endingRental.id);
    if(r)deleteCalEvent(r);
    setRentals(rs=>rs.map(x=>{
      if(x.id!==endingRental.id)return x;
      // НЕ обнуляем googleEventId — пусть аренда остаётся "привязанной" к событию календаря.
      // Если удаление события в Calendar не успело пройти, следующий syncCalendar сматчит её
      // по googleEventId и сохранит active:false. Без этой ссылки старая аренда воскресает как новая.
      const patch={...x,active:false,endedAt:fmtDate(new Date()),updatedAt:nowISO()};
      if(updates.mileageIn!==undefined&&updates.mileageIn!=="")patch.mileageIn=updates.mileageIn;
      if(updates.price!==undefined&&updates.price!=="")patch.price=updates.price;
      if(updates.depositReturned!==undefined)patch.depositReturned=updates.depositReturned;
      return patch;
    }));
    if(updates.updateCarServiceMileage){
      const carId=endingRental.carId;
      const car=carsRef.current.find(c=>c.id===carId);
      const oldLast=parseInt(car?.lastServiceMileage)||0;
      const oldNext=parseInt(car?.nextServiceMileage)||(oldLast+10000);
      const interval=Math.max(oldNext-oldLast,5000)||10000;
      const newLast=updates.updateCarServiceMileage;
      const newNext=newLast+interval;
      setCars(cs=>cs.map(c=>c.id===carId?{...c,lastServiceMileage:String(newLast),nextServiceMileage:String(newNext),updatedAt:nowISO()}:c));
    }
    setEndingRental(null);
  }

  function saveCar(data){
    if(editCarId)setCars(c=>c.map(x=>x.id===editCarId?{...x,...data,updatedAt:nowISO()}:x));
    else{const color=CAR_COLORS[cars.length%CAR_COLORS.length];setCars(c=>[...c,{id:Date.now(),color,...data,updatedAt:nowISO()}])}
    setShowCarForm(false);setEditCarId(null);
  }

  // Переподача аренды с авто A на авто B + (опц) отправка A в ремонт
  async function confirmTransferRental(updates){
    if(!transferRental)return;
    const oldRental=rentalsRef.current.find(r=>r.id===transferRental.id);
    if(!oldRental)return;
    const oldCar=carsRef.current.find(c=>c.id===oldRental.carId);
    const newCar=carsRef.current.find(c=>c.id===updates.newCarId);
    const td=updates.transferDate;
    const oldNote=`🔄 ${td}: переход на ${newCar?`${newCar.brand} ${newCar.model}`:"другое авто"}${updates.reason?` — ${updates.reason}`:""}`;
    const newNote=`🔄 ${td}: переподача с ${oldCar?`${oldCar.brand} ${oldCar.model}`:"другого авто"}${updates.reason?` — ${updates.reason}`:""}`;
    const updatedOld={...oldRental,
      active:false,
      endedAt:td,
      endDate:td,
      mileageIn:updates.oldMileage||oldRental.mileageIn||"",
      notes:oldRental.notes?`${oldRental.notes}\n${oldNote}`:oldNote,
      googleEventId:undefined,
      updatedAt:nowISO(),
    };
    // Delete old Calendar event
    if(oldRental.googleEventId&&signedIn){
      try{await window.gapi.client.calendar.events.delete({calendarId:"primary",eventId:oldRental.googleEventId})}catch(e){console.error("Calendar delete on transfer",e)}
    }
    const newRental={...oldRental,
      id:Date.now(),
      carId:updates.newCarId,
      startDate:td,
      endDate:oldRental.endDate,
      mileageOut:updates.newMileage||"",
      mileageIn:"",
      active:true,
      endedAt:undefined,
      notes:oldRental.notes?`${oldRental.notes}\n${newNote}`:newNote,
      googleEventId:undefined,
      fromGoogle:false,
      updatedAt:nowISO(),
    };
    const newGid=await createCalEvent(newRental);
    if(newGid)newRental.googleEventId=newGid;
    setRentals(rs=>{
      const without=rs.filter(r=>r.id!==oldRental.id);
      return[...without,updatedOld,newRental];
    });
    if(updates.sendOldToRepair&&oldCar){
      setCars(cs=>cs.map(c=>c.id===oldCar.id?{...c,inRepair:true,repairNotes:updates.reason||c.repairNotes||"После переподачи клиента",updatedAt:nowISO()}:c));
    }
    setTransferRental(null);
    setSelected(null);
  }

  function rentalForDay(cid,day){
    // Возвращает аренду для конкретного дня. Завершённые тоже учитываются как история,
    // но если на день есть и активная и завершённая — активная в приоритете.
    const matches=rentals.filter(r=>{
      if(r.carId!==cid)return false;
      const s=parseDate(r.startDate);s.setHours(0,0,0,0);
      // У завершённых аренд эффективный конец = endedAt (если есть), а не оригинальный endDate
      const endStr=(!r.active&&r.endedAt)?r.endedAt:r.endDate;
      const e=parseDate(endStr);e.setHours(0,0,0,0);
      return day>=s&&day<=e;
    });
    return matches.find(r=>r.active)||matches[0]||null;

        {/* Clickable stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:12,marginBottom:20}}>
          <StatCard icon="🚗" label="Всего авто" value={cars.length} color="#38BDF8" bg="#38BDF818" onClick={()=>setQuickList(null)}/>
          <StatCard icon="🔑" label="В аренде" value={activeR.length} color="#34D399" bg="#34D39918" onClick={()=>setQuickList({title:"В аренде прямо сейчас",rentals:activeR,color:"#34D399"})}/>
          <StatCard icon="📅" label="Резерв" value={reservedR.length} color="#FBBF24" bg="#FBBF2418" onClick={()=>setQuickList({title:"Предстоящий резерв",rentals:reservedR,color:"#FBBF24"})}/>
          <StatCard icon="⚠️" label="Просрочено" value={overdueR.length} color="#F87171" bg="#F8717118" onClick={()=>setQuickList({title:"Просроченные аренды",rentals:overdueR,color:"#F87171"})}/>
          <StatCard icon="🅿️" label="Свободно" value={freeCount} color="#94A3B8" bg="rgba(148,163,184,.18)" onClick={()=>setQuickList({title:"Свободные авто",rentals:[],color:"#94A3B8",isFree:true,cars:cars.filter(c=>!c.inRepair&&getCarStatus(c.id,rentals).status==="free")})}/>
          <StatCard icon="🔧" label="В ремонте" value={repairCars.length} color="#A78BFA" bg="#A78BFA18" onClick={()=>setQuickList({title:"Авто в ремонте",rentals:[],color:"#A78BFA",isFree:true,cars:repairCars})}/>
        </div>

        <WarningsStrip rentals={rentals} cars={cars} onSelect={setSelected}/>

        <div className="content-grid">
          <div style={{minWidth:0}}>
            {view==="timeline"&&<Timeline cars={cars} days={days} today={today} monthLabel={monthLabel} monthOffset={monthOffset} setMonthOffset={setMonthOffset} rentalForDay={rentalForDay} onRentalClick={setSelected} onRepairClick={cid=>{setEditCarId(cid);setShowCarForm(true)}}/>}

            {view==="finance"&&<Stats rentals={rentals} cars={cars}/>}

            {view==="map"&&(!lobboCreds?(
              <div className="card" style={{padding:"60px 24px",textAlign:"center"}}>
                <div style={{fontSize:54,marginBottom:14,opacity:.30}}>🔒</div>
                <div style={{fontSize:18,fontWeight:700,marginBottom:8,letterSpacing:"-.01em"}}>Карта недоступна</div>
                <div style={{fontSize:13,color:"var(--text2)",marginBottom:22,lineHeight:1.55,maxWidth:380,marginLeft:"auto",marginRight:"auto"}}>
                  Локации авто видны только после подключения трекеров LOBBO.<br/>
                  Без подключения данные не отображаются — информация защищена.
                </div>
                <button className="btn btn-teal" style={{padding:"11px 24px"}} onClick={()=>setShowLobboModal(true)}>🛰 Подключить LOBBO</button>
              </div>
            ):(
              <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:14,alignItems:"start"}}>
                <div style={{display:"flex",flexDirection:"column",gap:14,minWidth:0}}>
                  <MiniMap cars={cars} trackerData={trackerData} onSelectCar={setSelectedMapCarId} height={Math.max(window.innerHeight-340,500)} hideHeader/>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
                    {cars.filter(c=>trackerData[c.id]).map(car=>{
                      const td=trackerData[car.id];
                      const speedKmh=td.speed?Math.round(td.speed*SPEED_KNOTS_TO_KMH):0;
                      const moving=speedKmh>2;
                      const sel=selectedMapCarId===car.id;
                      return(
                        <div key={car.id} className="card" style={{padding:"9px 12px",cursor:"pointer",borderColor:sel?car.color:"var(--border)",background:sel?car.color+"15":"var(--bg2)",transition:"all .15s"}} onClick={()=>setSelectedMapCarId(car.id)}>
                          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                            <div style={{width:7,height:7,borderRadius:"50%",background:car.color,boxShadow:`0 0 5px ${car.color}80`,flexShrink:0}}/>
                            <div style={{fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{car.brand} {car.model}</div>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:10}}>
                            <span style={{color:moving?"#34D399":"var(--text3)",fontWeight:moving?700:500}}>{moving?`🏁 ${speedKmh} км/ч`:"🅿️"}</span>
                            <span style={{color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{relativeTimeRu(td.fixTime)}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <aside style={{position:"sticky",top:80}}>
                  {!selectedMapCarId?(
                    <div className="card" style={{padding:"40px 20px",textAlign:"center"}}>
                      <div style={{fontSize:34,marginBottom:10,opacity:.35}}>👈</div>
                      <div style={{fontSize:13,fontWeight:600,color:"var(--text2)",marginBottom:6}}>Кликни машину на карте</div>
                      <div style={{fontSize:11,color:"var(--text3)",lineHeight:1.55}}>или выбери из списка ниже — здесь покажу её данные и текущую аренду</div>
                    </div>
                  ):(()=>{
                    const car=cars.find(c=>c.id===selectedMapCarId);
                    if(!car){return <div className="card" style={{padding:20,textAlign:"center",color:"var(--text3)"}}>Авто не найдено</div>}
                    const td=trackerData[car.id];
                    const realKm=getRealTrackerMileage(car,trackerData);
                    const carStatus=car.inRepair?{status:"repair",rental:null}:getCarStatus(car.id,rentals);
                    const sc=SC[carStatus.status];
                    const activeR=rentals.find(r=>r.carId===car.id&&r.active&&getRentalStatus(r)==="active");
                    const overdueR=rentals.find(r=>r.carId===car.id&&r.active&&getRentalStatus(r)==="overdue");
                    const reservedR=rentals.find(r=>r.carId===car.id&&r.active&&getRentalStatus(r)==="reserved");
                    const curRental=activeR||overdueR;
                    return <div className="card" style={{padding:0,overflow:"hidden"}}>
                      <div style={{padding:"14px 16px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:10}}>
                        <div style={{width:38,height:38,borderRadius:9,background:car.color+"22",border:`1px solid ${car.color}55`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          <div style={{width:13,height:13,borderRadius:"50%",background:car.color,boxShadow:`0 0 7px ${car.color}90`}}/>
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:15,fontWeight:700,letterSpacing:"-.01em",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{car.brand} {car.model}</div>
                          <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginTop:1}}>{car.plate||"—"}{car.city?` · ${car.city}`:""}</div>
                        </div>
                        <span className="tag" style={{background:sc.bg,color:sc.color,flexShrink:0}}>{sc.label}</span>
                      </div>
                      {td?(
                        <div style={{padding:"12px 16px",background:"rgba(56,189,248,.07)",borderBottom:"1px solid var(--border)"}}>
                          <div style={{fontSize:10,color:"var(--text3)",fontWeight:700,letterSpacing:".05em",marginBottom:9}}>🛰 С ТРЕКЕРА</div>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,fontSize:12}}>
                            {realKm!=null&&<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600}}>ПРОБЕГ</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'",color:"var(--teal)"}}>{realKm.toLocaleString("ru-RU")} км</div></div>}
                            {td.speed!=null&&(()=>{const kmh=Math.round(td.speed*SPEED_KNOTS_TO_KMH);return<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600}}>СКОРОСТЬ</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'",color:kmh>SPEED_ALERT_KMH?"#F87171":kmh>2?"#34D399":"var(--text2)"}}>{kmh>2?`${kmh} км/ч`:"🅿️ стоит"}</div></div>})()}
                            {td.battery!=null&&<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600}}>БАТАРЕЯ</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'",color:td.battery<20?"#F87171":"var(--text2)"}}>{td.battery}%</div></div>}
                            {td.fixTime&&<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600}}>СИГНАЛ</div><div style={{fontSize:13,fontWeight:600,color:"var(--text2)"}}>{relativeTimeRu(td.fixTime)}</div></div>}
                          </div>
                          {td.lat!=null&&<a href={`https://maps.google.com/?q=${td.lat},${td.lon}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:6,marginTop:11,padding:"8px 11px",background:"var(--bg)",borderRadius:6,fontSize:11,color:"var(--teal)",textDecoration:"none",fontFamily:"'JetBrains Mono'"}}>📍 {td.lat.toFixed(4)}, {td.lon.toFixed(4)} ↗</a>}
                        </div>
                      ):<div style={{padding:"18px 16px",textAlign:"center",color:"var(--text3)",fontSize:12,borderBottom:"1px solid var(--border)"}}>Нет данных с трекера</div>}
                      {curRental&&(()=>{const dl=daysLeft(curRental.endDate);return<div style={{padding:"12px 16px",borderBottom:"1px solid var(--border)",cursor:"pointer"}} onClick={()=>setSelected(curRental)}>
                        <div style={{fontSize:10,color:"var(--text3)",fontWeight:700,letterSpacing:".05em",marginBottom:7}}>🔑 ТЕКУЩАЯ АРЕНДА</div>
                        <div style={{fontSize:14,fontWeight:600,marginBottom:3}}>{curRental.clientName}</div>
                        <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginBottom:3}}>{fmtRu(curRental.startDate)} → {fmtRu(curRental.endDate)}</div>
                        <div style={{fontSize:11,color:dl<0?"#F87171":dl===0?"#FBBF24":"var(--text2)",fontWeight:600}}>{dl<0?`просрочено ${Math.abs(dl)}д`:dl===0?"возврат сегодня":`осталось ${dl} дн`}</div>
                        {curRental.phone&&<div style={{fontSize:11,color:"var(--teal)",marginTop:3}}>{curRental.phone}</div>}
                      </div>})()}
                      {reservedR&&!curRental&&<div style={{padding:"12px 16px",borderBottom:"1px solid var(--border)",cursor:"pointer"}} onClick={()=>setSelected(reservedR)}>
                        <div style={{fontSize:10,color:"var(--text3)",fontWeight:700,letterSpacing:".05em",marginBottom:7}}>📅 БЛИЖАЙШИЙ РЕЗЕРВ</div>
                        <div style={{fontSize:14,fontWeight:600,marginBottom:3}}>{reservedR.clientName}</div>
                        <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>с {fmtRu(reservedR.startDate)} · через {daysUntil(reservedR.startDate)} дн</div>
                      </div>}
                      {car.inRepair&&<div style={{padding:"12px 16px",borderBottom:"1px solid var(--border)",background:"rgba(167,139,250,.08)"}}>
                        <div style={{fontSize:10,color:"#A78BFA",fontWeight:700,letterSpacing:".05em",marginBottom:6}}>🔧 В РЕМОНТЕ</div>
                        {car.repairNotes&&<div style={{fontSize:12,color:"var(--text2)",lineHeight:1.5}}>{car.repairNotes}</div>}
                      </div>}
                      <div style={{padding:"12px 16px",display:"flex",gap:8}}>
                        <button className="btn btn-ghost" style={{flex:1,justifyContent:"center",padding:"8px 12px",fontSize:13}} onClick={()=>{setEditCarId(car.id);setShowCarForm(true)}}>✏️ Редактировать</button>
                        <button className="btn btn-ghost" style={{justifyContent:"center",padding:"8px 12px",fontSize:13}} onClick={()=>setSelectedMapCarId(null)} title="Снять выделение">✕</button>
                      </div>
                    </div>;
                  })()}
                </aside>
              </div>
            ))}

        {view==="cars"&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
            {cars.map(car=>{
              const carStatus=car.inRepair?{status:"repair",rental:null}:getCarStatus(car.id,rentals);
              const{status,rental}=carStatus;
              const sc=SC[status];
              const nextServ=parseInt(car.nextServiceMileage);
              const currentMileage=getCarCurrentMileage(car,rentals,trackerData);
              const toRemaining=nextServ?nextServ-currentMileage:null;
              const toAlert=toRemaining!=null&&toRemaining<=1500;
              return(
                <div key={car.id} className="card">
                  <div style={{padding:"13px 15px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:34,height:34,borderRadius:9,background:car.color+"20",border:`1px solid ${car.color}40`,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:10,height:10,borderRadius:"50%",background:car.color}}></div></div>
                      <div>
                        <div style={{fontSize:14,fontWeight:700}}>{car.brand} {car.model}</div>
                        <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginTop:1}}>{car.plate||"Нет номера"}{car.city?` · ${car.city}`:""}</div>
                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span className="tag" style={{background:sc.bg,color:sc.color}}><span style={{width:5,height:5,borderRadius:"50%",background:sc.dot,display:"inline-block"}}></span>{sc.label}</span>
                      <button className="btn btn-ghost btn-sm" style={{padding:"4px 8px"}} onClick={()=>{setEditCarId(car.id);setShowCarForm(true)}}>✏️</button>
                    </div>
                  </div>
                  {toAlert&&(
                    <div style={{padding:"9px 15px",borderBottom:"1px solid var(--border)",background:toRemaining<=0?"#F8717118":"#FBBF2418",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                      <div style={{fontSize:11,fontWeight:700,color:toRemaining<=0?"#F87171":"#FBBF24",letterSpacing:".03em"}}>🔧 {toRemaining<=0?`ТО ПРОСРОЧЕНО +${Math.abs(toRemaining)} КМ`:`ТО ЧЕРЕЗ ${toRemaining} КМ`}</div>
                      <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{currentMileage} / {nextServ}</div>
                    </div>
                  )}
                  {/* Service info */}
                  {(car.lastServiceMileage||car.nextServiceMileage)&&(
                    <div style={{padding:"8px 15px",borderBottom:"1px solid var(--border)",display:"flex",gap:16,background:"var(--bg3)"}}>
                      {car.lastServiceMileage&&<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ПОСЛ. ТО</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{car.lastServiceMileage} км</div></div>}
                      {car.nextServiceMileage&&<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>СЛЕД. ТО</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--teal)"}}>{car.nextServiceMileage} км</div></div>}
                      {nextServ&&<div style={{marginLeft:"auto"}}><div style={{fontSize:9,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ТЕКУЩИЙ</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:toAlert?(toRemaining<=0?"#F87171":"#FBBF24"):"var(--text2)"}}>{currentMileage} км</div></div>}
                    </div>
                  )}
                  {trackerData[car.id]&&(()=>{
                    const td=trackerData[car.id];
                    const hasCoords=td.lat!=null&&td.lon!=null;
                    const real=getRealTrackerMileage(car,trackerData);
                    const showCalibWarn=td.mileage!=null&&real==null;
                    return(
                      <div style={{padding:"8px 15px",borderBottom:"1px solid var(--border)",background:"rgba(56,189,248,.07)",display:"flex",alignItems:"center",gap:9}}>
                        <span style={{fontSize:13}}>🛰</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
                            {real!=null?<div style={{fontSize:12,fontFamily:"'JetBrains Mono'",fontWeight:600,color:"var(--teal)"}} title="реальный одометр (трекер + offset)">{real.toLocaleString("ru-RU")} км</div>:td.mileage!=null&&<div style={{fontSize:12,fontFamily:"'JetBrains Mono'",fontWeight:600,color:"#FBBF24"}} title="трекерный пробег с момента установки — нужна калибровка">{td.mileage.toLocaleString("ru-RU")} км ⚠</div>}
                            {td.speed*SPEED_KNOTS_TO_KMH>2&&<div style={{fontSize:10,color:Math.round(td.speed*SPEED_KNOTS_TO_KMH)>SPEED_ALERT_KMH?"#F87171":"#34D399",fontWeight:600}}>{Math.round(td.speed*SPEED_KNOTS_TO_KMH)} км/ч</div>}
                            {td.ignition===false&&<div style={{fontSize:10,color:"var(--text3)",fontWeight:600}}>🅿️</div>}
                            {td.battery!=null&&td.battery<20&&<div style={{fontSize:10,color:"#F87171",fontWeight:600}}>🔋 {td.battery}%</div>}
                            {showCalibWarn&&<div onClick={e=>{e.stopPropagation();setEditCarId(car.id);setShowCarForm(true)}} style={{fontSize:9,color:"#FBBF24",fontWeight:600,cursor:"pointer",textDecoration:"underline"}}>откалибровать</div>}
                          </div>
                          {td.address?(
                            <div style={{fontSize:10,color:"var(--text3)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginTop:1}}>📍 {td.address}</div>
                          ):hasCoords?(
                            <a href={`https://maps.google.com/?q=${td.lat},${td.lon}`} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{fontSize:10,color:"var(--teal)",textDecoration:"none",fontFamily:"'JetBrains Mono'",display:"inline-block",marginTop:1}}>📍 {td.lat.toFixed(4)}, {td.lon.toFixed(4)} ↗</a>
                          ):null}
                        </div>
                        <div style={{fontSize:10,color:"var(--text3)",flexShrink:0,fontFamily:"'JetBrains Mono'"}}>{relativeTimeRu(td.fixTime)}</div>
                      </div>
                    );
                  })()}
                  {status==="repair"?(
                    <div style={{padding:"13px 15px",background:"#A78BFA08"}}>
                      <div style={{color:"#A78BFA",fontSize:13,fontWeight:700,marginBottom:6,textAlign:"center"}}>🔧 В ремонте</div>
                      {car.repairNotes&&<div style={{color:"var(--text3)",fontSize:12,marginBottom:10,lineHeight:1.5,textAlign:"center"}}>{car.repairNotes}</div>}
                      <button className="btn btn-teal btn-sm" style={{width:"100%",justifyContent:"center"}} onClick={()=>setCars(cs=>cs.map(c=>c.id===car.id?{...c,inRepair:false,repairNotes:"",updatedAt:nowISO()}:c))}>✓ Вернуть в строй</button>
                    </div>
                  ):rental?(
                    <div style={{padding:"13px 15px",cursor:"pointer"}} onClick={()=>setSelected(rental)}>
                      <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>{rental.clientName}</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:6}}>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ТЕЛЕФОН</div><div style={{fontSize:12,color:"var(--teal)",fontWeight:500}}>{rental.phone||"—"}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ГОРОД</div><div style={{fontSize:12}}>{rental.city||"—"}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>НАЧАЛО</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{fmtRu(rental.startDate)}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>КОНЕЦ</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{fmtRu(rental.endDate)}</div></div>
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",paddingTop:8,borderTop:"1px solid var(--border)"}}>
                        {rental.price?<div style={{fontSize:13,fontWeight:700,color:"#34D399"}}>{rental.price} €</div>:<div/>}
                        <div style={{fontSize:11,fontWeight:600,color:sc.color}}>
                          {status==="reserved"?`Через ${daysUntil(rental.startDate)} дн.`:status==="overdue"?`Просрочено ${Math.abs(daysLeft(rental.endDate))} дн.`:daysLeft(rental.endDate)===0?"Сегодня возврат":`${daysLeft(rental.endDate)} дн.`}
                        </div>
                      </div>
                    </div>
                  ):(
                    <div style={{padding:"13px 15px"}}>
                      <div style={{color:"var(--text3)",fontSize:13,marginBottom:10,textAlign:"center"}}>Машина свободна</div>
                      <div style={{display:"flex",gap:6}}>
                        <button className="btn btn-teal btn-sm" style={{flex:1,justifyContent:"center"}} onClick={()=>{setEditRental(null);setPrefillCarId(car.id);setShowForm(true)}}>+ Аренда</button>
                        <button className="btn btn-ghost btn-sm" title="Отправить в ремонт" style={{justifyContent:"center",color:"#A78BFA",borderColor:"#A78BFA40",padding:"7px 12px"}} onClick={()=>{if(confirm(`Отправить ${car.brand} ${car.model} в ремонт?`))setCars(cs=>cs.map(c=>c.id===car.id?{...c,inRepair:true,updatedAt:nowISO()}:c))}}>🔧</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {view==="clients"&&(
          <div>
            <div className="card" style={{marginBottom:14,overflow:"hidden"}}>
              <div style={{display:"flex",overflowX:"auto",padding:"0 8px",borderBottom:"1px solid var(--border)"}}>
                {clientTabs.map(t=>(
                  <button key={t.key} className={"tab-btn"+(clientsTab===t.key?" active":"")} onClick={()=>setClientsTab(t.key)} style={{color:clientsTab===t.key?t.color:"var(--text3)",borderBottomColor:clientsTab===t.key?t.color:"transparent"}}>
                    {t.label}<span style={{background:clientsTab===t.key?t.color+"25":"var(--bg3)",color:clientsTab===t.key?t.color:"var(--text3)",borderRadius:20,padding:"1px 7px",fontSize:10,marginLeft:4,fontWeight:700}}>{t.count}</span>
                  </button>
                ))}
              </div>
            </div>
            {tabRentals[clientsTab].length===0?(
              <div style={{textAlign:"center",padding:"60px",color:"var(--text3)",fontSize:14}}>
                {clientsTab==="done"?"Завершённые аренды появятся здесь":"Нет записей"}
              </div>
            ):(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:12}}>

function Timeline({cars,days,today,monthLabel,monthOffset,setMonthOffset,rentalForDay,onRentalClick,onRepairClick}){
  const RH=40,LW=190;
  const N=days.length;
  const pct=v=>`${(v/N)*100}%`;
  function getBlocks(carId){
    const blocks=[];let i=0;
    while(i<N){const r=rentalForDay(carId,days[i]);if(r){let j=i;while(j<N&&rentalForDay(carId,days[j])?.id===r.id)j++;blocks.push({rental:r,startIdx:i,dayCount:j-i});i=j}else i++}
    return blocks;
  }
  return(
    <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,boxShadow:"var(--shadow-sm)"}}>
      {/* Month nav header */}
      <div style={{padding:"12px 18px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg3)",borderRadius:"12px 12px 0 0"}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o-1)} style={{padding:"7px 12px"}}>←</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".06em",textTransform:"uppercase"}}>{monthOffset===0?"Текущий месяц":monthOffset<0?`${Math.abs(monthOffset)} мес. назад`:`+${monthOffset} мес.`}</div>
          <div style={{fontSize:17,fontWeight:700,textTransform:"capitalize",marginTop:1,letterSpacing:"-.01em"}}>{monthLabel}</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          {monthOffset!==0&&<button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(0)} style={{padding:"7px 12px",color:"var(--teal)"}}>Сегодня</button>}
          <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o+1)} style={{padding:"7px 12px"}}>→</button>
        </div>
      </div>
      {/* Legend */}
      <div style={{padding:"8px 18px",borderBottom:"1px solid var(--border)",display:"flex",gap:18,background:"var(--bg3)",alignItems:"center"}}>
        {[{c:"#34D399",l:"В аренде"},{c:"#FBBF24",l:"Резерв"},{c:"#F87171",l:"Просрочено"}].map(x=>(
          <div key={x.l} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text2)",fontWeight:500}}>
            <div style={{width:18,height:5,background:x.c,borderRadius:3,boxShadow:`0 0 6px ${x.c}40`}}></div>{x.l}
          </div>
        ))}
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text3)",fontWeight:500}}>
          <div style={{width:18,height:5,borderRadius:3,background:"repeating-linear-gradient(135deg,#64748B55,#64748B55 3px,#64748B30 3px,#64748B30 6px)",border:"1px dashed #64748B90"}}></div>завершено
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text3)",fontWeight:500}}>
          <div style={{width:18,height:5,borderRadius:3,background:"repeating-linear-gradient(135deg,#A78BFA55,#A78BFA55 3px,#A78BFA30 3px,#A78BFA30 6px)",border:"1px dashed #A78BFA90"}}></div>в ремонте
        </div>
        <div style={{marginLeft:"auto",fontSize:11,color:"var(--text3)",display:"flex",alignItems:"center",gap:6}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:"var(--teal)",boxShadow:"0 0 5px var(--teal)"}}></div>сегодня
        </div>
      </div>
      {/* Sticky day header row */}
      <div style={{display:"flex",borderBottom:"1px solid var(--border)",background:"var(--bg3)",position:"sticky",top:70,zIndex:20}}>
        <div style={{width:LW,minWidth:LW,padding:"7px 14px",fontSize:11,fontWeight:700,color:"var(--text3)",letterSpacing:".06em",borderRight:"1px solid var(--border)",display:"flex",alignItems:"center"}}>АВТОМОБИЛЬ</div>
        <div style={{flex:1,display:"grid",gridTemplateColumns:`repeat(${N},1fr)`,minWidth:0}}>
          {days.map(day=>{
            const iT=sameDay(day,today),iW=day.getDay()===0||day.getDay()===6;
            return <div key={day.toISOString()} style={{textAlign:"center",padding:"5px 0 6px",fontFamily:"'JetBrains Mono'",color:iT?"var(--teal)":iW?"var(--text3)":"var(--text2)",background:iT?"var(--teal-dim)":iW?"rgba(0,0,0,.10)":"transparent",fontWeight:iT?800:500,borderLeft:"1px solid var(--border)",overflow:"hidden"}}>
              <div style={{fontSize:9,opacity:.7,letterSpacing:".03em"}}>{["В","П","В","С","Ч","П","С"][day.getDay()]}</div>
              <div style={{width:iT?20:undefined,height:iT?20:undefined,background:iT?"var(--teal)":undefined,color:iT?"#0F1116":undefined,borderRadius:iT?"50%":undefined,display:iT?"inline-flex":"inline",alignItems:iT?"center":undefined,justifyContent:iT?"center":undefined,fontSize:12,fontWeight:800,lineHeight:iT?"20px":"1.2",boxShadow:iT?"0 0 8px rgba(56,189,248,.45)":undefined,marginTop:2}}>{day.getDate()}</div>
            </div>;
          })}
        </div>
      </div>
      {/* Car rows */}
      {cars.map((car,ci)=>{
        const blocks=getBlocks(car.id);
        const rowBg=ci%2?"var(--bg3)":"var(--bg2)";
        return(
          <div key={car.id} style={{display:"flex",borderBottom:"1px solid var(--border)",background:rowBg,height:RH}}>
            <div style={{width:LW,minWidth:LW,padding:"0 14px",display:"flex",alignItems:"center",gap:9,borderRight:"1px solid var(--border)"}}>
              <div style={{width:26,height:26,borderRadius:7,background:car.color+"22",border:`1px solid ${car.color}55`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:car.color,boxShadow:`0 0 5px ${car.color}90`}}></div>
              </div>
              <div style={{overflow:"hidden",minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",letterSpacing:"-.01em",lineHeight:1.2}}>{car.brand} {car.model}</div>
                {car.plate&&<div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginTop:1,lineHeight:1}}>{car.plate}</div>}
              </div>
            </div>
            <div style={{flex:1,position:"relative",display:"grid",gridTemplateColumns:`repeat(${N},1fr)`,minWidth:0}}>
              {days.map(day=>{
                const iT=sameDay(day,today),iW=day.getDay()===0||day.getDay()===6;
                return <div key={day.toISOString()} style={{height:RH,background:iT?"var(--teal-dim2)":iW?"rgba(0,0,0,.05)":"transparent",borderLeft:iT?"1px solid rgba(56,189,248,.30)":"1px solid var(--border)"}}/>;
              })}
              {car.inRepair&&<div onClick={e=>{e.stopPropagation();onRepairClick&&onRepairClick(car.id)}}
                title={`🔧 В ремонте${car.repairNotes?` — ${car.repairNotes}`:""}`}
                style={{position:"absolute",left:3,right:3,top:5,height:RH-10,background:"repeating-linear-gradient(135deg,rgba(167,139,250,.18),rgba(167,139,250,.18) 9px,rgba(167,139,250,.36) 9px,rgba(167,139,250,.36) 18px)",borderRadius:6,border:"1px dashed rgba(167,139,250,.65)",display:"flex",alignItems:"center",justifyContent:"center",gap:7,fontSize:11,fontWeight:700,color:"#C4B5FD",letterSpacing:".06em",textShadow:"0 1px 2px rgba(0,0,0,.5)",cursor:"pointer",zIndex:0,overflow:"hidden",whiteSpace:"nowrap"}}>
                <span style={{fontSize:13}}>🔧</span>
                <span>В РЕМОНТЕ</span>
                {car.repairNotes&&<span style={{fontWeight:500,color:"#A78BFA",textTransform:"none",letterSpacing:0,opacity:.85,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"45%"}}>· {car.repairNotes}</span>}
              </div>}
              {blocks.map(({rental:r,startIdx,dayCount})=>{
                const status=getRentalStatus(r);
                const isDone=!r.active;
                const col=isDone?"#64748B":status==="overdue"?"#F87171":status==="reserved"?"#FBBF24":car.color;
                const dl=status==="reserved"?daysUntil(r.startDate):daysLeft(r.endDate);
                const widthPct=(dayCount/N)*100;
                const dispEnd=isDone&&r.endedAt?r.endedAt:r.endDate;
                return(
                  <div key={r.id} className="tl-bar" onClick={()=>onRentalClick(r)}
                    style={{left:`calc(${pct(startIdx)} + 3px)`,top:5,width:`calc(${widthPct}% - 6px)`,height:RH-10,background:isDone?`repeating-linear-gradient(135deg,${col}55,${col}55 6px,${col}30 6px,${col}30 12px)`:`linear-gradient(135deg,${col}E5,${col}A0)`,boxShadow:isDone?`inset 0 0 0 1px ${col}40`:`0 2px 8px ${col}45,inset 0 1px 0 rgba(255,255,255,.15)`,border:isDone?`1px dashed ${col}90`:`1px solid ${col}60`,borderRadius:6,opacity:isDone?.65:1}}
                    title={`${r.clientName} · ${fmtRu(r.startDate)}–${fmtRu(dispEnd)}${isDone?" · завершена":""}`}>
                    {widthPct*8>4&&<div style={{display:"flex",alignItems:"center",gap:6,minWidth:0,position:"relative",zIndex:1,width:"100%"}}>
                      <div style={{width:22,height:22,borderRadius:"50%",background:isDone?"rgba(15,17,22,.55)":"rgba(0,0,0,.30)",border:"1px solid rgba(255,255,255,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0,fontWeight:800,color:"#fff",textShadow:"0 1px 2px rgba(0,0,0,.4)"}}>{isDone?"✓":r.clientName.charAt(0).toUpperCase()}</div>
                      <div style={{overflow:"hidden",minWidth:0,flex:1}}>
                        <div style={{fontSize:11,fontWeight:700,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",lineHeight:1.2,textShadow:"0 1px 3px rgba(0,0,0,.55)",letterSpacing:"-.005em"}}>{r.clientName.split(" ")[0]}</div>
                        {dayCount>=3&&<div style={{fontSize:9,color:"rgba(255,255,255,.85)",fontFamily:"'JetBrains Mono'",lineHeight:1.2,fontWeight:600,textShadow:"0 1px 2px rgba(0,0,0,.4)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{isDone?"завершено":status==="reserved"?`↑${dl}д`:status==="overdue"?`!${Math.abs(dl)}д`:`${dl}д`}{!isDone&&dayCount>=5&&r.price?` · ${r.price}€`:""}{isDone&&dayCount>=5&&r.price?` · ${r.price}€`:""}</div>}
                      </div>
                    </div>}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function RentalForm({cars,rentals,trackerData,initial,onSave,onCancel}){
  const[f,setF]=useState({carId:"",clientName:"",phone:"",city:"",location:"",startDate:fmtDate(new Date()),endDate:"",price:"",deposit:"",depositMethod:"",depositReturned:false,documents:"",notes:"",mileageOut:"",mileageIn:"",source:"",...initial,carId:initial.carId?String(initial.carId):""});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const selectedCar=cars.find(c=>c.id===Number(f.carId));
  const carInRepair=selectedCar?.inRepair;
  const suggested=calcSuggestedPrice(selectedCar,f.startDate,f.endDate);
  const conflicts=(()=>{
    if(!f.carId||!f.startDate||!f.endDate||!rentals)return[];
    const cid=Number(f.carId);
    const start=parseDate(f.startDate);start.setHours(0,0,0,0);
    const end=parseDate(f.endDate);end.setHours(0,0,0,0);
    if(end<start)return[];
    return rentals.filter(r=>{
      if(!r.active||r.carId!==cid)return false;
      if(initial.id&&r.id===initial.id)return false;
      const rs=parseDate(r.startDate);rs.setHours(0,0,0,0);
      const re=parseDate(r.endDate);re.setHours(0,0,0,0);
      return rs<=end&&re>=start;
    });
  })();
  function submit(){
    if(!f.carId||!f.clientName||!f.endDate)return alert("Заполните: авто, имя, дата окончания");
    if(carInRepair){
      if(!confirm(`⚠️ Авто «${selectedCar.brand} ${selectedCar.model}» помечено как В РЕМОНТЕ${selectedCar.repairNotes?` (${selectedCar.repairNotes})`:""}.\n\nВсё равно создать аренду?`))return;
    }
    if(conflicts.length){
      const list=conflicts.map(c=>`• ${c.clientName} (${fmtRu(c.startDate)} → ${fmtRu(c.endDate)})`).join("\n");
      if(!confirm(`⚠️ Конфликт с ${conflicts.length===1?"арендой":"арендами"}:\n\n${list}\n\nВсё равно сохранить?`))return;
    }
    onSave({...f,carId:Number(f.carId)});
  }
  return <div style={{display:"flex",flexDirection:"column",gap:13}}>
    <div><label className="label">Автомобиль *</label><select className="input" value={f.carId} onChange={e=>s("carId",e.target.value)} style={{background:"var(--bg)"}}><option value="">Выберите...</option>{cars.map(c=><option key={c.id} value={c.id}>{c.inRepair?"🔧 ":""}{c.brand} {c.model}{c.plate?" · "+c.plate:""}{c.inRepair?" — в ремонте":""}</option>)}</select></div>
    {carInRepair&&(
      <div style={{background:"#A78BFA15",border:"1px solid #A78BFA40",borderRadius:8,padding:"10px 13px"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#A78BFA",marginBottom:4,letterSpacing:".05em"}}>🔧 АВТО В РЕМОНТЕ</div>
        <div style={{fontSize:12,color:"var(--text2)",lineHeight:1.5}}>{selectedCar.brand} {selectedCar.model} сейчас помечен как недоступный для аренды{selectedCar.repairNotes?`: «${selectedCar.repairNotes}»`:""}. Сначала верни его в строй в карточке авто, либо подтверди создание аренды при сохранении.</div>
      </div>
    )}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Имя *</label><input className="input" value={f.clientName} onChange={e=>s("clientName",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Телефон</label><input className="input" value={f.phone} onChange={e=>s("phone",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Город</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Место подачи</label><input className="input" value={f.location} onChange={e=>s("location",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
      <div><label className="label">Начало</label><input className="input" type="date" value={f.startDate} onChange={e=>s("startDate",e.target.value)}/></div>
      <div><label className="label">Конец *</label><input className="input" type="date" value={f.endDate} onChange={e=>s("endDate",e.target.value)}/></div>
      <div><label className="label">Цена €</label><input className="input" type="number" value={f.price} onChange={e=>s("price",e.target.value)} placeholder="—"/></div>
    </div>
    {suggested&&(
      <div onClick={()=>s("price",String(suggested.price))} style={{background:"rgba(56,189,248,.10)",border:"1px solid rgba(56,189,248,.30)",borderRadius:8,padding:"9px 13px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginTop:-4}}>
        <div style={{minWidth:0}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--teal)",letterSpacing:".05em"}}>✨ ТАРИФ «{suggested.tierLabel}»</div>
          <div style={{fontSize:12,color:"var(--text2)",fontFamily:"'JetBrains Mono'",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{suggested.breakdown}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <div style={{fontSize:18,fontWeight:800,color:"var(--teal)",fontFamily:"'JetBrains Mono'"}}>{suggested.price}€</div>
          <div style={{fontSize:11,color:"var(--teal)",fontWeight:600,whiteSpace:"nowrap"}}>применить →</div>
        </div>
      </div>
    )}
    <div>
      <label className="label">Источник аренды</label>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {SOURCES.map(src=>(
          <button key={src.id} type="button" onClick={()=>s("source",src.id)} className="btn" style={{padding:"7px 12px",fontSize:12,fontWeight:500,background:f.source===src.id?"var(--teal-dim)":"var(--bg-elevated)",color:f.source===src.id?"var(--teal)":"var(--text2)",border:`1px solid ${f.source===src.id?"var(--teal)":"var(--border2)"}`,borderRadius:7}}>
            <span style={{fontSize:14}}>{src.icon}</span> {src.label}
          </button>
        ))}
      </div>
    </div>
    {conflicts.length>0&&(
      <div style={{background:"#F8717115",border:"1px solid #F8717140",borderRadius:8,padding:"10px 13px"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#F87171",marginBottom:5,letterSpacing:".05em"}}>⚠️ КОНФЛИКТ РАСПИСАНИЯ ({conflicts.length})</div>
        {conflicts.map(c=>(
          <div key={c.id} style={{fontSize:12,color:"var(--text2)",lineHeight:1.6}}>· <b style={{color:"var(--text)"}}>{c.clientName}</b> <span style={{fontFamily:"'JetBrains Mono'",color:"var(--text3)"}}>{fmtRu(c.startDate)} → {fmtRu(c.endDate)}</span></div>
        ))}
      </div>
    )}
    {(()=>{
      const realKm=selectedCar?getRealTrackerMileage(selectedCar,trackerData):null;
      const TrackerBtn=({onClick})=>realKm!=null?<button type="button" onClick={onClick} style={{position:"absolute",right:6,top:"50%",transform:"translateY(20%)",background:"rgba(56,189,248,.15)",border:"1px solid rgba(56,189,248,.40)",color:"var(--teal)",borderRadius:5,padding:"2px 7px",fontSize:10,fontWeight:600,cursor:"pointer"}} title={`Подставить пробег с трекера: ${realKm.toLocaleString("ru-RU")} км`}>🛰 {realKm.toLocaleString("ru-RU")}</button>:null;
      return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
        <div><label className="label">Пробег выдача, км</label><div style={{position:"relative"}}><input className="input" type="number" value={f.mileageOut} onChange={e=>s("mileageOut",e.target.value)} placeholder="—" style={{paddingRight:realKm!=null?80:14}}/><TrackerBtn onClick={()=>s("mileageOut",String(realKm))}/></div></div>
        <div><label className="label">Пробег возврат, км</label><div style={{position:"relative"}}><input className="input" type="number" value={f.mileageIn} onChange={e=>s("mileageIn",e.target.value)} placeholder="—" style={{paddingRight:realKm!=null?80:14}}/><TrackerBtn onClick={()=>s("mileageIn",String(realKm))}/></div></div>
        <div><label className="label">Депозит €</label><input className="input" type="number" value={f.deposit} onChange={e=>s("deposit",e.target.value)} placeholder="—"/></div>
      </div>;
    })()}
    {f.deposit&&Number(f.deposit)>0&&(
      <div>
        <label className="label">Форма оплаты депозита</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {DEPOSIT_METHODS.map(m=>(
            <button key={m.id} type="button" onClick={()=>s("depositMethod",m.id)} className="btn" style={{padding:"7px 12px",fontSize:12,fontWeight:500,background:f.depositMethod===m.id?"var(--teal-dim)":"var(--bg-elevated)",color:f.depositMethod===m.id?"var(--teal)":"var(--text2)",border:`1px solid ${f.depositMethod===m.id?"var(--teal)":"var(--border2)"}`,borderRadius:7}}>
              <span style={{fontSize:14}}>{m.icon}</span> {m.label}
            </button>
          ))}
        </div>
      </div>
    )}
    <div><label className="label">Документы</label><input className="input" value={f.documents} onChange={e=>s("documents",e.target.value)} placeholder="—"/></div>
    <div><label className="label">Примечания</label><textarea className="input" rows={2} value={f.notes} onChange={e=>s("notes",e.target.value)} style={{resize:"vertical"}} placeholder="—"/></div>

      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-teal" style={{flex:2,justifyContent:"center"}} onClick={submit}>Сохранить</button>
    </div>
  </div>;
}

function CarForm({initial,onSave,onCancel,onDelete,trackerData}){
  const initialState={brand:"",model:"",plate:"",city:"",lastServiceMileage:"",nextServiceMileage:"",inRepair:false,repairNotes:"",rate2to5:"",rate6to14:"",rate15to30:"",rate30plus:"",itvUntil:"",insuranceUntil:"",trackerOffset:"",trackerCalibratedAt:"",trackerCalibrationRealKm:"",trackerCalibrationTrackerKm:"",...(initial||{})};
  const[f,setF]=useState(initialState);
  const initialJsonRef=useRef(JSON.stringify(initialState));
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const isDirty=JSON.stringify(f)!==initialJsonRef.current;
  useEffect(()=>{
    if(!isDirty)return;
    const handler=(e)=>{e.preventDefault();e.returnValue=""};
    window.addEventListener("beforeunload",handler);
    return()=>window.removeEventListener("beforeunload",handler);
  },[isDirty]);
  function cancel(){if(isDirty&&!confirm("⚠️ Есть несохранённые изменения. Закрыть без сохранения?"))return;onCancel()}
  function submit(){if(!f.brand||!f.model)return alert("Укажите марку и модель");onSave(f)}
  return <div style={{display:"flex",flexDirection:"column",gap:13}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Марка *</label><input className="input" value={f.brand} onChange={e=>s("brand",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Модель *</label><input className="input" value={f.model} onChange={e=>s("model",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Гос. номер</label><input className="input" value={f.plate} onChange={e=>s("plate",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Город базирования</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{height:1,background:"var(--border)",margin:"4px 0"}}/>
    <div style={{fontSize:11,fontWeight:700,color:"var(--text3)",letterSpacing:".05em",marginBottom:-4}}>💰 ТАРИФЫ (€/сутки)</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10}}>
      <div><label className="label">2–5 дн</label><input className="input" type="number" value={f.rate2to5} onChange={e=>s("rate2to5",e.target.value)} placeholder="—"/></div>
      <div><label className="label">6–14 дн</label><input className="input" type="number" value={f.rate6to14} onChange={e=>s("rate6to14",e.target.value)} placeholder="—"/></div>
      <div><label className="label">15–30 дн</label><input className="input" type="number" value={f.rate15to30} onChange={e=>s("rate15to30",e.target.value)} placeholder="—"/></div>
      <div><label className="label">30+ дн</label><input className="input" type="number" value={f.rate30plus} onChange={e=>s("rate30plus",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{fontSize:11,color:"var(--text3)",marginTop:-6}}>💡 цена за сутки зависит от длительности аренды. Применяется ко всему сроку — например 10 дней × тариф «6–14 дн».</div>
    <div style={{height:1,background:"var(--border)",margin:"4px 0"}}/>
    <div style={{fontSize:11,fontWeight:700,color:"var(--text3)",letterSpacing:".05em",marginBottom:-4}}>📅 ДОКУМЕНТЫ И СРОКИ</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">ITV до</label><input className="input" type="date" value={f.itvUntil} onChange={e=>s("itvUntil",e.target.value)}/></div>
      <div><label className="label">Страховка до</label><input className="input" type="date" value={f.insuranceUntil} onChange={e=>s("insuranceUntil",e.target.value)}/></div>
    </div>
    <div style={{height:1,background:"var(--border)",margin:"4px 0"}}/>
    <div style={{fontSize:11,fontWeight:700,color:"var(--text3)",letterSpacing:".05em",marginBottom:-4}}>🔧 ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Пробег последнего ТО, км</label><input className="input" type="number" value={f.lastServiceMileage} onChange={e=>s("lastServiceMileage",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Пробег следующего ТО, км</label><input className="input" type="number" value={f.nextServiceMileage} onChange={e=>s("nextServiceMileage",e.target.value)} placeholder="—"/></div>
    </div>
    {initial&&f.id&&trackerData?.[f.id]?.mileage!=null&&(()=>{
      const tk=trackerData[f.id].mileage;
      const offset=parseInt(f.trackerOffset);
      const hasCalib=!isNaN(offset);
      const realKmInput=parseInt(f.trackerCalibrationRealKm);
      const canCalibrate=!isNaN(realKmInput)&&realKmInput>0;
      return <>
        <div style={{height:1,background:"var(--border)",margin:"4px 0"}}/>
        <div style={{fontSize:11,fontWeight:700,color:"var(--teal)",letterSpacing:".05em",marginBottom:-4}}>📐 КАЛИБРОВКА ТРЕКЕРА</div>
        <div style={{background:"rgba(56,189,248,.08)",border:"1px solid rgba(56,189,248,.25)",borderRadius:8,padding:"11px 13px",fontSize:12,color:"var(--text2)",lineHeight:1.55}}>
          Трекер Lobbo считает <b style={{color:"var(--teal)",fontFamily:"'JetBrains Mono'"}}>{tk.toLocaleString("ru-RU")} км</b> с момента установки. Это не реальный одометр.<br/>
          Введи <b style={{color:"var(--text)"}}>реальный пробег по одометру прямо сейчас</b> — посчитаем смещение и дальше всё будет автоматом.
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:12,alignItems:"end"}}>
          <div>
            <label className="label">Реальный одометр сейчас, км</label>
            <input className="input" type="number" value={f.trackerCalibrationRealKm} onChange={e=>s("trackerCalibrationRealKm",e.target.value)} placeholder="например 85000"/>
          </div>
          <button type="button" className="btn btn-teal" style={{padding:"11px 18px"}} disabled={!canCalibrate} onClick={()=>{
            const newOffset=realKmInput-tk;
            setF(x=>({...x,trackerOffset:String(newOffset),trackerCalibrationTrackerKm:String(tk),trackerCalibratedAt:nowISO()}));
          }}>📐 Откалибровать</button>
        </div>
        {hasCalib&&<div style={{background:"rgba(52,211,153,.10)",border:"1px solid rgba(52,211,153,.30)",borderRadius:8,padding:"10px 13px",fontSize:12,color:"var(--text2)",lineHeight:1.55}}>
          ✓ Откалибровано: смещение <b style={{color:"#34D399",fontFamily:"'JetBrains Mono'"}}>+{offset.toLocaleString("ru-RU")} км</b>{f.trackerCalibratedAt&&<span style={{color:"var(--text3)"}}> · {new Date(f.trackerCalibratedAt).toLocaleDateString("ru-RU")}</span>}<br/>
          Реальный пробег сейчас: <b style={{color:"var(--text)",fontFamily:"'JetBrains Mono'"}}>{(tk+offset).toLocaleString("ru-RU")} км</b>
        </div>}
      </>;
    })()}
    <div style={{height:1,background:"var(--border)",margin:"4px 0"}}/>
    <label style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",background:f.inRepair?"#A78BFA15":"var(--bg3)",borderRadius:8,cursor:"pointer",border:`1px solid ${f.inRepair?"#A78BFA40":"var(--border)"}`}}>
      <input type="checkbox" checked={!!f.inRepair} onChange={e=>s("inRepair",e.target.checked)} style={{width:16,height:16,accentColor:"#A78BFA"}}/>
      <span style={{fontSize:13,fontWeight:600,color:f.inRepair?"#A78BFA":"var(--text)"}}>🔧 Машина в ремонте (не доступна для аренды)</span>
    </label>
    {f.inRepair&&<div><label className="label">Причина / детали ремонта</label><textarea className="input" rows={2} value={f.repairNotes} onChange={e=>s("repairNotes",e.target.value)} style={{resize:"vertical"}} placeholder="—"/></div>}
    {f.model&&!initial&&<div style={{background:"rgba(251,191,36,.10)",borderRadius:8,padding:"9px 12px",fontSize:12,color:"#FBBF24",border:"1px solid rgba(251,191,36,.30)"}}>В Google Calendar пиши <b>«{f.model}»</b> в названии события.</div>}
    {isDirty&&<div style={{background:"rgba(251,191,36,.10)",borderRadius:8,padding:"9px 12px",fontSize:12,color:"#FBBF24",border:"1px solid rgba(251,191,36,.30)",display:"flex",alignItems:"center",gap:8}}>● Есть несохранённые изменения — нажми «{initial?"Сохранить изменения":"Добавить авто"}»</div>}
    <div style={{display:"flex",gap:8}}>
      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={cancel}>Отмена</button>
      <button className="btn btn-teal" style={{flex:2,justifyContent:"center",boxShadow:isDirty?"0 0 0 2px rgba(56,189,248,.40)":undefined}} onClick={submit}>{initial?"Сохранить изменения":"Добавить авто"}{isDirty&&" ●"}</button>
    </div>
    {initial&&onDelete&&<button className="btn btn-ghost" style={{width:"100%",justifyContent:"center",marginTop:4,color:"#F87171",borderColor:"#F8717140"}} onClick={onDelete}>🗑 Удалить автомобиль</button>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
