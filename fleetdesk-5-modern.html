<style>
:root{
  --bg:#2A2D33;
  --bg2:#353841;
  --bg3:#3D404A;

  --text:#E8E9EB;
  --text2:#ACB0B7;
  --text3:#797D85;
  --green:#34D399;
  --yellow:#FBBF24;
  --red:#F87171;

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.005em}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#5A5D68;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#787C87}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:8px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:-.005em}
.btn-teal{background:var(--teal);color:#15191F;padding:10px 18px;font-size:14px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.25)}.btn-teal:hover{background:var(--teal2);box-shadow:0 2px 6px rgba(56,189,248,.30)}
.btn-ghost{background:var(--bg-elevated);color:var(--text);padding:10px 18px;font-size:14px;border:1px solid var(--border2);box-shadow:var(--shadow-sm)}.btn-ghost:hover{border-color:var(--teal);color:var(--teal);background:var(--bg-elevated)}
.btn-red{background:rgba(248,113,113,.15);color:#F87171;padding:9px 16px;font-size:14px;border:1px solid rgba(248,113,113,.40)}
.btn-sm{padding:7px 14px;font-size:13px}
.input{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:11px 14px;color:var(--text);font-size:15px;width:100%;outline:none;transition:all .15s;font-family:inherit}.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.input::placeholder{color:var(--text3);opacity:.6}
.label{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.04em;display:block;margin-bottom:6px;text-transform:uppercase}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;transition:all .2s;box-shadow:var(--shadow-sm)}.card:hover{box-shadow:var(--shadow-md);border-color:var(--border2)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600}
.view-pill{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;color:var(--text2);padding:10px 14px;border-radius:8px;transition:all .15s;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.view-pill:hover{background:var(--bg3);color:var(--text)}
.view-pill.active{background:var(--teal-dim2);color:var(--teal);font-weight:600}
.tab-btn{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;color:var(--text2);padding:12px 18px;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.section{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}
.section-row{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.section-row:last-child{border-bottom:none}
.tl-bar{border-radius:6px;cursor:pointer;display:flex;align-items:center;padding:0 8px;overflow:hidden;position:absolute;transition:all .15s;box-shadow:0 1px 2px rgba(15,23,42,.10)}
.tl-bar:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 3px 8px rgba(15,23,42,.15)}
.tl-bar::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent);border-radius:inherit;pointer-events:none}
.stat-card{background:var(--bg2);border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border2)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}

/* Layout: sidebar + main */
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;padding:18px 12px;z-index:50;overflow-y:auto}
.sidebar-label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:0 14px;margin:14px 0 8px}
.main-content{margin-left:240px;min-height:100vh}
.topbar{background:rgba(53,56,65,.85);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;backdrop-filter:blur(12px)}
.content-grid{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:start}
@media (max-width:1280px){.content-grid{grid-template-columns:1fr}}
.notif-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;cursor:pointer;transition:all .15s;display:block}
.notif-card:hover{box-shadow:var(--shadow-md);transform:translateX(-2px)}

/* Draggable modal */
.drag-modal{position:fixed;background:var(--bg2);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-xl);z-index:300;min-width:460px;max-width:540px;width:100%;overflow:hidden}
.drag-modal-header{padding:16px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);cursor:grab;user-select:none;background:var(--bg3)}
.drag-modal-header:active{cursor:grabbing}
.drag-modal-body{padding:22px;max-height:76vh;overflow-y:auto}
.drag-modal-overlay{position:fixed;inset:0;background:rgba(15,17,22,.55);backdrop-filter:blur(4px);z-index:299}

@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}.fade-in{animation:fadeIn .18s ease}
@keyframes spin{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 6px currentColor}50%{opacity:.55;transform:scale(.82);box-shadow:0 0 3px currentColor}}
.pulse-dot{animation:pulseDot 2s ease-in-out infinite}

<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;
const CLIENT_ID="546196176766-060ji046vk8r8kem36ko66dr6d4gme9n.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/drive.appdata";

const CAR_COLORS=["#38BDF8","#3498DB","#A78BFA","#FBBF24","#1ABC9C","#F87171","#F1C40F","#2ECC71","#16A085","#8E44AD","#D35400","#34D399"];

  {id:"crypto",label:"Криптовалюта",icon:"🪙",color:"#FBBF24"},

];
// Traccar API отдаёт скорость в узлах (knots). 1 узел = 1.852 км/ч
const SPEED_KNOTS_TO_KMH=1.852;
const SPEED_ALERT_KMH=140;
// Очень грубая bounding-box проверка для Испании (материк + Балеары + Канары)
function isInSpain(lat,lon){
  if(lat==null||lon==null)return true;
  const mainland=lat>=36&&lat<=44&&lon>=-10&&lon<=4.5;
  const canary=lat>=27&&lat<=29.5&&lon>=-18.5&&lon<=-13.4;
  return mainland||canary;
}

// Тарифная сетка по диапазону дней. Каждый тариф = €/сутки, применяется ко всему сроку.
const TARIFF_TIERS=[
  {key:"rate2to5",label:"2–5 дней",maxDays:5},
  {key:"rate6to14",label:"6–14 дней",maxDays:14},
  {key:"rate15to30",label:"15–30 дней",maxDays:30},
  {key:"rate30plus",label:"30+ дней",maxDays:Infinity},
];
function calcSuggestedPrice(car,startDate,endDate){
  if(!car||!startDate||!endDate)return null;
  const s=parseDate(startDate);s.setHours(0,0,0,0);
  const e=parseDate(endDate);e.setHours(0,0,0,0);
  const days=Math.round((e-s)/86400000)+1;
  if(days<=0)return null;
  const tier=TARIFF_TIERS.find(t=>days<=t.maxDays);
  if(!tier)return null;
  const rate=parseFloat(car[tier.key]);
  if(!rate||rate<=0)return null;
  return{price:Math.round(days*rate),days,tierLabel:tier.label,rate,breakdown:`${days}дн × ${rate}€`};
}

// Тариф-группы:
// A (Polo, Golf, CT200h, Yaris Hybrid, Passat): 40/37/33/25
// B (Fiat 500e Alicante/Valencia):              35/30/27/22
// C (Scala, Ionic, Superb, BMW 218, Yaris):     50/45/40/32
const TG_A={rate2to5:"40",rate6to14:"37",rate15to30:"33",rate30plus:"25"};
const TG_B={rate2to5:"35",rate6to14:"30",rate15to30:"27",rate30plus:"22"};
const TG_C={rate2to5:"50",rate6to14:"45",rate15to30:"40",rate30plus:"32"};
const DEFAULT_CARS=[
  {id:1,brand:"Volkswagen",model:"Polo",plate:"",city:"",color:CAR_COLORS[0],lastServiceMileage:"",nextServiceMileage:"",...TG_A},
  {id:2,brand:"Volkswagen",model:"Golf",plate:"",city:"",color:CAR_COLORS[1],lastServiceMileage:"",nextServiceMileage:"",...TG_A},
  {id:3,brand:"Lexus",model:"CT200h",plate:"",city:"",color:CAR_COLORS[2],lastServiceMileage:"",nextServiceMileage:"",...TG_A},
  {id:4,brand:"Toyota",model:"Yaris Hybrid",plate:"",city:"",color:CAR_COLORS[3],lastServiceMileage:"",nextServiceMileage:"",...TG_A},
  {id:5,brand:"Skoda",model:"Scala",plate:"",city:"",color:CAR_COLORS[4],lastServiceMileage:"",nextServiceMileage:"",...TG_C},
  {id:6,brand:"Hyundai",model:"Ionic",plate:"",city:"",color:CAR_COLORS[5],lastServiceMileage:"",nextServiceMileage:"",...TG_C},
  {id:7,brand:"Skoda",model:"Superb",plate:"",city:"",color:CAR_COLORS[6],lastServiceMileage:"",nextServiceMileage:"",...TG_C},
  {id:8,brand:"Volkswagen",model:"Passat",plate:"",city:"",color:CAR_COLORS[7],lastServiceMileage:"",nextServiceMileage:"",...TG_A},
  {id:9,brand:"Fiat",model:"500e Alicante",plate:"",city:"Alicante",color:CAR_COLORS[8],lastServiceMileage:"",nextServiceMileage:"",...TG_B},
  {id:10,brand:"Fiat",model:"500e Valencia",plate:"",city:"Valencia",color:CAR_COLORS[9],lastServiceMileage:"",nextServiceMileage:"",...TG_B},
  {id:11,brand:"BMW",model:"218d Gran Tourer",plate:"",city:"",color:CAR_COLORS[10],lastServiceMileage:"",nextServiceMileage:"",...TG_C},
  {id:12,brand:"Toyota",model:"Yaris",plate:"",city:"",color:CAR_COLORS[11],lastServiceMileage:"",nextServiceMileage:"",...TG_C},
];

const CAR_KW=[
  {id:1,kw:["polo","vw polo","volkswagen polo"]},
  {id:2,kw:["golf","vw golf","volkswagen golf"]},
  {id:3,kw:["lexus","ct200","ct 200"]},
  {id:4,kw:["yaris hybrid","yaris гибрид"]},
  {id:5,kw:["scala"]},
  {id:6,kw:["ionic","ioniq"]},
  {id:7,kw:["superb"]},
  {id:8,kw:["passat"]},
  {id:9,kw:["500e alicante","500 alicante","fiat alicante"]},
  {id:10,kw:["500e","fiat 500","500 valencia","fiat 500e"]},
  {id:11,kw:["218","gran tourer","218d","bmw 218"]},
  {id:12,kw:["yaris"]},
];

function getRentalStatus(r){
  if(!r||!r.active)return"done";
  const now=new Date();now.setHours(0,0,0,0);
  const s=parseDate(r.startDate);s.setHours(0,0,0,0);
  const e=parseDate(r.endDate);e.setHours(0,0,0,0);
  if(e<now)return"overdue";if(s>now)return"reserved";return"active";
}
const SC={
  active:{label:"В аренде",color:"#34D399",bg:"rgba(52,211,153,.15)",dot:"#34D399"},
  reserved:{label:"Резерв",color:"#FBBF24",bg:"rgba(251,191,36,.15)",dot:"#FBBF24"},
  overdue:{label:"Просрочено",color:"#F87171",bg:"rgba(248,113,113,.15)",dot:"#F87171"},
  free:{label:"Свободна",color:"#94A3B8",bg:"rgba(148,163,184,.15)",dot:"#94A3B8"},
  done:{label:"Завершено",color:"#38BDF8",bg:"rgba(56,189,248,.15)",dot:"#38BDF8"},
  repair:{label:"В ремонте",color:"#A78BFA",bg:"rgba(167,139,250,.15)",dot:"#A78BFA"},
};
function getCarStatus(carId,rentals){
  const active=rentals.filter(r=>r.active&&r.carId===carId);
  if(!active.length)return{status:"free",rental:null};
  const cur=active.find(r=>getRentalStatus(r)==="active");if(cur)return{status:"active",rental:cur};
  const ov=active.find(r=>getRentalStatus(r)==="overdue");if(ov)return{status:"overdue",rental:ov};
  const res=active.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate))[0];
  return{status:"reserved",rental:res};
}
function findCarId(text,cars){
  const t=text.toLowerCase();
  for(const ck of CAR_KW){if(ck.kw.some(k=>t.includes(k)))return ck.id}
  for(const c of cars){if(t.includes(c.model.toLowerCase())||t.includes((c.brand+" "+c.model).toLowerCase()))return c.id}
  return null;
}
function parseEvent(ev,cars){
  const title=ev.summary||"",desc=ev.description||"";
  const phoneMatch=title.match(/\+[\d\s\-()]{8,15}/);
  const phone=phoneMatch?phoneMatch[0].trim():"";
  let rest=title.replace(/\+[\d\s\-()]{8,15}/,"").trim();
  rest=rest.replace(/оплата.*/i,"").replace(/аванс.*/i,"").replace(/залог.*/i,"").trim();
  const carId=findCarId(rest,cars)||findCarId(title,cars);
  let rem=rest;
  if(carId){
    const ck=CAR_KW.find(x=>x.id===carId);
    if(ck)for(const k of ck.kw)rem=rem.replace(new RegExp(k,"gi"),"").trim();
    const car=cars.find(c=>c.id===carId);
    if(car)rem=rem.replace(new RegExp(car.model,"gi"),"").replace(new RegExp(car.brand,"gi"),"").trim();
  }
  rem=rem.replace(/\s+/g," ").replace(/^[-,·\s]+|[-,·\s]+$/g,"").trim();
  const parts=rem.split(/\s+/).filter(Boolean);
  const CITIES=["валенсия","мадрид","барселона","аликанте","севилья","малага","valencia","madrid","barcelona","alicante","sevilla","malaga","бенидорм","торревьеха","murcia","мурсия","benidorm","torrevieja"];
  let city="",clientName="";
  if(parts.length>0&&CITIES.includes(parts[0].toLowerCase())){city=parts[0];clientName=parts.slice(1).join(" ")}
  else clientName=parts.join(" ");
  const g=k=>{const m=desc.match(new RegExp(k+"[:\\s]+([^\\n]+)","i"));return m?m[1].trim():""};
  return{id:ev.id,googleEventId:ev.id,carId,clientName:clientName||title,phone,city:city||g("город")||g("city"),location:g("место")||g("location"),price:g("цена")||g("price"),documents:g("документы")||g("docs"),notes:desc,startDate:ev.start?.date||(ev.start?.dateTime?ev.start.dateTime.split("T")[0]:""),endDate:ev.end?.date||(ev.end?.dateTime?ev.end.dateTime.split("T")[0]:""),active:true,fromGoogle:true};
}
function toGoogleEvent(r,cars){
  const car=cars.find(c=>c.id===r.carId);
  const label=car?`${car.brand} ${car.model}`:"";
  const title=`${r.city?r.city+" ":""}${r.clientName} ${label}${r.phone?" "+r.phone:""}`.trim();
  const lines=[
    r.price&&`Цена: ${r.price} €`,
    r.deposit&&`Депозит: ${r.deposit} €`,
    r.location&&`Место: ${r.location}`,
    r.mileageOut&&`Пробег выдача: ${Number(r.mileageOut).toLocaleString("ru-RU")} км`,
    r.mileageIn&&`Пробег возврат: ${Number(r.mileageIn).toLocaleString("ru-RU")} км`,
    r.documents&&`Документы: ${r.documents}`,
  ].filter(Boolean);
  return{summary:title,description:lines.join("\n"),start:{date:r.startDate},end:{date:r.endDate}};
}
function fmtDate(d){return d.toISOString().split("T")[0]}
function parseDate(s){if(!s)return new Date();const[y,m,d]=s.split("-");return new Date(+y,+m-1,+d)}
function nowISO(){return new Date().toISOString()}
function relativeTimeRu(iso){
  if(!iso)return"";
  const diff=(Date.now()-new Date(iso).getTime())/1000;
  if(diff<60)return"сейчас";
  if(diff<3600)return Math.floor(diff/60)+" мин";
  if(diff<86400)return Math.floor(diff/3600)+" ч";
  return Math.floor(diff/86400)+" дн";
}

// ====== LOBBO / Traccar API ======
const LOBBO_CREDS_KEY="lobbo_creds_v1";
const LOBBO_TRACKER_KEY="lobbo_tracker_v1";
const LOBBO_DEFAULT_URL="https://app.lobbo.eu";
function lobboBase(u){return(u||LOBBO_DEFAULT_URL).replace(/\/$/,"")}
function lobboAuthHeader(email,password){return"Basic "+btoa(unescape(encodeURIComponent(email+":"+password)))}
// Используем Basic Auth вместо session cookie — работает с file:// и cross-origin
async function lobboApi(creds,path,opts={}){
  const resp=await fetch(lobboBase(creds.baseUrl)+path,{
    ...opts,
    headers:{"Accept":"application/json","Authorization":lobboAuthHeader(creds.email,creds.password),...(opts.headers||{})},
  });
  if(!resp.ok){const t=await resp.text().catch(()=>"");const e=new Error("API "+resp.status+" on "+path+(t?": "+t.slice(0,200):""));e.status=resp.status;throw e}
  return resp.json();
}
async function lobboValidate(creds){
  // Валидация: пытаемся получить devices с Basic Auth. 200 = креды верные.
  return lobboApi(creds,"/api/devices");
}
async function lobboGetDevices(creds){return lobboApi(creds,"/api/devices")}
async function lobboGetPositions(creds){return lobboApi(creds,"/api/positions")}

// Реальный одометр из трекера: tracker.mileage + offset.
// Если откалибровано — возвращает реальные км, если нет — null
function getRealTrackerMileage(car,trackerData){
  const tm=trackerData?.[car?.id]?.mileage;
  if(tm==null)return null;
  const offset=parseInt(car?.trackerOffset);
  if(isNaN(offset))return null;
  return tm+offset;
}
// Лучшая оценка текущего пробега авто: реальный трекер (с offset) приоритетнее, иначе max из аренд
function getCarCurrentMileage(car,rentals,trackerData){
  let max=parseInt(car?.lastServiceMileage)||0;
  const real=getRealTrackerMileage(car,trackerData);
  if(real!=null&&real>max)max=real;
  for(const r of (rentals||[]).filter(r=>r.carId===car?.id)){
    const mo=parseInt(r.mileageOut)||0,mi=parseInt(r.mileageIn)||0;
    if(mo>max)max=mo;
    if(mi>max)max=mi;
  }
  return max;
}
// Per-item мерж: для каждого элемента по id выбирается тот, у которого updatedAt новее.
// Элементы только в одном из массивов сохраняются. Конкурирующие правки разных машин/аренд не затирают друг друга.
function mergeByUpdatedAt(local,remote){
  if(!Array.isArray(local))local=[];
  if(!Array.isArray(remote))remote=[];
  const result=[];
  const remoteMap=new Map(remote.map(r=>[r.id,r]));
  for(const lc of local){
    const rc=remoteMap.get(lc.id);
    if(!rc){result.push(lc);continue}
    const lcTime=lc.updatedAt||"0";
    const rcTime=rc.updatedAt||"0";
    result.push(rcTime>lcTime?rc:lc);
    remoteMap.delete(lc.id);
  }
  for(const rc of remoteMap.values())result.push(rc);
  return result;
}

// Tombstones (надгробия): записи об удалённых id со временем удаления.
// При синке tombstone побеждает запись с меньшим updatedAt — это позволяет удалениям "приклеиваться".
function mergeTombstones(local,remote){
  const result={...(local||{})};
  for(const[id,ts]of Object.entries(remote||{})){
    if(!result[id]||ts>result[id])result[id]=ts;
  }
  return result;
}
// Применить tombstones к списку: убрать элементы где tombstone новее их updatedAt
function applyTombstones(items,tombstones){
  if(!tombstones)return items;
  return items.filter(it=>{
    const ts=tombstones[String(it.id)];
    if(!ts)return true;
    return (it.updatedAt||"0")>ts; // элемент выжил если он отредактирован ПОСЛЕ удаления
  });
}
function daysLeft(e){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(e)-n)/86400000)}
function daysUntil(s){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(s)-n)/86400000)}
function fmtRu(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})}
function fmtRuFull(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"})}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function useDraggable(init){
  const[pos,setPos]=useState(init);
  const drag=useRef(false);const off=useRef({x:0,y:0});
  const down=useCallback((e)=>{if(e.target.closest('.no-drag'))return;drag.current=true;off.current={x:e.clientX-pos.x,y:e.clientY-pos.y};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)},[pos]);
  const move=useCallback((e)=>{if(!drag.current)return;setPos({x:e.clientX-off.current.x,y:e.clientY-off.current.y})},[]);
  const up=useCallback(()=>{drag.current=false;document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)},[]);
  useEffect(()=>()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)},[]);
  return{pos,down};
}

function AvailabilityChecker({cars,rentals}){
  const[from,setFrom]=useState(fmtDate(new Date()));
  const[to,setTo]=useState("");
  const[results,setResults]=useState(null);
  function check(){
    const f=parseDate(from);f.setHours(0,0,0,0);
    const t=to?parseDate(to):f;t.setHours(0,0,0,0);
    const res=cars.map(car=>{
      if(car.inRepair)return{car,status:"repair",conflict:null};
      const conflicts=rentals.filter(r=>{
        if(!r.active||r.carId!==car.id)return false;
        const s=parseDate(r.startDate);s.setHours(0,0,0,0);
        const e=parseDate(r.endDate);e.setHours(0,0,0,0);
        return s<=t&&e>=f;
      });
      if(!conflicts.length)return{car,status:"free",conflict:null};
      const act=conflicts.find(r=>getRentalStatus(r)==="active");
      return{car,status:act?"busy":"reserved",conflict:act||conflicts[0]};
    });
    setResults(res);
  }
  const free=results?.filter(r=>r.status==="free")||[];
  const busy=results?.filter(r=>r.status==="busy"||r.status==="reserved")||[];
  const repair=results?.filter(r=>r.status==="repair")||[];
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <div><label className="label">С какого числа</label><input className="input" type="date" value={from} onChange={e=>setFrom(e.target.value)}/></div>
      <div><label className="label">По какое (необязательно)</label><input className="input" type="date" value={to} onChange={e=>setTo(e.target.value)}/></div>
    </div>
    <button className="btn btn-teal" style={{width:"100%",justifyContent:"center",marginBottom:16}} onClick={check}>Проверить доступность</button>
    {results&&<>
      {free.length>0&&<>
        <div style={{fontSize:12,fontWeight:700,color:"#34D399",marginBottom:8}}>✓ Свободно: {free.length} авто</div>
        {free.map(({car})=>(
          <div key={car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"#34D39912",borderRadius:8,marginBottom:6,border:"1px solid #34D39925"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:car.color,flexShrink:0}}></div>
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontWeight:600,fontSize:13}}>{car.brand} {car.model}</div>
              <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginTop:2}}>{car.plate||"без номера"}{car.city?` · 📍 ${car.city}`:""}</div>
            </div>
            <span className="tag" style={{background:"#34D39920",color:"#34D399",flexShrink:0}}>Свободна</span>
          </div>
        ))}
      </>}
      {busy.length>0&&<>
        <div style={{fontSize:12,fontWeight:700,color:"var(--text3)",marginTop:12,marginBottom:8}}>Занято: {busy.length} авто</div>
        {busy.map(({car,status,conflict})=>(
          <div key={car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:status==="busy"?"#F8717110":"#FBBF2410",borderRadius:8,marginBottom:6,border:`1px solid ${status==="busy"?"#F8717125":"#FBBF2425"}`}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:car.color,flexShrink:0}}></div>
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontWeight:600,fontSize:13}}>{car.brand} {car.model}{car.city?<span style={{fontWeight:400,color:"var(--text3)",marginLeft:6,fontSize:11}}>📍 {car.city}</span>:null}</div>
              {conflict&&<div style={{fontSize:11,color:"var(--text3)"}}>{conflict.clientName} · {fmtRu(conflict.startDate)}–{fmtRu(conflict.endDate)}</div>}
            </div>

function VehicleWarnings({rentals,cars,trackerData}){
  const toWarnings=cars.map(car=>{
    const next=parseInt(car.nextServiceMileage);
    if(!next)return null;
    const current=getCarCurrentMileage(car,rentals,trackerData);
    const remaining=next-current;
    if(remaining>1500)return null;
    return{car,current,next,remaining};
  }).filter(Boolean).sort((a,b)=>a.remaining-b.remaining);
  // Tracker-based realtime алерты
  const speedAlerts=[],outsideAlerts=[],noSignalAlerts=[];
  for(const car of cars){
    if(!car.lobboDeviceId)continue;
    const td=trackerData?.[car.id];
    if(!td)continue;
    if(td.speed!=null){
      const kmh=Math.round(td.speed*SPEED_KNOTS_TO_KMH);
      if(kmh>SPEED_ALERT_KMH)speedAlerts.push({car,kmh,time:td.fixTime});
    }
    if(td.lat!=null&&td.lon!=null&&!isInSpain(td.lat,td.lon)){
      outsideAlerts.push({car,lat:td.lat,lon:td.lon,time:td.fixTime});
    }
    if(td.fixTime){
      const h=(Date.now()-new Date(td.fixTime).getTime())/3600000;
      if(h>6)noSignalAlerts.push({car,hoursAgo:Math.floor(h),lastFix:td.fixTime});
    }
  }
  const docWarnings=[];
  const todayD=new Date();todayD.setHours(0,0,0,0);
  for(const car of cars){
    const checks=[
      {key:"itvUntil",label:"ITV",icon:"🛠"},
      {key:"insuranceUntil",label:"СТРАХОВКА",icon:"🛡"},
    ];
    for(const c of checks){
      if(!car[c.key])continue;
      const d=parseDate(car[c.key]);d.setHours(0,0,0,0);
      const daysL=Math.round((d-todayD)/86400000);
      if(daysL>30)continue;
      docWarnings.push({car,label:c.label,icon:c.icon,daysLeft:daysL,date:car[c.key]});
    }
  }
  docWarnings.sort((a,b)=>a.daysLeft-b.daysLeft);
  const total=toWarnings.length+docWarnings.length+speedAlerts.length+outsideAlerts.length+noSignalAlerts.length;
  if(!total)return(
    <div className="card" style={{padding:"22px 16px",textAlign:"center"}}>
      <div style={{fontSize:11,color:"var(--text3)",fontWeight:700,letterSpacing:".07em",textTransform:"uppercase",marginBottom:14}}>🚙 Состояние авто</div>
      <div style={{fontSize:28,marginBottom:4,opacity:.35}}>✓</div>
      <div style={{fontSize:12,fontWeight:600,color:"var(--text2)"}}>Все авто в порядке</div>
      <div style={{fontSize:11,color:"var(--text3)",marginTop:3}}>ТО, страховка и ITV — ОК</div>
    </div>
  );
  return <div className="card" style={{padding:"14px 14px 12px"}}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
      <span style={{fontSize:14}}>🚙</span>
      <div style={{fontSize:11,color:"var(--text3)",fontWeight:700,letterSpacing:".07em",textTransform:"uppercase"}}>Состояние авто</div>
      <span style={{background:"var(--bg3)",color:"var(--text2)",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700,marginLeft:"auto"}}>{total}</span>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:7}}>
      {speedAlerts.map(s=>(
        <div key={"spd"+s.car.id} className="notif-card" style={{borderLeft:"3px solid #F87171",background:"rgba(248,113,113,.06)",cursor:"default"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3,gap:6}}>
            <div style={{fontSize:10,color:"#F87171",fontWeight:700,letterSpacing:".05em",whiteSpace:"nowrap"}}>🚨 ПРЕВЫШЕНИЕ</div>

          </div>
          <div style={{fontSize:12,fontWeight:600,marginBottom:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.car.brand} {s.car.model}</div>

      {outsideAlerts.map(o=>(

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3,gap:6}}>
            <div style={{fontSize:10,color:"#F87171",fontWeight:700,letterSpacing:".05em",whiteSpace:"nowrap"}}>🌍 ВНЕ ИСПАНИИ ↗</div>
            <div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{relativeTimeRu(o.time)}</div>
          </div>
          <div style={{fontSize:12,fontWeight:600,marginBottom:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{o.car.brand} {o.car.model}</div>
          <div style={{fontSize:10,color:"var(--text2)",fontFamily:"'JetBrains Mono'"}}>{o.lat.toFixed(3)}, {o.lon.toFixed(3)}</div>
        </a>
      ))}
      {noSignalAlerts.map(n=>(
        <div key={"sig"+n.car.id} className="notif-card" style={{borderLeft:"3px solid #FBBF24",cursor:"default"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3,gap:6}}>
            <div style={{fontSize:10,color:"#FBBF24",fontWeight:700,letterSpacing:".05em",whiteSpace:"nowrap"}}>📡 НЕТ СИГНАЛА</div>
            <div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{n.hoursAgo}ч</div>
          </div>
          <div style={{fontSize:12,fontWeight:600,marginBottom:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{n.car.brand} {n.car.model}</div>
          <div style={{fontSize:10,color:"var(--text2)",fontFamily:"'JetBrains Mono'"}}>с {new Date(n.lastFix).toLocaleString("ru-RU",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
        </div>
      ))}
      {toWarnings.map(w=>(
        <div key={"to"+w.car.id} className="notif-card" style={{borderLeft:"3px solid #A78BFA",cursor:"default"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3,gap:6}}>
            <div style={{fontSize:10,color:"#A78BFA",fontWeight:700,letterSpacing:".05em",whiteSpace:"nowrap"}}>🔧 {w.remaining<=0?"ТО ПРОСРОЧЕНО":"ТО СКОРО"}</div>
            <div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{w.remaining<=0?`+${Math.abs(w.remaining)}км`:`-${w.remaining}км`}</div>
          </div>
          <div style={{fontSize:12,fontWeight:600,marginBottom:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{w.car.brand} {w.car.model}</div>
          <div style={{fontSize:10,color:"var(--text2)",fontFamily:"'JetBrains Mono'"}}>{w.current} / {w.next} км</div>
        </div>
      ))}
      {docWarnings.map((d,i)=>{
        const expired=d.daysLeft<0;
        const color=expired?"#F87171":d.daysLeft<=7?"#FBBF24":"#38BDF8";
        return <div key={"doc"+i+d.car.id} className="notif-card" style={{borderLeft:`3px solid ${color}`,cursor:"default"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3,gap:6}}>
            <div style={{fontSize:10,color,fontWeight:700,letterSpacing:".05em",whiteSpace:"nowrap"}}>{d.icon} {d.label} {expired?"ИСТЁК":d.daysLeft===0?"СЕГОДНЯ":""}</div>
            <div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{expired?`-${Math.abs(d.daysLeft)}д`:`+${d.daysLeft}д`}</div>
          </div>
          <div style={{fontSize:12,fontWeight:600,marginBottom:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{d.car.brand} {d.car.model}</div>
          <div style={{fontSize:10,color:"var(--text2)",fontFamily:"'JetBrains Mono'"}}>до {fmtRu(d.date)}</div>
        </div>;
      })}
    </div>
  </div>;
}

function EndRentalForm({rental,cars,trackerData,onConfirm,onCancel}){
  const car=cars.find(c=>c.id===rental.carId);
  const trackerRealKm=car?getRealTrackerMileage(car,trackerData):null;
  const[mileageIn,setMileageIn]=useState(rental.mileageIn||"");
  const[price,setPrice]=useState(rental.price||"");
  const[depositReturned,setDepositReturned]=useState(rental.depositReturned!==false);
  const[updateService,setUpdateService]=useState(true);
  const mileageNum=parseInt(mileageIn);
  const nextServ=parseInt(car?.nextServiceMileage);
  const passedService=mileageNum&&nextServ&&mileageNum>=nextServ;
  const hasDeposit=rental.deposit&&Number(rental.deposit)>0;
  function submit(){
    onConfirm({
      mileageIn:mileageIn||rental.mileageIn||"",
      price:price||rental.price||"",
      depositReturned:hasDeposit?depositReturned:undefined,
      updateCarServiceMileage:(passedService&&updateService)?mileageNum:null,
    });
  }
  return <div style={{display:"flex",flexDirection:"column",gap:13}}>
    <div style={{background:"var(--bg3)",padding:"10px 13px",borderRadius:8,fontSize:12,color:"var(--text2)"}}>
      Завершить аренду <b style={{color:"var(--text)"}}>{rental.clientName}</b>{car&&<span> · {car.brand} {car.model}</span>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div>
        <label className="label">Пробег возврата, км</label>
        <div style={{position:"relative"}}>
          <input className="input" type="number" value={mileageIn} onChange={e=>setMileageIn(e.target.value)} placeholder="—" autoFocus style={{paddingRight:trackerRealKm!=null?80:14}}/>
          {trackerRealKm!=null&&<button type="button" onClick={()=>setMileageIn(String(trackerRealKm))} style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",background:"rgba(56,189,248,.15)",border:"1px solid rgba(56,189,248,.40)",color:"var(--teal)",borderRadius:5,padding:"2px 7px",fontSize:10,fontWeight:600,cursor:"pointer"}} title={`С трекера: ${trackerRealKm.toLocaleString("ru-RU")} км`}>🛰 {trackerRealKm.toLocaleString("ru-RU")}</button>}
        </div>
        {rental.mileageOut&&<div style={{fontSize:10,color:"var(--text3)",marginTop:4}}>выдача: {rental.mileageOut} км{mileageNum&&mileageNum>Number(rental.mileageOut)?` · проехал ${mileageNum-Number(rental.mileageOut)} км`:""}</div>}
      </div>
      <div>
        <label className="label">Итог цена €</label>
        <input className="input" type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder="—"/>
        {rental.price&&price&&Number(price)!==Number(rental.price)&&<div style={{fontSize:10,color:"#FBBF24",marginTop:4}}>было: {rental.price} €</div>}
      </div>
    </div>
    {hasDeposit&&(
      <label style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",background:"var(--bg3)",borderRadius:8,cursor:"pointer",border:"1px solid var(--border)"}}>
        <input type="checkbox" checked={depositReturned} onChange={e=>setDepositReturned(e.target.checked)} style={{width:16,height:16,accentColor:"var(--teal)"}}/>
        <span style={{fontSize:13}}>Депозит <b style={{color:"var(--teal)"}}>{rental.deposit} €</b> возвращён</span>
      </label>
    )}
    {passedService&&(
      <label style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 13px",background:"#A78BFA15",borderRadius:8,cursor:"pointer",border:"1px solid #A78BFA40"}}>
        <input type="checkbox" checked={updateService} onChange={e=>setUpdateService(e.target.checked)} style={{width:16,height:16,marginTop:1,accentColor:"#A78BFA"}}/>
        <span style={{fontSize:12,color:"var(--text2)",lineHeight:1.4}}>🔧 Авто прошло отметку ТО ({nextServ} км). Обновить «последнее ТО» в карточке авто на {mileageNum} км?</span>
      </label>
    )}
    <div style={{display:"flex",gap:8,marginTop:4}}>
      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-red" style={{flex:2,justifyContent:"center"}} onClick={submit}>Завершить аренду</button>
    </div>
  </div>;
}

function Stats({rentals,cars}){
  const[monthOffset,setMonthOffset]=useState(0);
  const today=new Date();
  const mo=new Date(today.getFullYear(),today.getMonth()+monthOffset,1);mo.setHours(0,0,0,0);
  const monthEnd=new Date(mo.getFullYear(),mo.getMonth()+1,0);monthEnd.setHours(23,59,59);
  const monthRentals=rentals.filter(r=>{
    if(!r.endDate)return false;
    const e=parseDate(r.endDate);
    return e>=mo&&e<=monthEnd;
  });
  const revenue=monthRentals.reduce((s,r)=>s+(parseFloat(r.price)||0),0);
  const completed=monthRentals.filter(r=>!r.active).length;
  const avg=monthRentals.length?revenue/monthRentals.length:0;
  // Предыдущий месяц для тренда
  const prevMo=new Date(mo.getFullYear(),mo.getMonth()-1,1);
  const prevMoEnd=new Date(mo.getFullYear(),mo.getMonth(),0);prevMoEnd.setHours(23,59,59);
  const prevRev=rentals.filter(r=>{if(!r.endDate)return false;const e=parseDate(r.endDate);return e>=prevMo&&e<=prevMoEnd}).reduce((s,r)=>s+(parseFloat(r.price)||0),0);
  const revTrend=prevRev>0?Math.round((revenue-prevRev)/prevRev*100):null;
  const byCar={};
  for(const r of monthRentals){
    const p=parseFloat(r.price)||0;
    byCar[r.carId]=(byCar[r.carId]||0)+p;
  }
  const topCars=Object.entries(byCar).map(([cid,rev])=>({car:cars.find(c=>c.id===Number(cid)),revenue:rev})).filter(x=>x.car).sort((a,b)=>b.revenue-a.revenue).slice(0,5);
  const monthDaysCount=monthEnd.getDate();
  const utilization=cars.map(car=>{
    const cr=rentals.filter(r=>r.carId===car.id);
    let used=0;
    for(let d=1;d<=monthDaysCount;d++){
      const day=new Date(mo.getFullYear(),mo.getMonth(),d);day.setHours(0,0,0,0);
      if(cr.some(r=>{
        const s=parseDate(r.startDate);s.setHours(0,0,0,0);
        const e=parseDate(r.endDate);e.setHours(0,0,0,0);
        return day>=s&&day<=e;
      }))used++;
    }
    return{car,daysRented:used,daysTotal:monthDaysCount,pct:Math.round(used/monthDaysCount*100),inRepair:!!car.inRepair};
  }).sort((a,b)=>b.pct-a.pct);
  // Средняя загрузка — только по машинам НЕ в ремонте (честная цифра доступного парка)
  const availUtil=utilization.filter(u=>!u.inRepair);
  const avgUtil=availUtil.length?Math.round(availUtil.reduce((s,u)=>s+u.pct,0)/availUtil.length):0;
  const repairCarsCount=cars.filter(c=>c.inRepair).length;
  const monthLabel=mo.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  // Источники + donut
  const bySrc={};
  for(const r of monthRentals){
    const sid=r.source||"other";
    if(!bySrc[sid])bySrc[sid]={count:0,revenue:0};
    bySrc[sid].count++;
    bySrc[sid].revenue+=parseFloat(r.price)||0;
  }
  const srcList=SOURCES.map(s=>({...s,...(bySrc[s.id]||{count:0,revenue:0})})).filter(s=>s.count>0).sort((a,b)=>b.revenue-a.revenue);
  const totalSrcRev=srcList.reduce((s,x)=>s+x.revenue,0);
  const segR=70,segC=2*Math.PI*segR;
  let cum=0;
  const segments=srcList.map(s=>{
    const length=totalSrcRev>0?(s.revenue/totalSrcRev)*segC:0;
    const startAngle=totalSrcRev>0?(cum/segC)*360:0;
    cum+=length;
    return{...s,length,startAngle,share:totalSrcRev>0?s.revenue/totalSrcRev:0};
  });
  const utilColor=avgUtil>=70?"#34D399":avgUtil>=40?"#FBBF24":"#F87171";
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    {/* Month nav */}
    <div className="card" style={{padding:"12px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg3)"}}>
      <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o-1)}>← Пред.</button>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".06em",textTransform:"uppercase"}}>{monthOffset===0?"Текущий месяц":monthOffset<0?`${Math.abs(monthOffset)} мес. назад`:`+${monthOffset} мес.`}</div>
        <div style={{fontSize:17,fontWeight:700,textTransform:"capitalize",marginTop:1,letterSpacing:"-.01em"}}>{monthLabel}</div>
      </div>
      <div style={{display:"flex",gap:6}}>
        {monthOffset!==0&&<button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(0)} style={{padding:"7px 12px",color:"var(--teal)"}}>Сегодня</button>}
        <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o+1)} disabled={monthOffset>=0} style={monthOffset>=0?{opacity:.4,cursor:"not-allowed"}:{}}>След. →</button>
      </div>
    </div>

    {/* HERO: загрузка (с большим кольцом), выручка, аренды */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14}}>
      {/* Загрузка БОЛЬШИМ кольцом */}
      <div className="card" style={{padding:"22px 24px",display:"flex",alignItems:"center",gap:18}}>
        <svg width="118" height="118" viewBox="0 0 118 118" style={{flexShrink:0}}>
          <circle cx="59" cy="59" r="50" fill="none" stroke="var(--bg)" strokeWidth="10"/>
          <circle cx="59" cy="59" r="50" fill="none" stroke={utilColor} strokeWidth="10"
            strokeDasharray={2*Math.PI*50}
            strokeDashoffset={2*Math.PI*50*(1-avgUtil/100)}
            strokeLinecap="round"
            transform="rotate(-90 59 59)"
            style={{transition:"stroke-dashoffset .6s ease",filter:`drop-shadow(0 0 8px ${utilColor}55)`}}/>
          <text x="59" y="60" textAnchor="middle" fontSize="30" fontWeight="800" fill="var(--text)" fontFamily="'JetBrains Mono'" letterSpacing="-.04em">{avgUtil}</text>
          <text x="59" y="78" textAnchor="middle" fontSize="13" fontWeight="700" fill="var(--text3)" fontFamily="'JetBrains Mono'">%</text>
        </svg>
        <div style={{minWidth:0,flex:1}}>
          <div style={{fontSize:11,color:"var(--text3)",fontWeight:700,letterSpacing:".07em",textTransform:"uppercase"}}>Загрузка парка</div>
          <div style={{fontSize:14,color:"var(--text2)",marginTop:6,lineHeight:1.4}}>средняя по доступному парку за {monthLabel.split(" ")[0]}</div>
          <div style={{fontSize:11,color:"var(--text3)",marginTop:8,fontFamily:"'JetBrains Mono'"}}>{cars.length-repairCarsCount} авто · {monthDaysCount} дн.{repairCarsCount>0?<span style={{color:"#A78BFA"}}> · −{repairCarsCount} в ремонте</span>:""}</div>
        </div>
      </div>
      {/* Выручка */}
      <div className="card" style={{padding:"22px 24px",display:"flex",flexDirection:"column",justifyContent:"center"}}>
        <div style={{fontSize:11,color:"var(--text3)",fontWeight:700,letterSpacing:".07em",textTransform:"uppercase"}}>Выручка</div>
        <div style={{fontSize:42,fontWeight:800,color:"#34D399",fontFamily:"'JetBrains Mono'",letterSpacing:"-.03em",marginTop:8,lineHeight:1}}>{revenue.toLocaleString("ru-RU",{maximumFractionDigits:0})}<span style={{fontSize:24,marginLeft:5,color:"var(--text3)"}}>€</span></div>
        {revTrend!==null?<div style={{fontSize:13,marginTop:10,color:revTrend>=0?"#34D399":"#F87171",fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:16}}>{revTrend>=0?"↑":"↓"}</span>{Math.abs(revTrend)}% к пред. месяцу
        </div>:revenue>0&&<div style={{fontSize:12,marginTop:10,color:"var(--text3)"}}>нет данных за пред. месяц</div>}
      </div>
      {/* Аренды */}
      <div className="card" style={{padding:"22px 24px",display:"flex",flexDirection:"column",justifyContent:"center"}}>
        <div style={{fontSize:11,color:"var(--text3)",fontWeight:700,letterSpacing:".07em",textTransform:"uppercase"}}>Аренд</div>
        <div style={{fontSize:42,fontWeight:800,color:"var(--text)",fontFamily:"'JetBrains Mono'",letterSpacing:"-.03em",marginTop:8,lineHeight:1}}>{monthRentals.length}</div>
        <div style={{fontSize:13,marginTop:10,color:"var(--text2)"}}>средний чек <b style={{color:"var(--teal)",fontFamily:"'JetBrains Mono'"}}>{avg.toFixed(0)} €</b></div>
        <div style={{fontSize:11,marginTop:4,color:"var(--text3)"}}>{completed} из них завершены</div>
      </div>
    </div>

    {/* Источники привлечения — наглядно с донат-чартом */}
    <div className="card" style={{padding:"20px 22px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        <span style={{fontSize:20}}>📡</span>
        <div style={{fontSize:14,fontWeight:700,letterSpacing:".04em",textTransform:"uppercase",color:"var(--text)"}}>Источники привлечения</div>
        {srcList.length>0&&<span style={{marginLeft:"auto",fontSize:11,color:"var(--text3)",fontWeight:500}}>{srcList.length} {srcList.length===1?"канал":srcList.length<5?"канала":"каналов"} · {totalSrcRev.toFixed(0)} €</span>}
      </div>
      {srcList.length===0?(
        <div style={{padding:"50px 0",textAlign:"center",color:"var(--text3)"}}>
          <div style={{fontSize:32,marginBottom:6,opacity:.3}}>📡</div>
          <div style={{fontSize:13,fontWeight:600,color:"var(--text2)"}}>Нет данных за {monthLabel.split(" ")[0]}</div>
          <div style={{fontSize:11,color:"var(--text3)",marginTop:4}}>при создании аренды выбирай источник, чтобы видеть аналитику</div>
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"230px 1fr",gap:28,alignItems:"center"}}>
          {/* Донат-график */}
          <div style={{position:"relative",width:200,height:200,margin:"0 auto"}}>
            <svg width="200" height="200" viewBox="0 0 200 200" style={{transform:"rotate(0deg)"}}>
              <circle cx="100" cy="100" r={segR} fill="none" stroke="var(--bg)" strokeWidth="24"/>
              {segments.map(s=>(
                <circle key={s.id}
                  cx="100" cy="100" r={segR}
                  fill="none"
                  stroke={s.color}
                  strokeWidth="24"
                  strokeDasharray={`${s.length} ${segC-s.length}`}
                  transform={`rotate(${s.startAngle-90} 100 100)`}
                  style={{transition:"stroke-dasharray .5s ease",filter:`drop-shadow(0 0 4px ${s.color}40)`}}
                />
              ))}
            </svg>
            <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
              <div style={{fontSize:10,color:"var(--text3)",fontWeight:700,letterSpacing:".05em"}}>ИТОГО</div>
              <div style={{fontSize:24,fontWeight:800,fontFamily:"'JetBrains Mono'",color:"#34D399",lineHeight:1.1,marginTop:2,letterSpacing:"-.02em"}}>{totalSrcRev.toFixed(0)}<span style={{fontSize:14,color:"var(--text3)",marginLeft:2}}>€</span></div>
              <div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>{monthRentals.length} аренд</div>
            </div>
          </div>
          {/* Список источников */}
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {segments.map(s=>(
              <div key={s.id} style={{background:"var(--bg3)",borderRadius:10,padding:"11px 14px",border:"1px solid var(--border)",borderLeft:`3px solid ${s.color}`}}>
                <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:6}}>
                  <span style={{fontSize:16}}>{s.icon}</span>
                  <div style={{fontSize:14,fontWeight:600}}>{s.label}</div>
                  <div style={{marginLeft:"auto",display:"flex",alignItems:"baseline",gap:8}}>
                    <div style={{fontSize:13,fontWeight:700,fontFamily:"'JetBrains Mono'",color:s.color,letterSpacing:"-.01em"}}>{(s.share*100).toFixed(0)}%</div>
                    <div style={{fontSize:16,fontWeight:800,fontFamily:"'JetBrains Mono'",color:"#34D399"}}>{s.revenue.toFixed(0)} €</div>
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6,fontSize:11,color:"var(--text2)"}}>
                  <span><b style={{color:"var(--text)"}}>{s.count}</b> {s.count===1?"аренда":s.count<5?"аренды":"аренд"}</span>
                  <span style={{color:"var(--text3)"}}>·</span>
                  <span>средн. чек <b style={{color:"var(--text2)",fontFamily:"'JetBrains Mono'"}}>{(s.revenue/s.count).toFixed(0)} €</b></span>
                </div>
                <div style={{height:4,background:"var(--bg)",borderRadius:2,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${s.share*100}%`,background:s.color,borderRadius:2,transition:"width .4s ease"}}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>

    {/* Топ авто + загрузка авто */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <div className="card" style={{padding:"16px 18px"}}>
        <div style={{fontSize:11,color:"var(--text3)",fontWeight:700,letterSpacing:".05em",marginBottom:12,display:"flex",alignItems:"center",gap:7}}><span style={{fontSize:14}}>💰</span><span>Топ авто по выручке</span></div>
        {topCars.length===0?<div style={{color:"var(--text3)",fontSize:13,padding:"24px 0",textAlign:"center"}}>Нет данных за месяц</div>:topCars.map((t,i)=>(
          <div key={t.car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:i<topCars.length-1?"1px solid var(--border)":"none"}}>

function TransferRentalForm({rental,cars,allRentals,onConfirm,onCancel}){
  const oldCar=cars.find(c=>c.id===rental.carId);
  const availableCars=cars.filter(c=>c.id!==rental.carId&&!c.inRepair);
  const today=fmtDate(new Date());
  const[newCarId,setNewCarId]=useState("");
  const[transferDate,setTransferDate]=useState(today);
  const[oldMileage,setOldMileage]=useState(rental.mileageIn||"");
  const[newMileage,setNewMileage]=useState("");
  const[reason,setReason]=useState("");
  const[sendToRepair,setSendToRepair]=useState(true);
  const conflicts=(()=>{
    if(!newCarId||!transferDate||!rental.endDate)return[];
    const cid=Number(newCarId);
    const start=parseDate(transferDate);start.setHours(0,0,0,0);
    const end=parseDate(rental.endDate);end.setHours(0,0,0,0);
    if(end<start)return[];
    return allRentals.filter(r=>{
      if(!r.active||r.carId!==cid||r.id===rental.id)return false;
      const rs=parseDate(r.startDate);rs.setHours(0,0,0,0);
      const re=parseDate(r.endDate);re.setHours(0,0,0,0);
      return rs<=end&&re>=start;
    });
  })();
  function submit(){
    if(!newCarId)return alert("Выберите новый автомобиль");
    if(!transferDate)return alert("Укажите дату перехода");
    if(conflicts.length){
      const list=conflicts.map(c=>`• ${c.clientName} (${fmtRu(c.startDate)} → ${fmtRu(c.endDate)})`).join("\n");
      if(!confirm(`⚠️ У нового авто конфликт:\n\n${list}\n\nВсё равно перевести?`))return;
    }
    onConfirm({newCarId:Number(newCarId),transferDate,oldMileage:oldMileage||"",newMileage:newMileage||"",reason:reason||"",sendOldToRepair:sendToRepair});
  }
  const newCarChosen=cars.find(c=>c.id===Number(newCarId));
  return <div style={{display:"flex",flexDirection:"column",gap:13}}>
    <div style={{background:"var(--bg3)",padding:"11px 14px",borderRadius:8,fontSize:12,color:"var(--text2)"}}>
      Клиент: <b style={{color:"var(--text)"}}>{rental.clientName}</b>
      <div style={{marginTop:6,fontSize:13,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        {oldCar&&<span style={{color:"#F87171",fontWeight:600}}>{oldCar.brand} {oldCar.model}</span>}
        <span style={{color:"var(--text3)"}}>→</span>
        <span style={{color:newCarChosen?"#34D399":"var(--text3)",fontWeight:600}}>{newCarChosen?`${newCarChosen.brand} ${newCarChosen.model}`:"новое авто"}</span>
      </div>
    </div>
    <div>
      <label className="label">Новое авто *</label>
      <select className="input" value={newCarId} onChange={e=>setNewCarId(e.target.value)} style={{background:"var(--bg)"}}>
        <option value="">Выберите...</option>
        {availableCars.map(c=><option key={c.id} value={c.id}>{c.brand} {c.model}{c.plate?` · ${c.plate}`:""}{c.city?` · ${c.city}`:""}</option>)}
      </select>
      {availableCars.length===0&&<div style={{fontSize:11,color:"#FBBF24",marginTop:6}}>Нет свободных авто — все остальные в ремонте</div>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Дата перехода *</label><input className="input" type="date" value={transferDate} onChange={e=>setTransferDate(e.target.value)}/></div>
      <div></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div>
        <label className="label">Пробег возврата старого</label>
        <input className="input" type="number" value={oldMileage} onChange={e=>setOldMileage(e.target.value)} placeholder="—"/>
        {rental.mileageOut&&<div style={{fontSize:10,color:"var(--text3)",marginTop:4}}>выдача: {rental.mileageOut} км</div>}
      </div>
      <div>
        <label className="label">Пробег выдачи нового</label>
        <input className="input" type="number" value={newMileage} onChange={e=>setNewMileage(e.target.value)} placeholder="—"/>
      </div>
    </div>
    <div><label className="label">Причина перехода</label><textarea className="input" rows={2} value={reason} onChange={e=>setReason(e.target.value)} style={{resize:"vertical"}} placeholder="—"/></div>
    {conflicts.length>0&&(
      <div style={{background:"#F8717115",border:"1px solid #F8717140",borderRadius:8,padding:"10px 13px"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#F87171",marginBottom:5,letterSpacing:".05em"}}>⚠️ КОНФЛИКТ У НОВОГО АВТО ({conflicts.length})</div>
        {conflicts.map(c=>(<div key={c.id} style={{fontSize:12,color:"var(--text2)",lineHeight:1.6}}>· <b style={{color:"var(--text)"}}>{c.clientName}</b> <span style={{fontFamily:"'JetBrains Mono'",color:"var(--text3)"}}>{fmtRu(c.startDate)} → {fmtRu(c.endDate)}</span></div>))}
      </div>
    )}
    <label style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",background:sendToRepair?"#A78BFA15":"var(--bg3)",borderRadius:8,cursor:"pointer",border:`1px solid ${sendToRepair?"#A78BFA40":"var(--border)"}`}}>
      <input type="checkbox" checked={sendToRepair} onChange={e=>setSendToRepair(e.target.checked)} style={{width:16,height:16,accentColor:"#A78BFA"}}/>
      <span style={{fontSize:13,fontWeight:600,color:sendToRepair?"#A78BFA":"var(--text)"}}>🔧 Отправить {oldCar?`${oldCar.brand} ${oldCar.model}`:"старое авто"} в ремонт</span>
    </label>
    <div style={{display:"flex",gap:8,marginTop:4}}>
      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-teal" style={{flex:2,justifyContent:"center"}} onClick={submit}>🔄 Перевести на новое авто</button>
    </div>
  </div>;
}

function PulseWidget({cars,rentals,onClick}){
  const today=new Date();today.setHours(0,0,0,0);
  const dayOfMonth=today.getDate();
  const monthStart=new Date(today.getFullYear(),today.getMonth(),1);
  const monthEnd=new Date(today.getFullYear(),today.getMonth()+1,0);
  const monthDays=monthEnd.getDate();
  // Парк сейчас
  const carStatuses=cars.map(c=>({car:c,...(c.inRepair?{status:"repair",rental:null}:getCarStatus(c.id,rentals))}));
  const active=carStatuses.filter(s=>s.status==="active").length;
  const overdue=carStatuses.filter(s=>s.status==="overdue").length;
  const free=carStatuses.filter(s=>s.status==="free").length;
  // Загрузка месяца до сегодня. Машины в ремонте исключаем — считаем загрузку только доступного парка.
  let used=0,total=0;
  for(const c of cars){
    if(c.inRepair)continue;
    const cr=rentals.filter(r=>r.carId===c.id);
    for(let d=1;d<=dayOfMonth;d++){
      const day=new Date(today.getFullYear(),today.getMonth(),d);day.setHours(0,0,0,0);
      total++;
      if(cr.some(r=>{const s=parseDate(r.startDate);s.setHours(0,0,0,0);const e=parseDate(r.endDate);e.setHours(0,0,0,0);return day>=s&&day<=e}))used++;
    }
  }
  const utilPct=total?Math.round(used/total*100):0;
  const repairCount=cars.filter(c=>c.inRepair).length;
  // Выручка текущего и предыдущего месяцев
  const revenueIn=(start,end)=>rentals.filter(r=>{if(!r.endDate)return false;const e=parseDate(r.endDate);return e>=start&&e<=end}).reduce((s,r)=>s+(parseFloat(r.price)||0),0);
  const revenue=revenueIn(monthStart,monthEnd);
  const prevMonthStart=new Date(today.getFullYear(),today.getMonth()-1,1);
  const prevMonthEnd=new Date(today.getFullYear(),today.getMonth(),0);
  const prevRevenue=revenueIn(prevMonthStart,prevMonthEnd);
  const revenueTrend=prevRevenue>0?Math.round((revenue-prevRevenue)/prevRevenue*100):null;
  // Sparkline: количество активных аренд по дням за 14 дней
  const spark=[];
  for(let i=13;i>=0;i--){
    const day=new Date(today);day.setDate(today.getDate()-i);day.setHours(0,0,0,0);
    const count=rentals.filter(r=>{const s=parseDate(r.startDate);s.setHours(0,0,0,0);const e=parseDate(r.endDate);e.setHours(0,0,0,0);return day>=s&&day<=e}).length;
    spark.push({day,count});
  }
  const maxSpark=Math.max(...spark.map(d=>d.count),1);
  const ringR=18,ringC=2*Math.PI*ringR;
  const ringColor=utilPct>=70?"#34D399":utilPct>=40?"#FBBF24":"#F87171";
  const pulseColor=overdue>0?"#F87171":active>0?"#34D399":"#94A3B8";
  return(
    <div onClick={onClick} style={{margin:"12px 12px 14px",padding:"14px 14px 13px",background:"linear-gradient(135deg, var(--bg3), var(--bg))",border:"1px solid var(--border)",borderRadius:12,cursor:onClick?"pointer":"default",transition:"all .15s"}}
      onMouseEnter={e=>{if(onClick){e.currentTarget.style.borderColor="var(--teal)";e.currentTarget.style.transform="translateY(-1px)"}}}
      onMouseLeave={e=>{if(onClick){e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.transform=""}}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
        <div className="pulse-dot" style={{width:8,height:8,borderRadius:"50%",background:pulseColor,color:pulseColor,flexShrink:0}}/>
        <div style={{fontSize:11,fontWeight:800,color:"var(--text2)",letterSpacing:".11em",textTransform:"uppercase"}}>Пульс</div>
        {overdue>0&&<div style={{marginLeft:"auto",fontSize:10,fontWeight:700,color:"#F87171",background:"rgba(248,113,113,.15)",padding:"2px 7px",borderRadius:10}}>⚠ {overdue}</div>}
      </div>
      {/* Revenue — FIRST and BIG */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:10,color:"var(--text3)",fontWeight:700,letterSpacing:".06em",textTransform:"uppercase"}}>Выручка месяца</div>
        <div style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono'",color:"#34D399",letterSpacing:"-.025em",marginTop:3,lineHeight:1.05}}>{revenue.toLocaleString("ru-RU",{maximumFractionDigits:0})}<span style={{fontSize:17,marginLeft:3,color:"var(--text3)"}}>€</span></div>
        {revenueTrend!==null&&<div style={{fontSize:11,marginTop:4,color:revenueTrend>=0?"#34D399":"#F87171",fontWeight:600}}>{revenueTrend>=0?"↑":"↓"} {Math.abs(revenueTrend)}% к пред. месяцу</div>}
        {revenueTrend===null&&prevRevenue===0&&revenue>0&&<div style={{fontSize:11,marginTop:4,color:"var(--text3)"}}>первый месяц</div>}
      </div>
      {/* Ring */}
      <div style={{marginBottom:14,display:"flex",alignItems:"center",gap:12}}>
        <svg width="54" height="54" viewBox="0 0 54 54" style={{flexShrink:0}}>
          <circle cx="27" cy="27" r="21" fill="none" stroke="var(--bg)" strokeWidth="5"/>
          <circle cx="27" cy="27" r="21" fill="none" stroke={ringColor} strokeWidth="5" strokeDasharray={2*Math.PI*21} strokeDashoffset={2*Math.PI*21*(1-utilPct/100)} strokeLinecap="round" transform="rotate(-90 27 27)" style={{transition:"stroke-dashoffset .6s ease"}}/>
          <text x="27" y="31" textAnchor="middle" fontSize="15" fontWeight="800" fill="var(--text)" fontFamily="'JetBrains Mono'">{utilPct}%</text>
        </svg>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10,color:"var(--text3)",fontWeight:700,letterSpacing:".06em",textTransform:"uppercase"}}>Загрузка мес.</div>
          <div style={{fontSize:12,color:"var(--text2)",marginTop:3,fontFamily:"'JetBrains Mono'",fontWeight:600}}>{used} <span style={{color:"var(--text3)",fontWeight:400}}>/ {total}</span></div>
          <div style={{fontSize:10,color:"var(--text3)",marginTop:1}}>дн × авто{repairCount>0?` · −${repairCount} в ремонте`:""}</div>
        </div>
      </div>
      {/* Sparkline */}
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
          <div style={{fontSize:10,color:"var(--text3)",fontWeight:700,letterSpacing:".06em",textTransform:"uppercase"}}>Активных за 14 дн</div>
          <div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>max {maxSpark}</div>
        </div>
        <svg width="100%" height="38" viewBox="0 0 88 38" preserveAspectRatio="none" style={{display:"block"}}>
          {spark.map((d,i)=>{
            const h=d.count>0?(d.count/maxSpark)*34:0;
            const isToday=i===13;
            return <rect key={i} x={i*6+0.5} y={38-h} width="5" height={Math.max(h,2)} rx="1.2" fill={isToday?"var(--teal)":"#475569"} opacity={d.count===0?.30:isToday?1:.85}/>;
          })}
        </svg>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginTop:3}}>
          <span>14 дн назад</span><span>сегодня</span>
        </div>
      </div>
    </div>
  );
}

function MiniMap({cars,trackerData,onSelectCar,height=280,hideHeader=false}){
  const mapRef=useRef(null);
  const mapInstanceRef=useRef(null);
  const markersRef=useRef({});
  useEffect(()=>{
    if(!window.L){console.warn("Leaflet not loaded");return}
    if(!mapRef.current||mapInstanceRef.current)return;
    const map=window.L.map(mapRef.current,{zoomControl:true,attributionControl:false}).setView([39.47,-0.38],7);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18}).addTo(map);
    mapInstanceRef.current=map;
    return()=>{try{map.remove()}catch{}mapInstanceRef.current=null};
  },[]);
  useEffect(()=>{
    const map=mapInstanceRef.current;
    if(!map||!window.L)return;
    const present=new Set();
    const bounds=[];
    for(const car of cars){
      const td=trackerData?.[car.id];
      if(!td||td.lat==null||td.lon==null)continue;
      const id=String(car.id);
      present.add(id);
      const html=`<div style="background:${car.color};width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);"></div>`;
      const speedKmh=td.speed?Math.round(td.speed*SPEED_KNOTS_TO_KMH):0;
      const popupHtml=`<div style="font-family:Inter,sans-serif;color:#0F172A"><b>${car.brand} ${car.model}</b>${car.plate?` · ${car.plate}`:""}<br/><small>${speedKmh>2?`🏁 ${speedKmh} км/ч`:"🅿️ стоит"} · ${relativeTimeRu(td.fixTime)}</small></div>`;
      if(markersRef.current[id]){
        markersRef.current[id].setLatLng([td.lat,td.lon]);
        markersRef.current[id].setPopupContent(popupHtml);
      }else{
        const icon=window.L.divIcon({html,className:"fleet-marker",iconSize:[14,14],iconAnchor:[7,7]});
        const m=window.L.marker([td.lat,td.lon],{icon}).addTo(map);
        m.bindPopup(popupHtml);
        if(onSelectCar)m.on("click",()=>onSelectCar(car.id));
        markersRef.current[id]=m;
      }
      bounds.push([td.lat,td.lon]);
    }
    for(const id of Object.keys(markersRef.current)){
      if(!present.has(id)){
        try{markersRef.current[id].remove()}catch{}
        delete markersRef.current[id];
      }
    }
    if(bounds.length>0){try{map.fitBounds(bounds,{padding:[24,24],maxZoom:12})}catch(e){console.warn("fitBounds",e)}}
    setTimeout(()=>{try{map.invalidateSize()}catch{}},100);

  async function syncCalendar(){
    const now=new Date();
    const r=await window.gapi.client.calendar.events.list({calendarId:"primary",timeMin:new Date(now.getFullYear(),now.getMonth()-6,1).toISOString(),timeMax:new Date(now.getFullYear(),now.getMonth()+6,1).toISOString(),singleEvents:true,orderBy:"startTime",maxResults:500});
    const cc=carsRef.current;
    const evs=(r.result.items||[]).filter(e=>e.summary&&e.summary.trim().length>1).map(e=>parseEvent(e,cc)).filter(x=>x.carId&&x.startDate&&x.endDate);
    setRentals(prev=>{
      const evMap=new Map(evs.map(e=>[e.googleEventId,e]));
      const result=[];
      for(const ex of prev){
        // Reconcile by googleEventId FIRST — независимо от fromGoogle.
        // Это устраняет задвоение: новая аренда из app тоже имеет googleEventId, и должна быть сматчена с событием из календаря.
        if(ex.googleEventId&&evMap.has(ex.googleEventId)){
          const nw=evMap.get(ex.googleEventId);
          result.push({...ex,clientName:nw.clientName,phone:nw.phone,city:nw.city||ex.city,location:nw.location||ex.location,price:nw.price||ex.price,documents:nw.documents||ex.documents,startDate:nw.startDate,endDate:nw.endDate,carId:nw.carId||ex.carId,fromGoogle:true});
          evMap.delete(ex.googleEventId);
        }else if(ex.fromGoogle){
          // Google-аренда, но в календаре её больше нет
          if(!ex.active)result.push(ex); // сохраняем завершённые как историю
          // активные сматченные с удалёнными в календаре — дропаем
        }else{
          // Ручная локальная без googleEventId (или с несматченным) — оставляем
          result.push(ex);
        }
      }
      // Добавляем новые события из календаря, НО пропускаем те у которых ID лежит в tombstones
      // (значит пользователь их явно удалял; не воскрешаем).
      const tombs=rentalTombstonesRef.current||{};
      for(const nw of evMap.values()){
        if(tombs[String(nw.id)]){
          console.log("[syncCalendar] пропускаю удалённое событие",nw.id);
          continue;
        }
        result.push({...nw,updatedAt:nowISO()});
      }
      return result;
    });
    setSyncCount(evs.length);
    return evs.length;
  }

  function isScopeError(e){
    const code=e?.status||e?.result?.error?.code;
    const reason=e?.result?.error?.errors?.[0]?.reason||"";
    return code===401||code===403||reason==="insufficientPermissions"||reason==="authError";
  }

  async function pullFromDrive(){
    try{
      const list=await window.gapi.client.drive.files.list({spaces:"appDataFolder",fields:"files(id,modifiedTime)",q:`name='${DRIVE_FILE_NAME}'`,pageSize:1});
      const files=list.result.files||[];
      if(!files.length)return false;
      const fid=files[0].id;
      setDriveFileId(fid);
      const content=await window.gapi.client.drive.files.get({fileId:fid,alt:"media"});
      let data;
      try{data=typeof content.body==="string"?JSON.parse(content.body):content.result}catch{return false}
      if(!data||!data.updatedAt)return false;
      // Per-item merge + tombstones: правки разных машин/аренд не перетирают друг друга,
      // а удаления "приклеиваются" через tombstones (merge берёт более свежее время удаления).
      const remoteCars=Array.isArray(data.cars)?data.cars:[];
      const remoteRentals=Array.isArray(data.rentals)?data.rentals:[];
      const remoteCarTombs=data.carTombstones||{};
      const remoteRentalTombs=data.rentalTombstones||{};
      const mCarTombs=mergeTombstones(carTombstonesRef.current,remoteCarTombs);
      const mRentalTombs=mergeTombstones(rentalTombstonesRef.current,remoteRentalTombs);
      const mergedCars=applyTombstones(mergeByUpdatedAt(carsRef.current,remoteCars),mCarTombs);
      const mergedRentals=applyTombstones(mergeByUpdatedAt(rentalsRef.current,remoteRentals),mRentalTombs);
      if(JSON.stringify(mCarTombs)!==JSON.stringify(carTombstonesRef.current))setCarTombstones(mCarTombs);
      if(JSON.stringify(mRentalTombs)!==JSON.stringify(rentalTombstonesRef.current))setRentalTombstones(mRentalTombs);
      if(JSON.stringify(mergedCars)!==JSON.stringify(carsRef.current))setCars(mergedCars);
      if(JSON.stringify(mergedRentals)!==JSON.stringify(rentalsRef.current))setRentals(mergedRentals);
      lastSyncedHashRef.current=JSON.stringify({c:mergedCars,r:mergedRentals});
      const curMeta=localStorage.getItem(META_UPDATED_KEY)||"0";
      if(data.updatedAt>curMeta)localStorage.setItem(META_UPDATED_KEY,data.updatedAt);
      const now=new Date().toISOString();
      setLastDriveSync(now);
      localStorage.setItem(META_LAST_SYNC_KEY,now);
      return true;
    }catch(e){
      console.error("Drive pull error",e);
      if(isScopeError(e)){
        console.warn("Drive: нет прав, прошу consent");
        if(tokenClient)tokenClient.requestAccessToken({prompt:"consent"});
        setSyncStatus("error");
      }
      return false;
    }
  }

  async function pushToDrive(retriesLeft){
    if(retriesLeft===undefined)retriesLeft=2;
    try{
      // Найти/создать файл
      let fid=driveFileId;
      if(!fid){
        const list=await window.gapi.client.drive.files.list({spaces:"appDataFolder",fields:"files(id)",q:`name='${DRIVE_FILE_NAME}'`,pageSize:1});
        if((list.result.files||[]).length)fid=list.result.files[0].id;
      }
      // КРИТИЧНО: сперва читаем что лежит в Drive ПРЯМО СЕЙЧАС и мержим с локалью
      // per-item + tombstones. Без этого push перетирает свежие изменения другого устройства,
      // а удаления "воскресают".
      let mergedCars=carsRef.current;
      let mergedRentals=rentalsRef.current;
      let mCarTombs=carTombstonesRef.current;
      let mRentalTombs=rentalTombstonesRef.current;
      let etag=null;
      if(fid){
        try{
          const resp=await window.gapi.client.drive.files.get({fileId:fid,alt:"media"});
          // ETag — версия файла на момент чтения. Передадим её в If-Match при записи,
          // и Drive отклонит наш PATCH если кто-то другой записал свою версию между.
          const h=resp.headers||{};
          etag=h.etag||h.ETag||h.Etag||null;
          const remote=typeof resp.body==="string"?JSON.parse(resp.body):resp.result;
          if(remote){
            mCarTombs=mergeTombstones(carTombstonesRef.current,remote.carTombstones||{});
            mRentalTombs=mergeTombstones(rentalTombstonesRef.current,remote.rentalTombstones||{});
            if(Array.isArray(remote.cars))mergedCars=mergeByUpdatedAt(carsRef.current,remote.cars);
            if(Array.isArray(remote.rentals))mergedRentals=mergeByUpdatedAt(rentalsRef.current,remote.rentals);
            mergedCars=applyTombstones(mergedCars,mCarTombs);
            mergedRentals=applyTombstones(mergedRentals,mRentalTombs);
          }
          // Если merge принёс изменения — обновляем UI чтобы пользователь увидел свежие данные
          if(JSON.stringify(mergedCars)!==JSON.stringify(carsRef.current))setCars(mergedCars);
          if(JSON.stringify(mergedRentals)!==JSON.stringify(rentalsRef.current))setRentals(mergedRentals);
          if(JSON.stringify(mCarTombs)!==JSON.stringify(carTombstonesRef.current))setCarTombstones(mCarTombs);
          if(JSON.stringify(mRentalTombs)!==JSON.stringify(rentalTombstonesRef.current))setRentalTombstones(mRentalTombs);
        }catch(e){console.warn("Pre-push read failed, продолжаю без merge",e)}
      }
      const payload={version:2,updatedAt:new Date().toISOString(),cars:mergedCars,rentals:mergedRentals,carTombstones:mCarTombs,rentalTombstones:mRentalTombs};
      const body=JSON.stringify(payload);
      if(fid){
        const req={path:`/upload/drive/v3/files/${fid}`,method:"PATCH",params:{uploadType:"media"},body};
        if(etag)req.headers={"If-Match":etag};
        try{
          await window.gapi.client.request(req);
        }catch(writeErr){
          // 412 Precondition Failed = кто-то записал свою версию между нашим read и write.
          // Перечитываем (с новым ETag), снова мержим, снова пишем.
          if(writeErr?.status===412&&retriesLeft>0){
            console.warn("[Push] ETag mismatch — Drive изменился, повторяю (осталось "+retriesLeft+")");
            return await pushToDrive(retriesLeft-1);
          }
          throw writeErr;
        }
      }else{
        const boundary="-------fleetdesk-boundary";
        const metadata={name:DRIVE_FILE_NAME,parents:["appDataFolder"]};
        const multipart=
          `--${boundary}\r\n`+
          "Content-Type: application/json; charset=UTF-8\r\n\r\n"+
          JSON.stringify(metadata)+"\r\n"+
          `--${boundary}\r\n`+
          "Content-Type: application/json; charset=UTF-8\r\n\r\n"+
          body+"\r\n"+
          `--${boundary}--`;
        const res=await window.gapi.client.request({path:"/upload/drive/v3/files",method:"POST",params:{uploadType:"multipart"},headers:{"Content-Type":`multipart/related; boundary=${boundary}`},body:multipart});
        fid=res.result.id;
        setDriveFileId(fid);
      }
      localStorage.setItem(META_UPDATED_KEY,payload.updatedAt);
      setLastDriveSync(payload.updatedAt);
      localStorage.setItem(META_LAST_SYNC_KEY,payload.updatedAt);
      lastSyncedHashRef.current=JSON.stringify({c:mergedCars,r:mergedRentals});
    }catch(e){
      console.error("Drive push error",e);
      if(isScopeError(e)){
        console.warn("Drive: нет прав на push, прошу consent");
        if(tokenClient)tokenClient.requestAccessToken({prompt:"consent"});
      }
      setSyncStatus("error");
      throw e;
    }
  }

  // === LOBBO sync helpers ===
  async function lobboSyncPositions(creds){
    if(!creds)return;
    setLobboStatus("syncing");
    try{
      const positions=await lobboGetPositions(creds);
      // Refresh devices in parallel (online status может поменяться)
      try{const devs=await lobboGetDevices(creds);setLobboDevices(devs)}catch{}
      const carsByDevId=new Map();
      carsRef.current.forEach(c=>{if(c.lobboDeviceId)carsByDevId.set(Number(c.lobboDeviceId),c.id)});
      setTrackerData(prev=>{
        const next={...prev};
        for(const pos of positions){
          const carId=carsByDevId.get(pos.deviceId);
          if(!carId)continue;
          next[carId]={
            deviceId:pos.deviceId,
            mileage:pos.attributes?.totalDistance?Math.round(pos.attributes.totalDistance/1000):next[carId]?.mileage||null,
            lat:pos.latitude,lon:pos.longitude,
            address:pos.address||"",
            speed:pos.speed,
            battery:pos.attributes?.batteryLevel,
            ignition:pos.attributes?.ignition,
            fixTime:pos.fixTime,
            syncedAt:nowISO(),
          };
        }
        return next;
      });
      const now=nowISO();
      setLobboLastSync(now);
      localStorage.setItem("lobbo_last_sync",now);
      setLobboStatus("done");
      setTimeout(()=>setLobboStatus("idle"),3000);
    }catch(e){
      console.error("Lobbo sync error",e);
      setLobboStatus("error");
    }
  }
  async function connectLobbo(baseUrl,email,password){
    setLobboStatus("syncing");
    const creds={baseUrl:lobboBase(baseUrl),email,password};
    try{
      const devs=await lobboGetDevices(creds); // одновременно валидация + список
      setLobboCreds(creds);
      setLobboDevices(devs);
      await lobboSyncPositions(creds);
    }catch(e){
      console.error("Lobbo connect error",e);
      setLobboStatus("error");
      const msg=e.status===401?"Неверный email или пароль":e.message;
      alert("❌ Ошибка подключения LOBBO: "+msg);
    }
  }
  function disconnectLobbo(){
    setLobboCreds(null);
    setLobboDevices([]);
    setTrackerData({});
    setLobboLastSync(null);
    localStorage.removeItem("lobbo_last_sync");
    setShowLobboModal(false);
  }
  function saveLobboMapping(mapping){
    // mapping: {[deviceIdString]: carId}
    const devIdByCarId=new Map();
    Object.entries(mapping).forEach(([dev,cid])=>{if(cid)devIdByCarId.set(cid,Number(dev))});
    setCars(cs=>cs.map(c=>{
      const newDevId=devIdByCarId.get(c.id);
      if(newDevId){
        if(Number(c.lobboDeviceId)===newDevId)return c;
        const device=lobboDevices.find(d=>d.id===newDevId);
        return{...c,lobboDeviceId:newDevId,lobboDeviceName:device?.name||"",updatedAt:nowISO()};
      }
      if(c.lobboDeviceId){
        return{...c,lobboDeviceId:undefined,lobboDeviceName:undefined,updatedAt:nowISO()};
      }
      return c;
    }));
    setShowLobboModal(false);
    setTimeout(()=>{if(lobboCreds)lobboSyncPositions(lobboCreds)},500);
  }
  // Авто-синк LOBBO каждые 5 минут (с паузой на открытую форму)
  useEffect(()=>{
    if(!lobboCreds)return;
    const last=localStorage.getItem("lobbo_last_sync");
    if(last)setLobboLastSync(last);
    // Initial fetch
    (async()=>{

    },5*60*1000);

  },[lobboCreds?.email,lobboCreds?.baseUrl]);

  async function fullSync(){
    setSyncStatus("syncing");
    try{
      await pullFromDrive();
      try{await syncCalendar()}catch(e){console.error("Calendar sync error",e)}
      setInitialSyncDone(true);
      setSyncStatus("done");
      setTimeout(()=>setSyncStatus("idle"),4000);
    }catch(e){console.error(e);setSyncStatus("error")}
  }

  useEffect(()=>{
    if(!signedIn||!initialSyncDone)return;
    const currentHash=JSON.stringify({c:cars,r:rentals});
    if(currentHash===lastSyncedHashRef.current)return;
    // Сокращено с 2000ms до 700ms: между Save и реальной записью в Drive
    // окно потенциальной потери стало ~3 раза меньше.
    const t=setTimeout(()=>{
      setSyncStatus("syncing");
      pushToDrive().then(()=>{
        setSyncStatus("done");
        setTimeout(()=>setSyncStatus("idle"),3000);
      }).catch(e=>{console.error("Auto-push failed",e)});
    },700);
    return()=>clearTimeout(t);
  },[cars,rentals,signedIn,initialSyncDone]);

  // Аварийная пушка при сворачивании/закрытии вкладки. Если есть unpushed-изменения —
  // пытаемся вытолкнуть их СРАЗУ при переходе вкладки в hidden (закрытие, switch tab, minimize).
  useEffect(()=>{
    if(!signedIn||!initialSyncDone)return;
    const handler=()=>{
      if(document.hidden){
        const hash=JSON.stringify({c:carsRef.current,r:rentalsRef.current});
        if(hash!==lastSyncedHashRef.current&&!formOpenRef.current){
          console.log("[Visibility-push] вкладка скрыта, пушаю срочно");
          pushToDrive().catch(e=>console.error("Visibility push",e));
        }
      }
    };
    document.addEventListener("visibilitychange",handler);
    return()=>document.removeEventListener("visibilitychange",handler);
  },[signedIn,initialSyncDone]);
