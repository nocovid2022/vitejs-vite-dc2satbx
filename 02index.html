<!DOCTYPE html>
<html lang="ru">
<head>

<style>
:root{
  --bg:#F4F6F8;
  --bg2:#FFFFFF;
  --bg3:#F8FAFB;
  --border:#E5E7EB;
  --border2:#D1D5DB;
  --teal:#0EA5E9;
  --teal2:#0284C7;
  --teal-dim:#0EA5E920;
  --teal-dim2:#0EA5E910;
  --text:#0F172A;
  --text2:#475569;
  --text3:#94A3B8;
  --green:#10B981;
  --yellow:#F59E0B;
  --red:#EF4444;
  --purple:#8B5CF6;
  --green-dim:#10B98118;
  --yellow-dim:#F59E0B18;
  --red-dim:#EF444418;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 25px rgba(15,23,42,.10),0 4px 10px rgba(15,23,42,.06);
  --shadow-xl:0 20px 40px rgba(15,23,42,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.005em}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#94A3B8}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:8px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:-.005em}
.btn-teal{background:var(--teal);color:#fff;padding:10px 18px;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(14,165,233,.20)}.btn-teal:hover{background:var(--teal2);box-shadow:0 2px 4px rgba(14,165,233,.30)}
.btn-ghost{background:var(--bg2);color:var(--text);padding:10px 18px;font-size:14px;border:1px solid var(--border2);box-shadow:var(--shadow-sm)}.btn-ghost:hover{border-color:var(--teal);color:var(--teal);background:var(--bg2)}
.btn-red{background:#FEF2F2;color:#DC2626;padding:9px 16px;font-size:14px;border:1px solid #FCA5A5}
.btn-sm{padding:7px 14px;font-size:13px}
.input{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:11px 14px;color:var(--text);font-size:15px;width:100%;outline:none;transition:all .15s;font-family:inherit}.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.input::placeholder{color:var(--text3);opacity:.6}
.label{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.04em;display:block;margin-bottom:6px;text-transform:uppercase}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;transition:all .2s;box-shadow:var(--shadow-sm)}.card:hover{box-shadow:var(--shadow-md);border-color:var(--border2)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600}
.view-pill{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;color:var(--text2);padding:10px 14px;border-radius:8px;transition:all .15s;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.view-pill:hover{background:var(--bg3);color:var(--text)}
.view-pill.active{background:var(--teal-dim2);color:var(--teal);font-weight:600}
.tab-btn{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;color:var(--text2);padding:12px 18px;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.section{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}
.section-row{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.section-row:last-child{border-bottom:none}
.tl-bar{border-radius:6px;cursor:pointer;display:flex;align-items:center;padding:0 8px;overflow:hidden;position:absolute;transition:all .15s;box-shadow:0 1px 2px rgba(15,23,42,.10)}
.tl-bar:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 3px 8px rgba(15,23,42,.15)}
.tl-bar::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent);border-radius:inherit;pointer-events:none}
.stat-card{background:var(--bg2);border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border2)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}

/* Layout: sidebar + main */
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;padding:18px 12px;z-index:50;overflow-y:auto}
.sidebar-label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:0 14px;margin:14px 0 8px}
.main-content{margin-left:240px;min-height:100vh}
.topbar{background:rgba(255,255,255,.85);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;backdrop-filter:blur(12px)}
.content-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
@media (max-width:1180px){.content-grid{grid-template-columns:1fr}}
.notif-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;cursor:pointer;transition:all .15s;display:block}
.notif-card:hover{box-shadow:var(--shadow-md);transform:translateX(-2px)}

/* Draggable modal */
.drag-modal{position:fixed;background:var(--bg2);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-xl);z-index:300;min-width:460px;max-width:540px;width:100%;overflow:hidden}
.drag-modal-header{padding:16px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);cursor:grab;user-select:none;background:var(--bg3)}
.drag-modal-header:active{cursor:grabbing}
.drag-modal-body{padding:22px;max-height:76vh;overflow-y:auto}
.drag-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(4px);z-index:299}

@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}.fade-in{animation:fadeIn .18s ease}
@keyframes spin{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:spin 1s linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;
const CLIENT_ID="546196176766-060ji046vk8r8kem36ko66dr6d4gme9n.apps.googleusercontent.com";

const CAR_COLORS=["#0EA5E9","#3498DB","#8B5CF6","#F59E0B","#1ABC9C","#EF4444","#F1C40F","#2ECC71","#16A085","#8E44AD","#D35400","#10B981"];

const DEFAULT_CARS=[
  {id:1,brand:"Volkswagen",model:"Polo",plate:"",city:"",color:CAR_COLORS[0],lastServiceMileage:"",nextServiceMileage:""},

  {id:6,brand:"Hyundai",model:"Ionic",plate:"",city:"",color:CAR_COLORS[5],lastServiceMileage:"",nextServiceMileage:""},
  {id:7,brand:"Skoda",model:"Superb",plate:"",city:"",color:CAR_COLORS[6],lastServiceMileage:"",nextServiceMileage:""},

  {id:9,brand:"Fiat",model:"500e Alicante",plate:"",city:"Alicante",color:CAR_COLORS[8],lastServiceMileage:"",nextServiceMileage:""},
  {id:10,brand:"Fiat",model:"500e Valencia",plate:"",city:"Valencia",color:CAR_COLORS[9],lastServiceMileage:"",nextServiceMileage:""},
  {id:11,brand:"BMW",model:"218d Gran Tourer",plate:"",city:"",color:CAR_COLORS[10],lastServiceMileage:"",nextServiceMileage:""},
  {id:12,brand:"Toyota",model:"Yaris",plate:"",city:"",color:CAR_COLORS[11],lastServiceMileage:"",nextServiceMileage:""},
];

const CAR_KW=[
  {id:1,kw:["polo","vw polo","volkswagen polo"]},
  {id:2,kw:["golf","vw golf","volkswagen golf"]},
  {id:3,kw:["lexus","ct200","ct 200"]},
  {id:4,kw:["yaris hybrid","yaris гибрид"]},
  {id:5,kw:["scala"]},
  {id:6,kw:["ionic","ioniq"]},
  {id:7,kw:["superb"]},
  {id:8,kw:["passat"]},
  {id:9,kw:["500e alicante","500 alicante","fiat alicante"]},
  {id:10,kw:["500e","fiat 500","500 valencia","fiat 500e"]},
  {id:11,kw:["218","gran tourer","218d","bmw 218"]},
  {id:12,kw:["yaris"]},
];

function getRentalStatus(r){
  if(!r||!r.active)return"done";
  const now=new Date();now.setHours(0,0,0,0);
  const s=parseDate(r.startDate);s.setHours(0,0,0,0);
  const e=parseDate(r.endDate);e.setHours(0,0,0,0);
  if(e<now)return"overdue";if(s>now)return"reserved";return"active";
}
const SC={
  active:{label:"В аренде",color:"#059669",bg:"#10B98118",dot:"#10B981"},
  reserved:{label:"Резерв",color:"#D97706",bg:"#F59E0B18",dot:"#F59E0B"},
  overdue:{label:"Просрочено",color:"#DC2626",bg:"#EF444418",dot:"#EF4444"},
  free:{label:"Свободна",color:"#64748B",bg:"#94A3B818",dot:"#94A3B8"},
  done:{label:"Завершено",color:"#0284C7",bg:"#0EA5E918",dot:"#0EA5E9"},
  repair:{label:"В ремонте",color:"#7C3AED",bg:"#8B5CF618",dot:"#8B5CF6"},
};
function getCarStatus(carId,rentals){
  const active=rentals.filter(r=>r.active&&r.carId===carId);
  if(!active.length)return{status:"free",rental:null};
  const cur=active.find(r=>getRentalStatus(r)==="active");if(cur)return{status:"active",rental:cur};
  const ov=active.find(r=>getRentalStatus(r)==="overdue");if(ov)return{status:"overdue",rental:ov};
  const res=active.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate))[0];
  return{status:"reserved",rental:res};
}
function findCarId(text,cars){
  const t=text.toLowerCase();
  for(const ck of CAR_KW){if(ck.kw.some(k=>t.includes(k)))return ck.id}
  for(const c of cars){if(t.includes(c.model.toLowerCase())||t.includes((c.brand+" "+c.model).toLowerCase()))return c.id}
  return null;
}
function parseEvent(ev,cars){
  const title=ev.summary||"",desc=ev.description||"";
  const phoneMatch=title.match(/\+[\d\s\-()]{8,15}/);
  const phone=phoneMatch?phoneMatch[0].trim():"";
  let rest=title.replace(/\+[\d\s\-()]{8,15}/,"").trim();
  rest=rest.replace(/оплата.*/i,"").replace(/аванс.*/i,"").replace(/залог.*/i,"").trim();
  const carId=findCarId(rest,cars)||findCarId(title,cars);
  let rem=rest;
  if(carId){
    const ck=CAR_KW.find(x=>x.id===carId);
    if(ck)for(const k of ck.kw)rem=rem.replace(new RegExp(k,"gi"),"").trim();
    const car=cars.find(c=>c.id===carId);
    if(car)rem=rem.replace(new RegExp(car.model,"gi"),"").replace(new RegExp(car.brand,"gi"),"").trim();
  }
  rem=rem.replace(/\s+/g," ").replace(/^[-,·\s]+|[-,·\s]+$/g,"").trim();
  const parts=rem.split(/\s+/).filter(Boolean);
  const CITIES=["валенсия","мадрид","барселона","аликанте","севилья","малага","valencia","madrid","barcelona","alicante","sevilla","malaga","бенидорм","торревьеха","murcia","мурсия","benidorm","torrevieja"];
  let city="",clientName="";
  if(parts.length>0&&CITIES.includes(parts[0].toLowerCase())){city=parts[0];clientName=parts.slice(1).join(" ")}
  else clientName=parts.join(" ");
  const g=k=>{const m=desc.match(new RegExp(k+"[:\\s]+([^\\n]+)","i"));return m?m[1].trim():""};
  return{id:ev.id,googleEventId:ev.id,carId,clientName:clientName||title,phone,city:city||g("город")||g("city"),location:g("место")||g("location"),price:g("цена")||g("price"),documents:g("документы")||g("docs"),notes:desc,startDate:ev.start?.date||(ev.start?.dateTime?ev.start.dateTime.split("T")[0]:""),endDate:ev.end?.date||(ev.end?.dateTime?ev.end.dateTime.split("T")[0]:""),active:true,fromGoogle:true};
}
function toGoogleEvent(r,cars){
  const car=cars.find(c=>c.id===r.carId);
  const label=car?`${car.brand} ${car.model}`:"";
  const title=`${r.city?r.city+" ":""}${r.clientName} ${label}${r.phone?" "+r.phone:""}`.trim();
  const lines=[r.price&&`Цена: ${r.price} €`,r.location&&`Место: ${r.location}`,r.documents&&`Документы: ${r.documents}`].filter(Boolean);
  return{summary:title,description:lines.join("\n"),start:{date:r.startDate},end:{date:r.endDate}};
}
function fmtDate(d){return d.toISOString().split("T")[0]}
function parseDate(s){if(!s)return new Date();const[y,m,d]=s.split("-");return new Date(+y,+m-1,+d)}
function daysLeft(e){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(e)-n)/86400000)}
function daysUntil(s){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(s)-n)/86400000)}
function fmtRu(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})}
function fmtRuFull(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"})}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function useDraggable(init){
  const[pos,setPos]=useState(init);
  const drag=useRef(false);const off=useRef({x:0,y:0});
  const down=useCallback((e)=>{if(e.target.closest('.no-drag'))return;drag.current=true;off.current={x:e.clientX-pos.x,y:e.clientY-pos.y};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)},[pos]);
  const move=useCallback((e)=>{if(!drag.current)return;setPos({x:e.clientX-off.current.x,y:e.clientY-off.current.y})},[]);
  const up=useCallback(()=>{drag.current=false;document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)},[]);
  useEffect(()=>()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)},[]);
  return{pos,down};
}

function DragModal({title,onClose,children,ix,iy,width}){
  const{pos,down}=useDraggable({x:ix!=null?ix:window.innerWidth/2-240,y:iy!=null?iy:80});
  return <>
    <div className="drag-modal-overlay" onClick={onClose}/>
    <div className="drag-modal fade-in" style={{left:Math.max(0,Math.min(pos.x,window.innerWidth-480)),top:Math.max(0,Math.min(pos.y,window.innerHeight-100)),width:width||480}}>
      <div className="drag-modal-header" onMouseDown={down}>
        <div style={{fontSize:14,fontWeight:700,color:"var(--text)"}}>{title}</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:10,color:"#444",userSelect:"none"}}>✥ перетащи</span>
          <button className="btn btn-ghost btn-sm no-drag" onClick={onClose} style={{padding:"3px 10px"}}>✕</button>
        </div>
      </div>
      <div className="drag-modal-body">{children}</div>
    </div>
  </>;
}

// Logo component — точный стиль сайта

        <div style={{fontSize:11,fontWeight:900,color:"#EF4444",letterSpacing:"-.02em",fontStyle:"italic",marginBottom:-1}}>Auto</div>
        <div style={{fontSize:8,fontWeight:700,color:"#fff",letterSpacing:".02em"}}>in Spain</div>
      </div>
      <div>
        <div style={{fontSize:13,fontWeight:700,color:"var(--text3)",letterSpacing:".1em",textTransform:"uppercase",lineHeight:1}}>Fleet</div>
        <div style={{fontSize:13,fontWeight:700,color:"var(--teal)",letterSpacing:".1em",textTransform:"uppercase",lineHeight:1}}>Management</div>
      </div>

}

// Stat card component — кликабельная
function StatCard({icon,label,value,color,bg,rentals,cars,onClick}){
  return(
    <div className="stat-card" onClick={onClick}>
      <div className="stat-icon" style={{background:bg,color}}>{icon}</div>

        <div style={{fontSize:12,color:"var(--text2)",marginTop:5,fontWeight:500}}>{label}</div>
      </div>
    </div>

}

// Quick list modal — показывается при клике на стат
function QuickList({title,rentals,cars,color,onClose,onSelect}){
  return <>
    <div style={{marginBottom:14,fontSize:12,color:"var(--text3)"}}>Нажми на карточку чтобы открыть подробности</div>
    {rentals.length===0&&<div style={{textAlign:"center",padding:"30px",color:"var(--text3)"}}>Нет записей</div>}
    {rentals.map(r=>{
      const car=cars.find(c=>c.id===r.carId);
      const dl=daysLeft(r.endDate);
      const status=getRentalStatus(r);
      return(
        <div key={r.id} style={{background:"var(--bg3)",borderRadius:10,padding:"12px 14px",marginBottom:8,cursor:"pointer",border:`1px solid ${color}20`,transition:"all .15s"}}
          onClick={()=>{onSelect(r);onClose()}}
          onMouseEnter={e=>e.currentTarget.style.borderColor=color}
          onMouseLeave={e=>e.currentTarget.style.borderColor=`${color}20`}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:"var(--text)"}}>{r.clientName}</div>
              {car&&<div style={{fontSize:11,color:"var(--text3)",display:"flex",alignItems:"center",gap:5,marginTop:2}}><div style={{width:5,height:5,borderRadius:"50%",background:car.color}}></div>{car.brand} {car.model}</div>}
            </div>
            <div style={{textAlign:"right"}}>
              {r.phone&&<div style={{fontSize:12,color:"var(--teal)",fontWeight:500}}>{r.phone}</div>}
              {r.city&&<div style={{fontSize:11,color:"var(--text3)"}}>{r.city}</div>}
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,borderTop:"1px solid var(--border)"}}>
            <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{fmtRu(r.startDate)} → {fmtRu(r.endDate)}</div>
            <div style={{fontSize:11,fontWeight:700,color}}>
              {status==="reserved"?`через ${daysUntil(r.startDate)} дн.`:status==="overdue"?`просрочено ${Math.abs(dl)} дн.`:dl===0?"сегодня возврат":`${dl} дн. осталось`}
              {r.price&&<span style={{color:"#10B981",marginLeft:8}}>{r.price} €</span>}
            </div>
          </div>
        </div>
      );
    })}
  </>;
}

function AvailabilityChecker({cars,rentals}){
  const[from,setFrom]=useState(fmtDate(new Date()));
  const[to,setTo]=useState("");
  const[results,setResults]=useState(null);
  function check(){
    const f=parseDate(from);f.setHours(0,0,0,0);
    const t=to?parseDate(to):f;t.setHours(0,0,0,0);
    const res=cars.map(car=>{
      if(car.inRepair)return{car,status:"repair",conflict:null};
      const conflicts=rentals.filter(r=>{
        if(!r.active||r.carId!==car.id)return false;
        const s=parseDate(r.startDate);s.setHours(0,0,0,0);
        const e=parseDate(r.endDate);e.setHours(0,0,0,0);
        return s<=t&&e>=f;
      });
      if(!conflicts.length)return{car,status:"free",conflict:null};
      const act=conflicts.find(r=>getRentalStatus(r)==="active");
      return{car,status:act?"busy":"reserved",conflict:act||conflicts[0]};
    });
    setResults(res);
  }
  const free=results?.filter(r=>r.status==="free")||[];
  const busy=results?.filter(r=>r.status==="busy"||r.status==="reserved")||[];
  const repair=results?.filter(r=>r.status==="repair")||[];
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <div><label className="label">С какого числа</label><input className="input" type="date" value={from} onChange={e=>setFrom(e.target.value)}/></div>
      <div><label className="label">По какое (необязательно)</label><input className="input" type="date" value={to} onChange={e=>setTo(e.target.value)}/></div>
    </div>
    <button className="btn btn-teal" style={{width:"100%",justifyContent:"center",marginBottom:16}} onClick={check}>Проверить доступность</button>
    {results&&<>
      {free.length>0&&<>
        <div style={{fontSize:12,fontWeight:700,color:"#10B981",marginBottom:8}}>✓ Свободно: {free.length} авто</div>
        {free.map(({car})=>(
          <div key={car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"#10B98112",borderRadius:8,marginBottom:6,border:"1px solid #10B98125"}}>

            <div style={{minWidth:0,flex:1}}>
              <div style={{fontWeight:600,fontSize:13}}>{car.brand} {car.model}</div>
              <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginTop:2}}>{car.plate||"без номера"}{car.city?` · 📍 ${car.city}`:""}</div>
            </div>
            <span className="tag" style={{background:"#10B98120",color:"#10B981",flexShrink:0}}>Свободна</span>
          </div>
        ))}
      </>}
      {busy.length>0&&<>
        <div style={{fontSize:12,fontWeight:700,color:"var(--text3)",marginTop:12,marginBottom:8}}>Занято: {busy.length} авто</div>
        {busy.map(({car,status,conflict})=>(
          <div key={car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:status==="busy"?"#EF444410":"#F59E0B10",borderRadius:8,marginBottom:6,border:`1px solid ${status==="busy"?"#EF444425":"#F59E0B25"}`}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:car.color,flexShrink:0}}></div>
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontWeight:600,fontSize:13}}>{car.brand} {car.model}{car.city?<span style={{fontWeight:400,color:"var(--text3)",marginLeft:6,fontSize:11}}>📍 {car.city}</span>:null}</div>
              {conflict&&<div style={{fontSize:11,color:"var(--text3)"}}>{conflict.clientName} · {fmtRu(conflict.startDate)}–{fmtRu(conflict.endDate)}</div>}
            </div>
            <span className="tag" style={{background:status==="busy"?"#EF444420":"#F59E0B20",color:status==="busy"?"#EF4444":"#F59E0B",flexShrink:0}}>{status==="busy"?"В аренде":"Резерв"}</span>

function WarningsStrip({rentals,cars,onSelect}){
  const returnsSoon=rentals.filter(r=>{
    if(!r.active)return false;
    const dl=daysLeft(r.endDate);
    return dl>=0&&dl<=1;
  }).sort((a,b)=>daysLeft(a.endDate)-daysLeft(b.endDate));
  const reservedSoon=rentals.filter(r=>{
    if(!r.active||getRentalStatus(r)!=="reserved")return false;
    const du=daysUntil(r.startDate);
    return du>=0&&du<=3;
  }).sort((a,b)=>daysUntil(a.startDate)-daysUntil(b.startDate));
  const toWarnings=cars.map(car=>{
    const next=parseInt(car.nextServiceMileage);
    if(!next)return null;
    const cr=rentals.filter(r=>r.carId===car.id);
    let current=parseInt(car.lastServiceMileage)||0;
    for(const r of cr){
      const o=parseInt(r.mileageOut)||0,i=parseInt(r.mileageIn)||0;
      if(o>current)current=o;
      if(i>current)current=i;
    }
    const remaining=next-current;
    if(remaining>1500)return null;
    return{car,current,next,remaining};
  }).filter(Boolean).sort((a,b)=>a.remaining-b.remaining);
  const total=returnsSoon.length+reservedSoon.length+toWarnings.length;
  if(!total)return(
    <div className="card" style={{padding:"18px",textAlign:"center"}}>
      <div style={{fontSize:32,marginBottom:6,opacity:.4}}>✓</div>
      <div style={{fontSize:13,fontWeight:600,color:"var(--text2)"}}>Никаких напоминаний</div>
      <div style={{fontSize:12,color:"var(--text3)",marginTop:4}}>Все аренды под контролем</div>
    </div>
  );
  return <div className="card" style={{padding:"16px"}}>
    <div style={{fontSize:13,fontWeight:700,marginBottom:13,letterSpacing:"-.01em",display:"flex",alignItems:"center",gap:8}}>
      <span>🔔 Уведомления</span>
      <span style={{background:"var(--bg3)",color:"var(--text2)",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:600,marginLeft:"auto"}}>{total}</span>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {returnsSoon.map(r=>{
        const car=cars.find(c=>c.id===r.carId);
        const dl=daysLeft(r.endDate);
        return <div key={"ret"+r.id} className="notif-card" onClick={()=>onSelect(r)} style={{borderLeft:"3px solid #F59E0B"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <div style={{fontSize:10,color:"#D97706",fontWeight:700,letterSpacing:".05em"}}>↩ {dl===0?"СЕГОДНЯ ВОЗВРАТ":"ЗАВТРА ВОЗВРАТ"}</div>
            <div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{fmtRu(r.endDate)}</div>
          </div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{r.clientName}</div>
          <div style={{fontSize:11,color:"var(--text2)"}}>{car?car.model:""}{r.phone?` · ${r.phone}`:""}</div>
        </div>;
      })}
      {reservedSoon.map(r=>{
        const car=cars.find(c=>c.id===r.carId);
        const du=daysUntil(r.startDate);
        return <div key={"rsv"+r.id} className="notif-card" onClick={()=>onSelect(r)} style={{borderLeft:"3px solid #0EA5E9"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <div style={{fontSize:10,color:"#0284C7",fontWeight:700,letterSpacing:".05em"}}>📅 РЕЗЕРВ {du===0?"СЕГОДНЯ":du===1?"ЗАВТРА":`+${du}Д`}</div>
            <div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{fmtRu(r.startDate)}</div>
          </div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{r.clientName}</div>
          <div style={{fontSize:11,color:"var(--text2)"}}>{car?car.model:""}{r.phone?` · ${r.phone}`:""}</div>
        </div>;
      })}
      {toWarnings.map(w=>(
        <div key={"to"+w.car.id} className="notif-card" style={{borderLeft:"3px solid #8B5CF6",cursor:"default"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <div style={{fontSize:10,color:"#7C3AED",fontWeight:700,letterSpacing:".05em"}}>🔧 {w.remaining<=0?"ТО ПРОСРОЧЕНО":"ТО СКОРО"}</div>
            <div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{w.remaining<=0?`+${Math.abs(w.remaining)}км`:`-${w.remaining}км`}</div>
          </div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{w.car.brand} {w.car.model}</div>
          <div style={{fontSize:11,color:"var(--text2)",fontFamily:"'JetBrains Mono'"}}>{w.current} / {w.next} км</div>
        </div>
      ))}
    </div>
  </div>;
}

      <button className="btn btn-red" style={{flex:2,justifyContent:"center"}} onClick={submit}>Завершить аренду</button>

  </div>;
}

function Stats({rentals,cars}){
  const[monthOffset,setMonthOffset]=useState(0);
  const today=new Date();
  const mo=new Date(today.getFullYear(),today.getMonth()+monthOffset,1);mo.setHours(0,0,0,0);
  const monthEnd=new Date(mo.getFullYear(),mo.getMonth()+1,0);monthEnd.setHours(23,59,59);
  const monthRentals=rentals.filter(r=>{
    if(!r.endDate)return false;
    const e=parseDate(r.endDate);
    return e>=mo&&e<=monthEnd;
  });
  const revenue=monthRentals.reduce((s,r)=>s+(parseFloat(r.price)||0),0);
  const completed=monthRentals.filter(r=>!r.active).length;
  const avg=monthRentals.length?revenue/monthRentals.length:0;
  const byCar={};
  for(const r of monthRentals){
    const p=parseFloat(r.price)||0;
    byCar[r.carId]=(byCar[r.carId]||0)+p;
  }
  const topCars=Object.entries(byCar).map(([cid,rev])=>({car:cars.find(c=>c.id===Number(cid)),revenue:rev})).filter(x=>x.car).sort((a,b)=>b.revenue-a.revenue).slice(0,5);
  const monthDaysCount=monthEnd.getDate();
  const utilization=cars.map(car=>{
    const cr=rentals.filter(r=>r.carId===car.id);
    let used=0;
    for(let d=1;d<=monthDaysCount;d++){
      const day=new Date(mo.getFullYear(),mo.getMonth(),d);day.setHours(0,0,0,0);
      if(cr.some(r=>{
        const s=parseDate(r.startDate);s.setHours(0,0,0,0);
        const e=parseDate(r.endDate);e.setHours(0,0,0,0);
        return day>=s&&day<=e;
      }))used++;
    }
    return{car,daysRented:used,daysTotal:monthDaysCount,pct:Math.round(used/monthDaysCount*100)};
  }).sort((a,b)=>b.pct-a.pct);
  const avgUtil=cars.length?Math.round(utilization.reduce((s,u)=>s+u.pct,0)/cars.length):0;
  const monthLabel=mo.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div className="card" style={{padding:"11px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg3)"}}>
      <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o-1)}>← Пред.</button>
      <div style={{fontSize:14,fontWeight:700,textTransform:"capitalize"}}>{monthLabel}</div>
      <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o+1)} disabled={monthOffset>=0} style={monthOffset>=0?{opacity:.4,cursor:"not-allowed"}:{}}>След. →</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
      <div className="card" style={{padding:"14px 16px"}}>
        <div style={{fontSize:11,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ВЫРУЧКА</div>
        <div style={{fontSize:28,fontWeight:800,color:"#10B981",fontFamily:"'JetBrains Mono'",marginTop:4}}>{revenue.toFixed(0)} €</div>
      </div>
      <div className="card" style={{padding:"14px 16px"}}>
        <div style={{fontSize:11,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>АРЕНД</div>
        <div style={{fontSize:28,fontWeight:800,fontFamily:"'JetBrains Mono'",marginTop:4}}>{monthRentals.length}</div>
        <div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>{completed} завершено</div>
      </div>
      <div className="card" style={{padding:"14px 16px"}}>
        <div style={{fontSize:11,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>СРЕДНИЙ ЧЕК</div>
        <div style={{fontSize:28,fontWeight:800,color:"var(--teal)",fontFamily:"'JetBrains Mono'",marginTop:4}}>{avg.toFixed(0)} €</div>
      </div>
      <div className="card" style={{padding:"14px 16px"}}>
        <div style={{fontSize:11,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>СРЕДН. ЗАГРУЗКА</div>
        <div style={{fontSize:28,fontWeight:800,color:"#F59E0B",fontFamily:"'JetBrains Mono'",marginTop:4}}>{avgUtil}%</div>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <div className="card" style={{padding:"14px 16px"}}>
        <div style={{fontSize:11,color:"var(--text3)",fontWeight:700,letterSpacing:".05em",marginBottom:10}}>💰 ТОП АВТО ПО ВЫРУЧКЕ</div>
        {topCars.length===0?<div style={{color:"var(--text3)",fontSize:13,padding:"24px 0",textAlign:"center"}}>Нет данных за месяц</div>:topCars.map((t,i)=>(
          <div key={t.car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:i<topCars.length-1?"1px solid var(--border)":"none"}}>
            <div style={{width:24,height:24,borderRadius:"50%",background:t.car.color+"30",border:`1px solid ${t.car.color}60`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:t.car.color}}>{i+1}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.car.brand} {t.car.model}</div>
              {t.car.plate&&<div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{t.car.plate}</div>}
            </div>
            <div style={{fontSize:14,fontWeight:700,color:"#10B981",fontFamily:"'JetBrains Mono'"}}>{t.revenue.toFixed(0)} €</div>
          </div>
        ))}
      </div>
      <div className="card" style={{padding:"14px 16px"}}>
        <div style={{fontSize:11,color:"var(--text3)",fontWeight:700,letterSpacing:".05em",marginBottom:10}}>📊 ЗАГРУЗКА АВТО</div>
        {utilization.map(u=>(
          <div key={u.car.id} style={{padding:"5px 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div style={{display:"flex",alignItems:"center",gap:6,minWidth:0}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:u.car.color,flexShrink:0}}/>
                <div style={{fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{u.car.brand} {u.car.model}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{u.daysRented}/{u.daysTotal}</div>
                <div style={{fontSize:11,fontWeight:700,fontFamily:"'JetBrains Mono'",color:u.pct>=70?"#10B981":u.pct>=40?"#F59E0B":"var(--text3)",minWidth:34,textAlign:"right"}}>{u.pct}%</div>
              </div>
            </div>
            <div style={{height:5,background:"var(--bg3)",borderRadius:3,overflow:"hidden"}}>
              <div style={{height:"100%",width:u.pct+"%",background:u.pct>=70?"#10B981":u.pct>=40?"#F59E0B":"#555",borderRadius:3,transition:"width .3s"}}/>
            </div>
          </div>
        ))}
      </div>
    </div>
  </div>;
}

function TransferRentalForm({rental,cars,allRentals,onConfirm,onCancel}){
  const oldCar=cars.find(c=>c.id===rental.carId);
  const availableCars=cars.filter(c=>c.id!==rental.carId&&!c.inRepair);
  const today=fmtDate(new Date());
  const[newCarId,setNewCarId]=useState("");
  const[transferDate,setTransferDate]=useState(today);
  const[oldMileage,setOldMileage]=useState(rental.mileageIn||"");
  const[newMileage,setNewMileage]=useState("");
  const[reason,setReason]=useState("");
  const[sendToRepair,setSendToRepair]=useState(true);
  const conflicts=(()=>{
    if(!newCarId||!transferDate||!rental.endDate)return[];
    const cid=Number(newCarId);
    const start=parseDate(transferDate);start.setHours(0,0,0,0);
    const end=parseDate(rental.endDate);end.setHours(0,0,0,0);
    if(end<start)return[];
    return allRentals.filter(r=>{
      if(!r.active||r.carId!==cid||r.id===rental.id)return false;
      const rs=parseDate(r.startDate);rs.setHours(0,0,0,0);
      const re=parseDate(r.endDate);re.setHours(0,0,0,0);
      return rs<=end&&re>=start;
    });
  })();
  function submit(){
    if(!newCarId)return alert("Выберите новый автомобиль");
    if(!transferDate)return alert("Укажите дату перехода");
    if(conflicts.length){
      const list=conflicts.map(c=>`• ${c.clientName} (${fmtRu(c.startDate)} → ${fmtRu(c.endDate)})`).join("\n");
      if(!confirm(`⚠️ У нового авто конфликт:\n\n${list}\n\nВсё равно перевести?`))return;
    }
    onConfirm({newCarId:Number(newCarId),transferDate,oldMileage:oldMileage||"",newMileage:newMileage||"",reason:reason||"",sendOldToRepair:sendToRepair});
  }
  const newCarChosen=cars.find(c=>c.id===Number(newCarId));

        {oldCar&&<span style={{color:"#EF4444",fontWeight:600}}>{oldCar.brand} {oldCar.model}</span>}

        <span style={{color:newCarChosen?"#10B981":"var(--text3)",fontWeight:600}}>{newCarChosen?`${newCarChosen.brand} ${newCarChosen.model}`:"новое авто"}</span>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Дата перехода *</label><input className="input" type="date" value={transferDate} onChange={e=>setTransferDate(e.target.value)}/></div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>

      </div>

    <label style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",background:sendToRepair?"#8B5CF615":"var(--bg3)",borderRadius:8,cursor:"pointer",border:`1px solid ${sendToRepair?"#8B5CF640":"var(--border)"}`}}>
      <input type="checkbox" checked={sendToRepair} onChange={e=>setSendToRepair(e.target.checked)} style={{width:16,height:16,accentColor:"#8B5CF6"}}/>
      <span style={{fontSize:13,fontWeight:600,color:sendToRepair?"#8B5CF6":"var(--text)"}}>🔧 Отправить {oldCar?`${oldCar.brand} ${oldCar.model}`:"старое авто"} в ремонт</span>

      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>

  </div>;
}

            </div>

          </div>

function App(){
  const[cars,setCars]=useState(()=>{try{const s=localStorage.getItem(CARS_KEY);return s?JSON.parse(s):DEFAULT_CARS}catch{return DEFAULT_CARS}});
  const[rentals,setRentals]=useState(()=>{try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):[]}catch{return[]}});
  const[view,setView]=useState("timeline");
  const[clientsTab,setClientsTab]=useState("active");
  const[monthOffset,setMonthOffset]=useState(0);
  const[showForm,setShowForm]=useState(false);
  const[showCarForm,setShowCarForm]=useState(false);
  const[editCarId,setEditCarId]=useState(null);
  const[showGuide,setShowGuide]=useState(false);
  const[showAvail,setShowAvail]=useState(false);
  const[editRental,setEditRental]=useState(null);
  const[selected,setSelected]=useState(null);
  const[quickList,setQuickList]=useState(null); // {title, rentals, color}
  const[gapiReady,setGapiReady]=useState(false);
  const[gisReady,setGisReady]=useState(false);
  const[signedIn,setSignedIn]=useState(false);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[syncCount,setSyncCount]=useState(0);
  const[tokenClient,setTokenClient]=useState(null);
  const[driveFileId,setDriveFileId]=useState(null);
  const[lastDriveSync,setLastDriveSync]=useState(()=>localStorage.getItem(META_LAST_SYNC_KEY)||null);
  const[initialSyncDone,setInitialSyncDone]=useState(false);
  const[endingRental,setEndingRental]=useState(null);
  const[clientHistoryPhone,setClientHistoryPhone]=useState(null);
  const[prefillCarId,setPrefillCarId]=useState(null);
  const[transferRental,setTransferRental]=useState(null);
  const carsRef=useRef(cars);
  const rentalsRef=useRef(rentals);
  const lastSyncedHashRef=useRef(null);
  const isFirstRenderRef=useRef(true);
  useEffect(()=>{carsRef.current=cars},[cars]);
  useEffect(()=>{rentalsRef.current=rentals},[rentals]);
  useEffect(()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(rentals))},[rentals]);
  useEffect(()=>{localStorage.setItem(CARS_KEY,JSON.stringify(cars))},[cars]);
  useEffect(()=>{
    if(isFirstRenderRef.current){isFirstRenderRef.current=false;return}
    localStorage.setItem(META_UPDATED_KEY,new Date().toISOString());
  },[cars,rentals]);

  useEffect(()=>{
    const s1=document.createElement("script");s1.src="https://apis.google.com/js/api.js";
    s1.onload=()=>{window.gapi.load("client",async()=>{await window.gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest","https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});setGapiReady(true)})};
    document.head.appendChild(s1);
    const s2=document.createElement("script");s2.src="https://accounts.google.com/gsi/client";
    s2.onload=()=>{
      const tc=window.google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID,
        scope:SCOPES,
        callback:(r)=>{
          if(r.error){console.error("Auth error",r);setSyncStatus("error");return}
          setSignedIn(true);
          const granted=r.scope||"";
          if(!granted.includes("drive.appdata")){
            console.warn("Drive scope не получен — повторный запрос с consent. Granted:",granted);
            setTimeout(()=>tc.requestAccessToken({prompt:"consent"}),200);
            return;
          }
          fullSync();
        }
      });
      setTokenClient(tc);setGisReady(true);
    };
    document.head.appendChild(s2);
  },[]);

  async function syncCalendar(){
    const now=new Date();
    const r=await window.gapi.client.calendar.events.list({calendarId:"primary",timeMin:new Date(now.getFullYear(),now.getMonth()-6,1).toISOString(),timeMax:new Date(now.getFullYear(),now.getMonth()+6,1).toISOString(),singleEvents:true,orderBy:"startTime",maxResults:500});
    const cc=carsRef.current;
    const evs=(r.result.items||[]).filter(e=>e.summary&&e.summary.trim().length>1).map(e=>parseEvent(e,cc)).filter(x=>x.carId&&x.startDate&&x.endDate);
    setRentals(prev=>{
      const evMap=new Map(evs.map(e=>[e.googleEventId,e]));
      const result=[];
      for(const ex of prev){
        // Reconcile by googleEventId FIRST — независимо от fromGoogle.
        // Это устраняет задвоение: новая аренда из app тоже имеет googleEventId, и должна быть сматчена с событием из календаря.
        if(ex.googleEventId&&evMap.has(ex.googleEventId)){
          const nw=evMap.get(ex.googleEventId);
          result.push({...ex,clientName:nw.clientName,phone:nw.phone,city:nw.city||ex.city,location:nw.location||ex.location,price:nw.price||ex.price,documents:nw.documents||ex.documents,startDate:nw.startDate,endDate:nw.endDate,carId:nw.carId||ex.carId,fromGoogle:true});
          evMap.delete(ex.googleEventId);
        }else if(ex.fromGoogle){
          // Google-аренда, но в календаре её больше нет
          if(!ex.active)result.push(ex); // сохраняем завершённые как историю
          // активные сматченные с удалёнными в календаре — дропаем
        }else{
          // Ручная локальная без googleEventId (или с несматченным) — оставляем
          result.push(ex);
        }
      }
      for(const nw of evMap.values())result.push(nw);
      return result;
    });
    setSyncCount(evs.length);
    return evs.length;
  }

  function isScopeError(e){
    const code=e?.status||e?.result?.error?.code;
    const reason=e?.result?.error?.errors?.[0]?.reason||"";
    return code===401||code===403||reason==="insufficientPermissions"||reason==="authError";
  }

  async function pullFromDrive(){
    try{
      const list=await window.gapi.client.drive.files.list({spaces:"appDataFolder",fields:"files(id,modifiedTime)",q:`name='${DRIVE_FILE_NAME}'`,pageSize:1});
      const files=list.result.files||[];
      if(!files.length)return false;
      const fid=files[0].id;
      setDriveFileId(fid);
      const content=await window.gapi.client.drive.files.get({fileId:fid,alt:"media"});
      let data;
      try{data=typeof content.body==="string"?JSON.parse(content.body):content.result}catch{return false}
      if(!data||!data.updatedAt)return false;
      const localUpdated=localStorage.getItem(META_UPDATED_KEY)||"0";
      if(data.updatedAt>localUpdated){
        const newCars=Array.isArray(data.cars)&&data.cars.length?data.cars:carsRef.current;
        const newRentals=Array.isArray(data.rentals)?data.rentals:rentalsRef.current;
        setCars(newCars);
        setRentals(newRentals);
        lastSyncedHashRef.current=JSON.stringify({c:newCars,r:newRentals});
        localStorage.setItem(META_UPDATED_KEY,data.updatedAt);
      }else{
        lastSyncedHashRef.current=JSON.stringify({c:carsRef.current,r:rentalsRef.current});
      }
      const now=new Date().toISOString();
      setLastDriveSync(now);
      localStorage.setItem(META_LAST_SYNC_KEY,now);
      return true;
    }catch(e){
      console.error("Drive pull error",e);
      if(isScopeError(e)){
        console.warn("Drive: нет прав, прошу consent");
        if(tokenClient)tokenClient.requestAccessToken({prompt:"consent"});
        setSyncStatus("error");
      }
      return false;
    }
  }

  async function pushToDrive(){
    try{
      const payload={version:1,updatedAt:new Date().toISOString(),cars:carsRef.current,rentals:rentalsRef.current};
      const body=JSON.stringify(payload);
      let fid=driveFileId;
      if(!fid){
        const list=await window.gapi.client.drive.files.list({spaces:"appDataFolder",fields:"files(id)",q:`name='${DRIVE_FILE_NAME}'`,pageSize:1});
        if((list.result.files||[]).length)fid=list.result.files[0].id;
      }
      if(fid){
        await window.gapi.client.request({path:`/upload/drive/v3/files/${fid}`,method:"PATCH",params:{uploadType:"media"},body});
      }else{
        const boundary="-------fleetdesk-boundary";
        const metadata={name:DRIVE_FILE_NAME,parents:["appDataFolder"]};
        const multipart=
          `--${boundary}\r\n`+
          "Content-Type: application/json; charset=UTF-8\r\n\r\n"+
          JSON.stringify(metadata)+"\r\n"+
          `--${boundary}\r\n`+
          "Content-Type: application/json; charset=UTF-8\r\n\r\n"+
          body+"\r\n"+
          `--${boundary}--`;
        const res=await window.gapi.client.request({path:"/upload/drive/v3/files",method:"POST",params:{uploadType:"multipart"},headers:{"Content-Type":`multipart/related; boundary=${boundary}`},body:multipart});
        fid=res.result.id;
        setDriveFileId(fid);
      }
      localStorage.setItem(META_UPDATED_KEY,payload.updatedAt);
      setLastDriveSync(payload.updatedAt);
      localStorage.setItem(META_LAST_SYNC_KEY,payload.updatedAt);
      lastSyncedHashRef.current=JSON.stringify({c:carsRef.current,r:rentalsRef.current});
    }catch(e){
      console.error("Drive push error",e);
      if(isScopeError(e)){
        console.warn("Drive: нет прав на push, прошу consent");
        if(tokenClient)tokenClient.requestAccessToken({prompt:"consent"});
      }
      setSyncStatus("error");
      throw e;
    }
  }

  async function fullSync(){
    setSyncStatus("syncing");
    try{
      await pullFromDrive();
      try{await syncCalendar()}catch(e){console.error("Calendar sync error",e)}
      setInitialSyncDone(true);
      setSyncStatus("done");
      setTimeout(()=>setSyncStatus("idle"),4000);
    }catch(e){console.error(e);setSyncStatus("error")}
  }

  useEffect(()=>{
    if(!signedIn||!initialSyncDone)return;
    const currentHash=JSON.stringify({c:cars,r:rentals});
    if(currentHash===lastSyncedHashRef.current)return;
    const t=setTimeout(()=>{
      setSyncStatus("syncing");
      pushToDrive().then(()=>{
        setSyncStatus("done");
        setTimeout(()=>setSyncStatus("idle"),3000);
      }).catch(e=>{console.error("Auto-push failed",e)});
    },2000);
    return()=>clearTimeout(t);
  },[cars,rentals,signedIn,initialSyncDone]);

  async function createCalEvent(r){if(!signedIn)return null;try{const res=await window.gapi.client.calendar.events.insert({calendarId:"primary",resource:toGoogleEvent(r,carsRef.current)});return res.result.id}catch(e){console.error("Calendar create error",e);return null}}
  async function updateCalEvent(r){
    if(!signedIn)return null;
    if(!r.googleEventId)return await createCalEvent(r);
    try{await window.gapi.client.calendar.events.update({calendarId:"primary",eventId:r.googleEventId,resource:toGoogleEvent(r,carsRef.current)})}catch(e){console.error("Calendar update error",e)}
    return r.googleEventId;
  }
  async function deleteCalEvent(r){
    if(!signedIn||!r.googleEventId)return;
    try{await window.gapi.client.calendar.events.delete({calendarId:"primary",eventId:r.googleEventId})}catch(e){console.error("Calendar delete error",e)}
  }

  async function saveRental(data){
    if(editRental){
      let u={...editRental,...data};
      const gid=await updateCalEvent(u);
      if(gid&&!u.googleEventId)u={...u,googleEventId:gid};
      setRentals(r=>r.map(x=>x.id===editRental.id?u:x));
    }
    else{
      const n={...data,id:Date.now(),active:true};
      const gid=await createCalEvent(n);
      if(gid)n.googleEventId=gid;
      setRentals(r=>[...r,n]);
    }
    setShowForm(false);setEditRental(null);setPrefillCarId(null);
  }

  // Завершение аренды: открывает модалку. Реальное завершение — в confirmEndRental.
  function openEndRental(rental){setEndingRental(rental);setSelected(null)}
  async function confirmEndRental(updates){
    if(!endingRental)return;
    const r=rentalsRef.current.find(x=>x.id===endingRental.id);
    if(r)deleteCalEvent(r);
    setRentals(rs=>rs.map(x=>{
      if(x.id!==endingRental.id)return x;
      const patch={...x,active:false,endedAt:fmtDate(new Date()),googleEventId:undefined};
      if(updates.mileageIn!==undefined&&updates.mileageIn!=="")patch.mileageIn=updates.mileageIn;
      if(updates.price!==undefined&&updates.price!=="")patch.price=updates.price;
      if(updates.depositReturned!==undefined)patch.depositReturned=updates.depositReturned;
      return patch;
    }));
    if(updates.updateCarServiceMileage){
      const carId=endingRental.carId;
      const car=carsRef.current.find(c=>c.id===carId);
      const oldLast=parseInt(car?.lastServiceMileage)||0;
      const oldNext=parseInt(car?.nextServiceMileage)||(oldLast+10000);
      const interval=Math.max(oldNext-oldLast,5000)||10000;
      const newLast=updates.updateCarServiceMileage;
      const newNext=newLast+interval;
      setCars(cs=>cs.map(c=>c.id===carId?{...c,lastServiceMileage:String(newLast),nextServiceMileage:String(newNext)}:c));
    }
    setEndingRental(null);
  }

  function saveCar(data){
    if(editCarId)setCars(c=>c.map(x=>x.id===editCarId?{...x,...data}:x));
    else{const color=CAR_COLORS[cars.length%CAR_COLORS.length];setCars(c=>[...c,{...data,id:Date.now(),color,lastServiceMileage:"",nextServiceMileage:""}])}
    setShowCarForm(false);setEditCarId(null);
  }

  // Переподача аренды с авто A на авто B + (опц) отправка A в ремонт
  async function confirmTransferRental(updates){
    if(!transferRental)return;
    const oldRental=rentalsRef.current.find(r=>r.id===transferRental.id);
    if(!oldRental)return;
    const oldCar=carsRef.current.find(c=>c.id===oldRental.carId);
    const newCar=carsRef.current.find(c=>c.id===updates.newCarId);
    const td=updates.transferDate;
    const oldNote=`🔄 ${td}: переход на ${newCar?`${newCar.brand} ${newCar.model}`:"другое авто"}${updates.reason?` — ${updates.reason}`:""}`;
    const newNote=`🔄 ${td}: переподача с ${oldCar?`${oldCar.brand} ${oldCar.model}`:"другого авто"}${updates.reason?` — ${updates.reason}`:""}`;
    const updatedOld={...oldRental,
      active:false,
      endedAt:td,
      endDate:td,
      mileageIn:updates.oldMileage||oldRental.mileageIn||"",
      notes:oldRental.notes?`${oldRental.notes}\n${oldNote}`:oldNote,
      googleEventId:undefined,
    };
    // Delete old Calendar event
    if(oldRental.googleEventId&&signedIn){
      try{await window.gapi.client.calendar.events.delete({calendarId:"primary",eventId:oldRental.googleEventId})}catch(e){console.error("Calendar delete on transfer",e)}
    }
    const newRental={...oldRental,
      id:Date.now(),
      carId:updates.newCarId,
      startDate:td,
      endDate:oldRental.endDate,
      mileageOut:updates.newMileage||"",
      mileageIn:"",
      active:true,
      endedAt:undefined,
      notes:oldRental.notes?`${oldRental.notes}\n${newNote}`:newNote,
      googleEventId:undefined,
      fromGoogle:false,
    };
    const newGid=await createCalEvent(newRental);
    if(newGid)newRental.googleEventId=newGid;
    setRentals(rs=>{
      const without=rs.filter(r=>r.id!==oldRental.id);
      return[...without,updatedOld,newRental];
    });
    if(updates.sendOldToRepair&&oldCar){
      setCars(cs=>cs.map(c=>c.id===oldCar.id?{...c,inRepair:true,repairNotes:updates.reason||c.repairNotes||"После переподачи клиента"}:c));
    }
    setTransferRental(null);
    setSelected(null);
  }

  // Полное удаление аренды — убирает из приложения и из Google Calendar
  function deleteRentalById(id){
    const r=rentalsRef.current.find(x=>x.id===id);
    if(r)deleteCalEvent(r);
    setRentals(rs=>rs.filter(x=>x.id!==id));
    setSelected(null);setEndingRental(null);setClientHistoryPhone(null);
  }
  function deleteCar(id){
    setCars(cs=>cs.filter(c=>c.id!==id));
    setShowCarForm(false);setEditCarId(null);
  }

  const today=new Date();today.setHours(0,0,0,0);
  const vm=new Date(today.getFullYear(),today.getMonth()+monthOffset,1);
  const days=Array.from({length:new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate()},(_,i)=>new Date(vm.getFullYear(),vm.getMonth(),i+1));
  const monthLabel=vm.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  function rentalForDay(cid,day){return rentals.find(r=>{if(!r.active||r.carId!==cid)return false;const s=parseDate(r.startDate);s.setHours(0,0,0,0);const e=parseDate(r.endDate);e.setHours(0,0,0,0);return day>=s&&day<=e})}

  const activeR=rentals.filter(r=>r.active&&getRentalStatus(r)==="active");
  const reservedR=rentals.filter(r=>r.active&&getRentalStatus(r)==="reserved");
  const overdueR=rentals.filter(r=>r.active&&getRentalStatus(r)==="overdue");
  const doneR=rentals.filter(r=>!r.active);
  const repairCars=cars.filter(c=>c.inRepair);
  const freeCount=cars.filter(c=>!c.inRepair&&getCarStatus(c.id,rentals).status==="free").length;

  const clientTabs=[
    {key:"active",label:"В аренде",count:activeR.length,color:"#10B981"},
    {key:"reserved",label:"Резерв",count:reservedR.length,color:"#F59E0B"},
    {key:"overdue",label:"Просрочено",count:overdueR.length,color:"#EF4444"},
    {key:"done",label:"Завершённые",count:doneR.length,color:"var(--teal)"},
  ];
  const tabRentals={active:activeR,reserved:reservedR,overdue:overdueR,done:doneR};

  const viewTitles={timeline:"Таймлайн аренд",cars:"Автопарк",clients:"Клиенты",finance:"Финансы"};
  return(
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      {/* Sidebar */}
      <aside className="sidebar">
        <div style={{padding:"4px 14px 20px"}}><Logo/></div>
        <div className="sidebar-label">Меню</div>
        <button className={"view-pill"+(view==="timeline"?" active":"")} onClick={()=>setView("timeline")}><span style={{fontSize:17}}>📅</span> Таймлайн</button>
        <button className={"view-pill"+(view==="cars"?" active":"")} onClick={()=>setView("cars")}><span style={{fontSize:17}}>🚗</span> Автопарк</button>
        <button className={"view-pill"+(view==="clients"?" active":"")} onClick={()=>setView("clients")}><span style={{fontSize:17}}>👤</span> Клиенты</button>
        <button className={"view-pill"+(view==="finance"?" active":"")} onClick={()=>setView("finance")}><span style={{fontSize:17}}>📊</span> Финансы</button>
        <div className="sidebar-label">Действия</div>
        <button className="view-pill" onClick={()=>{setEditRental(null);setShowForm(true)}} style={{color:"var(--teal)"}}><span style={{fontSize:17}}>➕</span> Новая аренда</button>
        <button className="view-pill" onClick={()=>{setEditCarId(null);setShowCarForm(true)}}><span style={{fontSize:17}}>🚙</span> Добавить авто</button>
        <button className="view-pill" onClick={()=>setShowAvail(true)}><span style={{fontSize:17}}>🔍</span> Доступность</button>
        <div style={{marginTop:"auto",padding:"14px",borderTop:"1px solid var(--border)",fontSize:11,color:"var(--text3)"}}>
          {signedIn?<>
            <div style={{display:"flex",alignItems:"center",gap:6,fontWeight:600,color:"var(--green)"}}><span style={{width:7,height:7,borderRadius:"50%",background:"var(--green)"}}></span>Google подключен</div>
            {lastDriveSync&&<div style={{marginTop:4,fontFamily:"'JetBrains Mono'"}}>Синк: {new Date(lastDriveSync).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</div>}
          </>:"Не подключен к Google"}
        </div>
      </aside>

      {/* Main */}
      <main className="main-content">
        <div className="topbar">
          <div>
            <div style={{fontSize:11,color:"var(--text3)",fontWeight:600,letterSpacing:".05em",textTransform:"uppercase"}}>{view==="timeline"?monthLabel:"Обзор"}</div>
            <div style={{fontSize:20,fontWeight:700,marginTop:2,letterSpacing:"-.01em"}}>{viewTitles[view]||"Дашборд"}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {!signedIn?(
              <button className="btn btn-ghost btn-sm" onClick={()=>gapiReady&&gisReady&&tokenClient.requestAccessToken({prompt:""})}>
                <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                {gapiReady&&gisReady?"Подключить Google":"Загрузка..."}
              </button>
            ):(
              <>
                <button className="btn btn-ghost btn-sm" onClick={fullSync} disabled={syncStatus==="syncing"} style={{color:syncStatus==="done"?"var(--green)":syncStatus==="error"?"var(--red)":undefined}} title={lastDriveSync?`Drive: ${new Date(lastDriveSync).toLocaleString("ru-RU")}`:"Drive ещё не синхронизирован"}>
                  <span className={syncStatus==="syncing"?"spin":""}>🔄</span>
                  {syncStatus==="syncing"?"Синхр...":syncStatus==="done"?`✓ ${syncCount}`:syncStatus==="error"?"Ошибка Drive":"Синхронизировать"}
                </button>
                <button className="btn btn-ghost btn-sm" onClick={()=>tokenClient&&tokenClient.requestAccessToken({prompt:"consent"})} title="Переавторизоваться" style={{padding:"7px 10px",fontSize:13}}>🔐</button>
              </>
            )}
            <button className="btn btn-teal btn-sm" onClick={()=>{setEditRental(null);setShowForm(true)}}>+ Аренда</button>
          </div>
        </div>

        <div style={{padding:"24px 28px",maxWidth:1600}}>
        {/* Clickable stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:12,marginBottom:20}}>
          <StatCard icon="🚗" label="Всего авто" value={cars.length} color="#0EA5E9" bg="#0EA5E918" onClick={()=>setQuickList(null)}/>
          <StatCard icon="🔑" label="В аренде" value={activeR.length} color="#10B981" bg="#10B98118" onClick={()=>setQuickList({title:"В аренде прямо сейчас",rentals:activeR,color:"#10B981"})}/>
          <StatCard icon="📅" label="Резерв" value={reservedR.length} color="#F59E0B" bg="#F59E0B18" onClick={()=>setQuickList({title:"Предстоящий резерв",rentals:reservedR,color:"#F59E0B"})}/>
          <StatCard icon="⚠️" label="Просрочено" value={overdueR.length} color="#EF4444" bg="#EF444418" onClick={()=>setQuickList({title:"Просроченные аренды",rentals:overdueR,color:"#EF4444"})}/>
          <StatCard icon="🅿️" label="Свободно" value={freeCount} color="#64748B" bg="#94A3B818" onClick={()=>setQuickList({title:"Свободные авто",rentals:[],color:"#64748B",isFree:true,cars:cars.filter(c=>!c.inRepair&&getCarStatus(c.id,rentals).status==="free")})}/>
          <StatCard icon="🔧" label="В ремонте" value={repairCars.length} color="#8B5CF6" bg="#8B5CF618" onClick={()=>setQuickList({title:"Авто в ремонте",rentals:[],color:"#8B5CF6",isFree:true,cars:repairCars})}/>
        </div>

        <div className="content-grid">
          <div style={{minWidth:0}}>
            {view==="timeline"&&<Timeline cars={cars} days={days} today={today} monthLabel={monthLabel} monthOffset={monthOffset} setMonthOffset={setMonthOffset} rentalForDay={rentalForDay} onRentalClick={setSelected}/>}

            {view==="finance"&&<Stats rentals={rentals} cars={cars}/>}

        {view==="cars"&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
            {cars.map(car=>{
              const carStatus=car.inRepair?{status:"repair",rental:null}:getCarStatus(car.id,rentals);
              const{status,rental}=carStatus;
              const sc=SC[status];
              const nextServ=parseInt(car.nextServiceMileage);
              let currentMileage=parseInt(car.lastServiceMileage)||0;
              for(const r of rentals.filter(r=>r.carId===car.id)){
                const mo=parseInt(r.mileageOut)||0,mi=parseInt(r.mileageIn)||0;
                if(mo>currentMileage)currentMileage=mo;
                if(mi>currentMileage)currentMileage=mi;
              }
              const toRemaining=nextServ?nextServ-currentMileage:null;
              const toAlert=toRemaining!=null&&toRemaining<=1500;
              return(
                <div key={car.id} className="card">
                  <div style={{padding:"13px 15px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:34,height:34,borderRadius:9,background:car.color+"20",border:`1px solid ${car.color}40`,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:10,height:10,borderRadius:"50%",background:car.color}}></div></div>
                      <div>
                        <div style={{fontSize:14,fontWeight:700}}>{car.brand} {car.model}</div>
                        <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginTop:1}}>{car.plate||"Нет номера"}{car.city?` · ${car.city}`:""}</div>
                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span className="tag" style={{background:sc.bg,color:sc.color}}><span style={{width:5,height:5,borderRadius:"50%",background:sc.dot,display:"inline-block"}}></span>{sc.label}</span>
                      <button className="btn btn-ghost btn-sm" style={{padding:"4px 8px"}} onClick={()=>{setEditCarId(car.id);setShowCarForm(true)}}>✏️</button>
                    </div>
                  </div>
                  {toAlert&&(
                    <div style={{padding:"9px 15px",borderBottom:"1px solid var(--border)",background:toRemaining<=0?"#EF444418":"#F59E0B18",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                      <div style={{fontSize:11,fontWeight:700,color:toRemaining<=0?"#EF4444":"#F59E0B",letterSpacing:".03em"}}>🔧 {toRemaining<=0?`ТО ПРОСРОЧЕНО +${Math.abs(toRemaining)} КМ`:`ТО ЧЕРЕЗ ${toRemaining} КМ`}</div>
                      <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{currentMileage} / {nextServ}</div>
                    </div>
                  )}
                  {/* Service info */}
                  {(car.lastServiceMileage||car.nextServiceMileage)&&(
                    <div style={{padding:"8px 15px",borderBottom:"1px solid var(--border)",display:"flex",gap:16,background:"var(--bg3)"}}>
                      {car.lastServiceMileage&&<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ПОСЛ. ТО</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{car.lastServiceMileage} км</div></div>}
                      {car.nextServiceMileage&&<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>СЛЕД. ТО</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--teal)"}}>{car.nextServiceMileage} км</div></div>}
                      {nextServ&&<div style={{marginLeft:"auto"}}><div style={{fontSize:9,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ТЕКУЩИЙ</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:toAlert?(toRemaining<=0?"#EF4444":"#F59E0B"):"var(--text2)"}}>{currentMileage} км</div></div>}
                    </div>
                  )}
                  {status==="repair"?(
                    <div style={{padding:"13px 15px",background:"#8B5CF608"}}>
                      <div style={{color:"#8B5CF6",fontSize:13,fontWeight:700,marginBottom:6,textAlign:"center"}}>🔧 В ремонте</div>
                      {car.repairNotes&&<div style={{color:"var(--text3)",fontSize:12,marginBottom:10,lineHeight:1.5,textAlign:"center"}}>{car.repairNotes}</div>}
                      <button className="btn btn-teal btn-sm" style={{width:"100%",justifyContent:"center"}} onClick={()=>setCars(cs=>cs.map(c=>c.id===car.id?{...c,inRepair:false,repairNotes:""}:c))}>✓ Вернуть в строй</button>
                    </div>
                  ):rental?(
                    <div style={{padding:"13px 15px",cursor:"pointer"}} onClick={()=>setSelected(rental)}>
                      <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>{rental.clientName}</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:6}}>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ТЕЛЕФОН</div><div style={{fontSize:12,color:"var(--teal)",fontWeight:500}}>{rental.phone||"—"}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ГОРОД</div><div style={{fontSize:12}}>{rental.city||"—"}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>НАЧАЛО</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{fmtRu(rental.startDate)}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>КОНЕЦ</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{fmtRu(rental.endDate)}</div></div>
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",paddingTop:8,borderTop:"1px solid var(--border)"}}>
                        {rental.price?<div style={{fontSize:13,fontWeight:700,color:"#10B981"}}>{rental.price} €</div>:<div/>}
                        <div style={{fontSize:11,fontWeight:600,color:sc.color}}>
                          {status==="reserved"?`Через ${daysUntil(rental.startDate)} дн.`:status==="overdue"?`Просрочено ${Math.abs(daysLeft(rental.endDate))} дн.`:daysLeft(rental.endDate)===0?"Сегодня возврат":`${daysLeft(rental.endDate)} дн.`}
                        </div>
                      </div>
                    </div>
                  ):(
                    <div style={{padding:"13px 15px"}}>
                      <div style={{color:"var(--text3)",fontSize:13,marginBottom:10,textAlign:"center"}}>Машина свободна</div>
                      <div style={{display:"flex",gap:6}}>
                        <button className="btn btn-teal btn-sm" style={{flex:1,justifyContent:"center"}} onClick={()=>{setEditRental(null);setPrefillCarId(car.id);setShowForm(true)}}>+ Аренда</button>
                        <button className="btn btn-ghost btn-sm" title="Отправить в ремонт" style={{justifyContent:"center",color:"#8B5CF6",borderColor:"#8B5CF640",padding:"7px 12px"}} onClick={()=>{if(confirm(`Отправить ${car.brand} ${car.model} в ремонт?`))setCars(cs=>cs.map(c=>c.id===car.id?{...c,inRepair:true}:c))}}>🔧</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {view==="clients"&&(
          <div>
            <div className="card" style={{marginBottom:14,overflow:"hidden"}}>
              <div style={{display:"flex",overflowX:"auto",padding:"0 8px",borderBottom:"1px solid var(--border)"}}>
                {clientTabs.map(t=>(
                  <button key={t.key} className={"tab-btn"+(clientsTab===t.key?" active":"")} onClick={()=>setClientsTab(t.key)} style={{color:clientsTab===t.key?t.color:"var(--text3)",borderBottomColor:clientsTab===t.key?t.color:"transparent"}}>
                    {t.label}<span style={{background:clientsTab===t.key?t.color+"25":"var(--bg3)",color:clientsTab===t.key?t.color:"var(--text3)",borderRadius:20,padding:"1px 7px",fontSize:10,marginLeft:4,fontWeight:700}}>{t.count}</span>
                  </button>
                ))}
              </div>
            </div>
            {tabRentals[clientsTab].length===0?(
              <div style={{textAlign:"center",padding:"60px",color:"var(--text3)",fontSize:14}}>
                {clientsTab==="done"?"Завершённые аренды появятся здесь":"Нет записей"}
              </div>
            ):(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:12}}>
                {tabRentals[clientsTab].map(rental=>{
                  const car=cars.find(c=>c.id===rental.carId);
                  const status=getRentalStatus(rental);
                  const sc=SC[rental.active?status:"done"];
                  return(
                    <div key={rental.id} className="card" style={{padding:15,cursor:"pointer"}} onClick={()=>setSelected(rental)}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                        <div>
                          <div style={{fontSize:15,fontWeight:700,marginBottom:3}}>{rental.clientName}</div>
                          {car&&<div style={{fontSize:12,color:"var(--text3)",display:"flex",alignItems:"center",gap:5}}><div style={{width:6,height:6,borderRadius:"50%",background:car.color}}></div>{car.brand} {car.model}</div>}
                        </div>
                        <span className="tag" style={{background:sc.bg,color:sc.color,flexShrink:0}}>{sc.label}</span>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ТЕЛЕФОН</div><div style={{fontSize:13,color:"var(--teal)",fontWeight:500}}>{rental.phone||"—"}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ГОРОД</div><div style={{fontSize:13}}>{rental.city||"—"}</div></div>
                      </div>
                      {rental.location&&<div style={{fontSize:12,color:"var(--text2)",marginBottom:8}}>📍 {rental.location}</div>}
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,borderTop:"1px solid var(--border)"}}>
                        <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{fmtRu(rental.startDate)} → {fmtRu(rental.endDate)}</div>
                        <div style={{display:"flex",gap:8,alignItems:"center"}}>
                          {rental.endedAt&&<div style={{fontSize:10,color:"var(--teal)"}}>завершена {fmtRu(rental.endedAt)}</div>}
                          {rental.price&&<div style={{fontSize:13,fontWeight:700,color:"#10B981"}}>{rental.price} €</div>}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
          </div>
          <aside style={{position:"sticky",top:84,maxHeight:"calc(100vh - 100px)",overflowY:"auto"}}>
            <WarningsStrip rentals={rentals} cars={cars} onSelect={setSelected}/>
          </aside>
        </div>
        </div>
      </main>

      {/* Quick list modal */}
      {quickList&&(
        <DragModal title={quickList.title} onClose={()=>setQuickList(null)} ix={window.innerWidth/2-240} iy={80} width={500}>
          {quickList.isFree?(
            <div>
              <div style={{fontSize:12,color:"var(--text3)",marginBottom:14}}>Автомобили без активных аренд</div>
              {(quickList.cars||[]).map(car=>(
                <div key={car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"var(--bg3)",borderRadius:8,marginBottom:6,border:"1px solid var(--border)"}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:car.color}}></div>
                  <div style={{fontWeight:600,fontSize:13}}>{car.brand} {car.model}</div>
                  {car.plate&&<div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginLeft:"auto"}}>{car.plate}</div>}
                  {car.city&&<div style={{fontSize:11,color:"var(--text3)"}}>{car.city}</div>}
                </div>
              ))}
              {(quickList.cars||[]).length===0&&<div style={{textAlign:"center",padding:"30px",color:"var(--text3)"}}>Все машины заняты</div>}
            </div>
          ):(
            <QuickList title={quickList.title} rentals={quickList.rentals} cars={cars} color={quickList.color} onClose={()=>setQuickList(null)} onSelect={setSelected}/>
          )}
        </DragModal>
      )}

      {showAvail&&<DragModal title="🔍 Проверить доступность" onClose={()=>setShowAvail(false)} ix={window.innerWidth/2-240} iy={100}><AvailabilityChecker cars={cars} rentals={rentals}/></DragModal>}

      {showGuide&&<DragModal title="📋 Формат Google Calendar" onClose={()=>setShowGuide(false)} ix={window.innerWidth/2-240} iy={80}>
        <div style={{background:"#EFF6FF",borderRadius:10,padding:"14px",marginBottom:14,border:"1px solid #BFDBFE"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#0284C7",marginBottom:8}}>НАЗВАНИЕ СОБЫТИЯ</div>

        </div>

        <ClientHistory phone={clientHistoryPhone} rentals={rentals} cars={cars} onSelect={r=>{setClientHistoryPhone(null);setSelected(r)}}/>
      </DragModal>}

      {showForm&&<DragModal title={editRental?"Редактировать аренду":"Новая аренда"} onClose={()=>{setShowForm(false);setEditRental(null);setPrefillCarId(null)}} ix={window.innerWidth/2-240} iy={60}>
        <RentalForm cars={cars} rentals={rentals} initial={editRental||(prefillCarId?{carId:prefillCarId}:{})} onSave={saveRental} onCancel={()=>{setShowForm(false);setEditRental(null);setPrefillCarId(null)}}/>
      </DragModal>}

      {showCarForm&&<DragModal title={editCarId?"Редактировать авто":"Добавить авто"} onClose={()=>{setShowCarForm(false);setEditCarId(null)}} ix={window.innerWidth/2-240} iy={100} width={460}>
        <CarForm initial={editCarId?cars.find(c=>c.id===editCarId):null} onSave={saveCar} onCancel={()=>{setShowCarForm(false);setEditCarId(null)}} onDelete={editCarId?()=>{const act=rentals.filter(r=>r.carId===editCarId&&r.active);const msg=act.length?`У этой машины ${act.length} активных аренд. Удалить машину всё равно?\n\nАренды останутся в списке, но без привязки к авто.`:"Удалить этот автомобиль?";if(confirm(msg))deleteCar(editCarId)}:null}/>

    </div>
  );
}

function Timeline({cars,days,today,monthLabel,monthOffset,setMonthOffset,rentalForDay,onRentalClick}){
  const CW=32,RH=40,LW=192;
  function getBlocks(carId){
    const blocks=[];let i=0;
    while(i<days.length){const r=rentalForDay(carId,days[i]);if(r){let j=i;while(j<days.length&&rentalForDay(carId,days[j])?.id===r.id)j++;blocks.push({rental:r,startIdx:i,dayCount:j-i});i=j}else i++}
    return blocks;
  }
  return(
    <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden"}}>
      <div style={{padding:"11px 16px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg3)"}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o-1)}>← Пред.</button>
        <div style={{fontSize:14,fontWeight:700,textTransform:"capitalize"}}>{monthLabel}</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o+1)}>След. →</button>
      </div>
      <div style={{padding:"7px 16px",borderBottom:"1px solid var(--border)",display:"flex",gap:20,background:"var(--bg3)"}}>
        {[{c:"#10B981",l:"В аренде"},{c:"#F59E0B",l:"Резерв"},{c:"#EF4444",l:"Просрочено"}].map(x=>(
          <div key={x.l} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text3)"}}>
            <div style={{width:20,height:5,background:x.c,borderRadius:3,opacity:.8}}></div>{x.l}
          </div>
        ))}
      </div>
      <div style={{overflowX:"auto"}}>
        <div style={{minWidth:LW+days.length*CW}}>
          <div style={{display:"flex",borderBottom:"1px solid var(--border)",background:"var(--bg3)",position:"sticky",top:0,zIndex:10}}>
            <div style={{width:LW,minWidth:LW,padding:"7px 14px",fontSize:11,fontWeight:700,color:"var(--text3)",letterSpacing:".05em"}}>АВТОМОБИЛЬ</div>
            {days.map(day=>{
              const iT=sameDay(day,today),iW=day.getDay()===0||day.getDay()===6;
              return <div key={day.toISOString()} style={{width:CW,minWidth:CW,textAlign:"center",padding:"4px 0",fontSize:10,fontFamily:"'JetBrains Mono'",color:iT?"var(--teal)":iW?"#CBD5E1":"var(--text2)",background:iT?"var(--teal-dim2)":"transparent",fontWeight:iT?800:400,borderLeft:"1px solid var(--border)"}}>
                <div style={{fontSize:8,marginBottom:1}}>{["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][day.getDay()]}</div>
                <div style={{width:iT?17:undefined,height:iT?17:undefined,background:iT?"var(--teal)":undefined,color:iT?"#000":undefined,borderRadius:iT?"50%":undefined,display:iT?"inline-flex":undefined,alignItems:iT?"center":undefined,justifyContent:iT?"center":undefined,fontSize:10,fontWeight:800,lineHeight:iT?"17px":undefined}}>{day.getDate()}</div>
              </div>;
            })}
          </div>
          {cars.map((car,ci)=>{
            const blocks=getBlocks(car.id);
            return(
              <div key={car.id} style={{display:"flex",borderBottom:"1px solid var(--border)",background:ci%2?"var(--bg3)":"var(--bg2)",position:"relative",height:RH}}>
                <div style={{width:LW,minWidth:LW,padding:"0 14px",display:"flex",alignItems:"center",gap:8,borderRight:"1px solid var(--border)",position:"sticky",left:0,background:ci%2?"var(--bg3)":"var(--bg2)",zIndex:5}}>
                  <div style={{width:7,height:7,borderRadius:"50%",background:car.color,flexShrink:0,boxShadow:`0 0 5px ${car.color}50`}}></div>
                  <div style={{overflow:"hidden"}}>
                    <div style={{fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{car.brand} {car.model}</div>
                    {car.plate&&<div style={{fontSize:9,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{car.plate}</div>}
                  </div>
                </div>
                <div style={{display:"flex",flex:1,position:"relative"}}>
                  {days.map(day=>{const iT=sameDay(day,today);return <div key={day.toISOString()} style={{width:CW,minWidth:CW,height:RH,background:iT?"var(--teal-dim2)":"transparent",borderLeft:iT?"1px solid var(--teal)20":"1px solid transparent",flexShrink:0}}/>})}
                  {blocks.map(({rental:r,startIdx,dayCount})=>{
                    const status=getRentalStatus(r);
                    const col=status==="overdue"?"#EF4444":status==="reserved"?"#F59E0B":car.color;
                    const dl=status==="reserved"?daysUntil(r.startDate):daysLeft(r.endDate);
                    return(
                      <div key={r.id} className="tl-bar" onClick={()=>onRentalClick(r)}
                        style={{left:startIdx*CW+2,top:5,width:dayCount*CW-4,height:RH-10,background:`linear-gradient(135deg,${col}D0,${col}90)`,boxShadow:`0 2px 8px ${col}35,inset 0 1px 0 rgba(255,255,255,.08)`,border:`1px solid ${col}35`}}
                        title={`${r.clientName} · ${fmtRu(r.startDate)}–${fmtRu(r.endDate)}`}>
                        {dayCount*CW>44&&<div style={{display:"flex",alignItems:"center",gap:5,minWidth:0,position:"relative",zIndex:1}}>
                          <div style={{width:20,height:20,borderRadius:"50%",background:"rgba(0,0,0,.35)",border:"1px solid rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,flexShrink:0,fontWeight:800,color:"#fff"}}>{r.clientName.charAt(0).toUpperCase()}</div>
                          <div style={{overflow:"hidden",minWidth:0}}>
                            <div style={{fontSize:10,fontWeight:700,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",lineHeight:1.3,textShadow:"0 1px 3px rgba(0,0,0,.6)"}}>{r.clientName.split(" ")[0]}</div>
                            {dayCount*CW>88&&<div style={{fontSize:9,color:"rgba(255,255,255,.7)",fontFamily:"'JetBrains Mono'",lineHeight:1}}>{status==="reserved"?`↑${dl}д`:status==="overdue"?`!${Math.abs(dl)}д`:`${dl}д`}</div>}
                          </div>
                        </div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

        <div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ГОРОД</div>

        <div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>МЕСТО ПОДАЧИ</div>
