        <div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ЦЕНА</div>

            {!rental.active&&rental.depositReturned===false&&<span style={{fontSize:11,color:"#EF4444",fontWeight:700}}>✗ не возвращён</span>}

      {rental.mileageOut&&rental.mileageIn&&<div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ЗА АРЕНДУ</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'",color:"var(--teal)"}}>{rental.mileageIn-rental.mileageOut} км</div></div>}
    </div></div>}
    {rental.documents&&<div className="section"><div className="section-row"><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ДОКУМЕНТЫ</div><div style={{fontSize:13}}>{rental.documents}</div></div></div>}

    </div>
    {rental.active&&onTransfer&&<button className="btn btn-ghost" style={{width:"100%",justifyContent:"center",marginTop:8,color:"#8B5CF6",borderColor:"#8B5CF640"}} onClick={onTransfer}>🔄 Переподача — поменять авто</button>}
    {onDelete&&<button className="btn btn-ghost" style={{width:"100%",justifyContent:"center",marginTop:8,color:"#EF4444",borderColor:"#EF444440"}} onClick={onDelete}>🗑 Удалить запись полностью</button>}
  </>;
}

function RentalForm({cars,rentals,initial,onSave,onCancel}){
  const[f,setF]=useState({carId:"",clientName:"",phone:"",city:"",location:"",startDate:fmtDate(new Date()),endDate:"",price:"",deposit:"",depositReturned:false,documents:"",notes:"",mileageOut:"",mileageIn:"",...initial,carId:initial.carId?String(initial.carId):""});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const selectedCar=cars.find(c=>c.id===Number(f.carId));
  const carInRepair=selectedCar?.inRepair;
  const conflicts=(()=>{
    if(!f.carId||!f.startDate||!f.endDate||!rentals)return[];
    const cid=Number(f.carId);
    const start=parseDate(f.startDate);start.setHours(0,0,0,0);
    const end=parseDate(f.endDate);end.setHours(0,0,0,0);
    if(end<start)return[];
    return rentals.filter(r=>{
      if(!r.active||r.carId!==cid)return false;
      if(initial.id&&r.id===initial.id)return false;
      const rs=parseDate(r.startDate);rs.setHours(0,0,0,0);
      const re=parseDate(r.endDate);re.setHours(0,0,0,0);
      return rs<=end&&re>=start;
    });
  })();
  function submit(){
    if(!f.carId||!f.clientName||!f.endDate)return alert("Заполните: авто, имя, дата окончания");
    if(carInRepair){
      if(!confirm(`⚠️ Авто «${selectedCar.brand} ${selectedCar.model}» помечено как В РЕМОНТЕ${selectedCar.repairNotes?` (${selectedCar.repairNotes})`:""}.\n\nВсё равно создать аренду?`))return;
    }
    if(conflicts.length){
      const list=conflicts.map(c=>`• ${c.clientName} (${fmtRu(c.startDate)} → ${fmtRu(c.endDate)})`).join("\n");
      if(!confirm(`⚠️ Конфликт с ${conflicts.length===1?"арендой":"арендами"}:\n\n${list}\n\nВсё равно сохранить?`))return;
    }
    onSave({...f,carId:Number(f.carId)});
  }
  return <div style={{display:"flex",flexDirection:"column",gap:13}}>
    <div><label className="label">Автомобиль *</label><select className="input" value={f.carId} onChange={e=>s("carId",e.target.value)} style={{background:"var(--bg)"}}><option value="">Выберите...</option>{cars.map(c=><option key={c.id} value={c.id}>{c.inRepair?"🔧 ":""}{c.brand} {c.model}{c.plate?" · "+c.plate:""}{c.inRepair?" — в ремонте":""}</option>)}</select></div>
    {carInRepair&&(
      <div style={{background:"#8B5CF615",border:"1px solid #8B5CF640",borderRadius:8,padding:"10px 13px"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#8B5CF6",marginBottom:4,letterSpacing:".05em"}}>🔧 АВТО В РЕМОНТЕ</div>
        <div style={{fontSize:12,color:"var(--text2)",lineHeight:1.5}}>{selectedCar.brand} {selectedCar.model} сейчас помечен как недоступный для аренды{selectedCar.repairNotes?`: «${selectedCar.repairNotes}»`:""}. Сначала верни его в строй в карточке авто, либо подтверди создание аренды при сохранении.</div>
      </div>
    )}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Имя *</label><input className="input" value={f.clientName} onChange={e=>s("clientName",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Телефон</label><input className="input" value={f.phone} onChange={e=>s("phone",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Город</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Место подачи</label><input className="input" value={f.location} onChange={e=>s("location",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
      <div><label className="label">Начало</label><input className="input" type="date" value={f.startDate} onChange={e=>s("startDate",e.target.value)}/></div>
      <div><label className="label">Конец *</label><input className="input" type="date" value={f.endDate} onChange={e=>s("endDate",e.target.value)}/></div>
      <div><label className="label">Цена €</label><input className="input" type="number" value={f.price} onChange={e=>s("price",e.target.value)} placeholder="—"/></div>
    </div>
    {conflicts.length>0&&(
      <div style={{background:"#EF444415",border:"1px solid #EF444440",borderRadius:8,padding:"10px 13px"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#EF4444",marginBottom:5,letterSpacing:".05em"}}>⚠️ КОНФЛИКТ РАСПИСАНИЯ ({conflicts.length})</div>
        {conflicts.map(c=>(
          <div key={c.id} style={{fontSize:12,color:"var(--text2)",lineHeight:1.6}}>· <b style={{color:"var(--text)"}}>{c.clientName}</b> <span style={{fontFamily:"'JetBrains Mono'",color:"var(--text3)"}}>{fmtRu(c.startDate)} → {fmtRu(c.endDate)}</span></div>
        ))}
      </div>
    )}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
      <div><label className="label">Пробег выдача, км</label><input className="input" type="number" value={f.mileageOut} onChange={e=>s("mileageOut",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Пробег возврат, км</label><input className="input" type="number" value={f.mileageIn} onChange={e=>s("mileageIn",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Депозит €</label><input className="input" type="number" value={f.deposit} onChange={e=>s("deposit",e.target.value)} placeholder="—"/></div>
    </div>
    <div><label className="label">Документы</label><input className="input" value={f.documents} onChange={e=>s("documents",e.target.value)} placeholder="—"/></div>
    <div><label className="label">Примечания</label><textarea className="input" rows={2} value={f.notes} onChange={e=>s("notes",e.target.value)} style={{resize:"vertical"}} placeholder="—"/></div>
    <div style={{display:"flex",gap:8}}>
      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-teal" style={{flex:2,justifyContent:"center"}} onClick={submit}>Сохранить</button>
    </div>
  </div>;
}

function CarForm({initial,onSave,onCancel,onDelete}){
  const[f,setF]=useState({brand:"",model:"",plate:"",city:"",lastServiceMileage:"",nextServiceMileage:"",inRepair:false,repairNotes:"",...(initial||{})});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function submit(){if(!f.brand||!f.model)return alert("Укажите марку и модель");onSave(f)}
  return <div style={{display:"flex",flexDirection:"column",gap:13}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Марка *</label><input className="input" value={f.brand} onChange={e=>s("brand",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Модель *</label><input className="input" value={f.model} onChange={e=>s("model",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Гос. номер</label><input className="input" value={f.plate} onChange={e=>s("plate",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Город базирования</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{height:1,background:"var(--border)",margin:"4px 0"}}/>
    <div style={{fontSize:11,fontWeight:700,color:"var(--text3)",letterSpacing:".05em",marginBottom:-4}}>ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Пробег последнего ТО, км</label><input className="input" type="number" value={f.lastServiceMileage} onChange={e=>s("lastServiceMileage",e.target.value)} placeholder="—"/></div>
      <div><label className="label">Пробег следующего ТО, км</label><input className="input" type="number" value={f.nextServiceMileage} onChange={e=>s("nextServiceMileage",e.target.value)} placeholder="—"/></div>
    </div>
    <div style={{height:1,background:"var(--border)",margin:"4px 0"}}/>
    <label style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",background:f.inRepair?"#8B5CF615":"var(--bg3)",borderRadius:8,cursor:"pointer",border:`1px solid ${f.inRepair?"#8B5CF640":"var(--border)"}`}}>
      <input type="checkbox" checked={!!f.inRepair} onChange={e=>s("inRepair",e.target.checked)} style={{width:16,height:16,accentColor:"#8B5CF6"}}/>
      <span style={{fontSize:13,fontWeight:600,color:f.inRepair?"#8B5CF6":"var(--text)"}}>🔧 Машина в ремонте (не доступна для аренды)</span>
    </label>
    {f.inRepair&&<div><label className="label">Причина / детали ремонта</label><textarea className="input" rows={2} value={f.repairNotes} onChange={e=>s("repairNotes",e.target.value)} style={{resize:"vertical"}} placeholder="—"/></div>}
    {f.model&&!initial&&<div style={{background:"#FFFBEB",borderRadius:8,padding:"9px 12px",fontSize:12,color:"#B45309",border:"1px solid #FCD34D"}}>В Google Calendar пиши <b>«{f.model}»</b> в названии события.</div>}
    <div style={{display:"flex",gap:8}}>
      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-teal" style={{flex:2,justifyContent:"center"}} onClick={submit}>{initial?"Сохранить изменения":"Добавить авто"}</button>
    </div>
    {initial&&onDelete&&<button className="btn btn-ghost" style={{width:"100%",justifyContent:"center",marginTop:4,color:"#EF4444",borderColor:"#EF444440"}} onClick={onDelete}>🗑 Удалить автомобиль</button>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
