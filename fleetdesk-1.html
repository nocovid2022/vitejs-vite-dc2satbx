<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetDesk — Auto in Spain</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080B14;color:#CBD5E1;font-family:'DM Sans',sans-serif;min-height:100vh}
::-webkit-scrollbar{height:4px;width:4px}::-webkit-scrollbar-track{background:#080B14}::-webkit-scrollbar-thumb{background:#1E293B;border-radius:2px}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:8px;transition:all .15s;font-size:13px}
.btn-primary{background:#6366F1;color:#fff;padding:9px 18px}.btn-primary:hover{background:#4F46E5;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#64748B;padding:8px 14px;border:1px solid #1E293B}.btn-ghost:hover{border-color:#334155;color:#CBD5E1}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:#EF444415;color:#EF4444;border:1px solid #EF444425;padding:8px 14px}.btn-danger:hover{background:#EF444425}
.btn-google{background:#fff;color:#1F2937;padding:9px 18px;display:inline-flex;align-items:center;gap:8px;border:1px solid #E5E7EB;cursor:pointer;font-family:inherit;font-weight:600;border-radius:8px;font-size:13px;transition:all .15s}.btn-google:hover{background:#F9FAFB;transform:translateY(-1px)}
.input{background:#0F172A;border:1px solid #1E293B;border-radius:8px;padding:9px 13px;color:#CBD5E1;font-size:13px;width:100%;outline:none;transition:border .15s;font-family:inherit}.input:focus{border-color:#6366F1}
.modal-overlay{position:fixed;inset:0;background:#00000090;backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#0F172A;border:1px solid #1E293B;border-radius:16px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;padding:24px}
.card{background:#0F172A;border:1px solid #1E293B;border-radius:12px;transition:all .2s}.card:hover{border-color:#334155}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.view-tab{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#475569;padding:8px 16px;border-radius:8px;transition:all .15s}.view-tab.active{background:#1E293B;color:#CBD5E1}
.tl-cell{transition:filter .1s}.tl-cell.clickable{cursor:pointer}.tl-cell.clickable:hover{filter:brightness(1.2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.fade-up{animation:fadeUp .2s ease}
@keyframes spin{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:spin 1s linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect}=React;
const CLIENT_ID="546196176766-060ji046vk8r8kem36ko66dr6d4gme9n.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/calendar";
const STORAGE_KEY="fleet_ais_v2";
const CARS_KEY="fleet_ais_cars_v2";
const CAR_COLORS=["#6366F1","#10B981","#F59E0B","#EF4444","#8B5CF6","#06B6D4","#F97316","#EC4899","#14B8A6","#84CC16","#F43F5E","#A855F7"];

const DEFAULT_CARS=[
  {id:1,brand:"Volkswagen",model:"Polo",plate:"",color:CAR_COLORS[0]},
  {id:2,brand:"Volkswagen",model:"Golf",plate:"",color:CAR_COLORS[1]},
  {id:3,brand:"Lexus",model:"CT200h",plate:"",color:CAR_COLORS[2]},
  {id:4,brand:"Toyota",model:"Yaris Hybrid",plate:"",color:CAR_COLORS[3]},
  {id:5,brand:"Skoda",model:"Scala",plate:"",color:CAR_COLORS[4]},
  {id:6,brand:"Hyundai",model:"Ionic",plate:"",color:CAR_COLORS[5]},
  {id:7,brand:"Skoda",model:"Superb",plate:"",color:CAR_COLORS[6]},
  {id:8,brand:"Volkswagen",model:"Passat",plate:"",color:CAR_COLORS[7]},
  {id:9,brand:"Fiat",model:"500e Alicante",plate:"",color:CAR_COLORS[8]},
  {id:10,brand:"Fiat",model:"500e Valencia",plate:"",color:CAR_COLORS[9]},
  {id:11,brand:"BMW",model:"218d Gran Tourer",plate:"",color:CAR_COLORS[10]},
  {id:12,brand:"Toyota",model:"Yaris",plate:"",color:CAR_COLORS[11]},
];

const CAR_KEYWORDS=[
  {id:1,kw:["polo","vw polo","volkswagen polo"]},
  {id:2,kw:["golf","vw golf","volkswagen golf"]},
  {id:3,kw:["lexus","ct200","ct 200"]},
  {id:4,kw:["yaris hybrid","yaris гибрид","yaris hybr"]},
  {id:5,kw:["scala","skoda scala"]},
  {id:6,kw:["ionic","hyundai ionic","ioniq"]},
  {id:7,kw:["superb","skoda superb"]},
  {id:8,kw:["passat","vw passat","volkswagen passat"]},
  {id:9,kw:["500e alicante","fiat 500 alicante","500 alicante"]},
  {id:10,kw:["500e","fiat 500","fiat500"]},
  {id:11,kw:["218","bmw 218","gran tourer","bmw gran","218d"]},
  {id:12,kw:["yaris"]},
];

function findCarId(text){
  const t=text.toLowerCase();
  for(const ck of CAR_KEYWORDS){
    if(ck.kw.some(k=>t.includes(k)))return ck.id;
  }
  return null;
}

function parseEvent(ev){
  const title=ev.summary||"";
  const desc=ev.description||"";
  const phoneMatch=title.match(/\+[\d\s\-()]{9,16}/);
  const phone=phoneMatch?phoneMatch[0].trim():"";
  let rest=title.replace(/\+[\d\s\-()]{9,16}/,"").trim();
  rest=rest.replace(/оплата.*/i,"").replace(/аванс.*/i,"").replace(/залог.*/i,"").trim();
  const carId=findCarId(rest)||findCarId(title);
  // Убираем название машины из остатка
  let remainder=rest;
  if(carId){
    const ck=CAR_KEYWORDS.find(x=>x.id===carId);
    if(ck){for(const k of ck.kw){remainder=remainder.replace(new RegExp(k,"gi"),"").trim()}}
  }
  const parts=remainder.split(/\s+/).filter(Boolean);
  const city=parts[0]||"";
  const clientName=parts.slice(1).join(" ")||city||title;
  return{
    id:ev.id,googleEventId:ev.id,carId,
    clientName:clientName||city,phone,city,
    location:"",price:"",documents:"",notes:desc,
    startDate:ev.start?.date||(ev.start?.dateTime?ev.start.dateTime.split("T")[0]:""),
    endDate:ev.end?.date||(ev.end?.dateTime?ev.end.dateTime.split("T")[0]:""),
    active:true,fromGoogle:true,
  };
}

function toGoogleEvent(r,cars){
  const car=cars.find(c=>c.id===r.carId);
  const label=car?`${car.brand} ${car.model}`:"Авто";
  const title=`${r.city?r.city+" ":""}${r.clientName} ${label}${r.phone?" "+r.phone:""}`.trim();
  const desc=[r.price&&`Цена: ${r.price}`,r.documents&&`Документы: ${r.documents}`,r.notes].filter(Boolean).join("\n");
  return{summary:title,description:desc,start:{date:r.startDate},end:{date:r.endDate}};
}

function fmtDate(d){return d.toISOString().split("T")[0]}
function parseDate(s){if(!s)return new Date();const[y,m,d]=s.split("-");return new Date(y,m-1,d)}
function daysLeft(e){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(e)-n)/86400000)}
function fmtRu(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function App(){
  const[cars,setCars]=useState(()=>{try{return JSON.parse(localStorage.getItem(CARS_KEY))||DEFAULT_CARS}catch{return DEFAULT_CARS}});
  const[rentals,setRentals]=useState(()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch{return[]}});
  const[view,setView]=useState("timeline");
  const[monthOffset,setMonthOffset]=useState(0);
  const[showForm,setShowForm]=useState(false);
  const[showCarForm,setShowCarForm]=useState(false);
  const[editRental,setEditRental]=useState(null);
  const[selected,setSelected]=useState(null);
  const[gapiReady,setGapiReady]=useState(false);
  const[gisReady,setGisReady]=useState(false);
  const[signedIn,setSignedIn]=useState(false);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[tokenClient,setTokenClient]=useState(null);
  const[syncCount,setSyncCount]=useState(0);

  useEffect(()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(rentals))},[rentals]);
  useEffect(()=>{localStorage.setItem(CARS_KEY,JSON.stringify(cars))},[cars]);

  useEffect(()=>{
    const s1=document.createElement("script");
    s1.src="https://apis.google.com/js/api.js";
    s1.onload=()=>{window.gapi.load("client",async()=>{await window.gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"]});setGapiReady(true)})};
    document.head.appendChild(s1);
    const s2=document.createElement("script");
    s2.src="https://accounts.google.com/gsi/client";
    s2.onload=()=>{const tc=window.google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:(r)=>{if(!r.error){setSignedIn(true);doSync()}}});setTokenClient(tc);setGisReady(true)};
    document.head.appendChild(s2);
  },[]);

  async function doSync(){
    setSyncStatus("syncing");
    try{
      const now=new Date();
      const r=await window.gapi.client.calendar.events.list({
        calendarId:"primary",
        timeMin:new Date(now.getFullYear(),now.getMonth()-3,1).toISOString(),
        timeMax:new Date(now.getFullYear(),now.getMonth()+5,1).toISOString(),
        singleEvents:true,orderBy:"startTime",maxResults:500
      });
      const evs=(r.result.items||[])
        .filter(e=>e.summary&&e.summary.trim().length>1)
        .map(e=>parseEvent(e))
        .filter(x=>x.carId&&x.startDate&&x.endDate);
      setRentals(prev=>[...prev.filter(x=>!x.fromGoogle),...evs]);
      setSyncCount(evs.length);
      setSyncStatus("done");
      setTimeout(()=>setSyncStatus("idle"),4000);
    }catch(e){console.error(e);setSyncStatus("error")}
  }

  async function createCalEvent(r){if(!signedIn)return null;try{const res=await window.gapi.client.calendar.events.insert({calendarId:"primary",resource:toGoogleEvent(r,cars)});return res.result.id}catch{return null}}
  async function updateCalEvent(r){if(!signedIn||!r.googleEventId)return;try{await window.gapi.client.calendar.events.update({calendarId:"primary",eventId:r.googleEventId,resource:toGoogleEvent(r,cars)})}catch{}}
  async function deleteCalEvent(id){if(!signedIn||!id)return;try{await window.gapi.client.calendar.events.delete({calendarId:"primary",eventId:id})}catch{}}

  async function saveRental(data){
    if(editRental){const u={...editRental,...data};await updateCalEvent(u);setRentals(r=>r.map(x=>x.id===editRental.id?u:x))}
    else{const n={...data,id:Date.now(),active:true};const gid=await createCalEvent(n);if(gid)n.googleEventId=gid;setRentals(r=>[...r,n])}
    setShowForm(false);setEditRental(null);
  }
  async function endRental(id){const r=rentals.find(x=>x.id===id);if(r?.googleEventId)await deleteCalEvent(r.googleEventId);setRentals(r=>r.map(x=>x.id===id?{...x,active:false}:x));setSelected(null)}
  function addCar(data){setCars(c=>[...c,{...data,id:Date.now(),color:CAR_COLORS[c.length%CAR_COLORS.length]}]);setShowCarForm(false)}

  const today=new Date();today.setHours(0,0,0,0);
  const vm=new Date(today.getFullYear(),today.getMonth()+monthOffset,1);
  const days=Array.from({length:new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate()},(_,i)=>new Date(vm.getFullYear(),vm.getMonth(),i+1));
  const monthLabel=vm.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});

  function activeRentals(cid){return rentals.filter(r=>r.carId===cid&&r.active)}
  function rentalForDay(cid,day){return rentals.find(r=>{if(!r.active||r.carId!==cid)return false;const s=parseDate(r.startDate);s.setHours(0,0,0,0);const e=parseDate(r.endDate);e.setHours(0,0,0,0);return day>=s&&day<=e})}

  const stats={total:cars.length,active:cars.filter(c=>activeRentals(c.id).length>0).length,free:cars.filter(c=>activeRentals(c.id).length===0).length,overdue:rentals.filter(r=>r.active&&daysLeft(r.endDate)<0).length};

  return(
    <div style={{minHeight:"100vh"}}>
      <div style={{borderBottom:"1px solid #1E293B",padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:"#080B14",zIndex:100,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,background:"linear-gradient(135deg,#6366F1,#8B5CF6)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🚗</div>
          <div>
            <div style={{fontSize:15,fontWeight:700,color:"#F1F5F9"}}>Auto in Spain</div>
            <div style={{fontSize:11,color:"#475569",fontFamily:"'DM Mono'"}}>{stats.active} в аренде · {stats.free} свободно</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          {!signedIn?(
            <button className="btn-google btn-sm" onClick={()=>gapiReady&&gisReady&&tokenClient.requestAccessToken({prompt:""})}>
              <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              {gapiReady&&gisReady?"Войти через Google":"Загрузка..."}
            </button>
          ):(
            <button className="btn btn-ghost btn-sm" onClick={doSync} disabled={syncStatus==="syncing"}>
              <span className={syncStatus==="syncing"?"spin":""}>🔄</span>
              {syncStatus==="syncing"?" Синхронизация...":syncStatus==="done"?` Загружено ${syncCount} аренд ✓`:syncStatus==="error"?" Ошибка":" Синхронизировать"}
            </button>
          )}
          <div style={{background:"#0F172A",border:"1px solid #1E293B",borderRadius:8,padding:"2px",display:"flex"}}>
            <button className={"view-tab"+(view==="timeline"?" active":"")} onClick={()=>setView("timeline")}>📅 Таймлайн</button>
            <button className={"view-tab"+(view==="cards"?" active":"")} onClick={()=>setView("cards")}>⊞ Карточки</button>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowCarForm(true)}>+ Авто</button>
          <button className="btn btn-primary btn-sm" onClick={()=>{setEditRental(null);setShowForm(true)}}>+ Аренда</button>
        </div>
      </div>

      <div style={{padding:"20px",maxWidth:1600,margin:"0 auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>
          {[{l:"Всего авто",v:stats.total,c:"#6366F1",i:"🚗"},{l:"В аренде",v:stats.active,c:"#10B981",i:"🔑"},{l:"Свободно",v:stats.free,c:"#475569",i:"🅿️"},{l:"Просрочено",v:stats.overdue,c:"#EF4444",i:"⚠️"}].map(s=>(
            <div key={s.l} className="card" style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{fontSize:20}}>{s.i}</div>
              <div><div style={{fontSize:24,fontWeight:700,color:s.c,fontFamily:"'DM Mono'",lineHeight:1}}>{s.v}</div><div style={{fontSize:11,color:"#475569",marginTop:2}}>{s.l}</div></div>
            </div>
          ))}
        </div>
        {view==="timeline"?(<Timeline cars={cars} days={days} today={today} monthLabel={monthLabel} monthOffset={monthOffset} setMonthOffset={setMonthOffset} rentalForDay={rentalForDay} onRentalClick={setSelected}/>):(<Cards cars={cars} activeRentals={activeRentals} onRentalClick={setSelected}/>)}
      </div>

      {selected&&(<div className="modal-overlay" onClick={()=>setSelected(null)}><div className="modal fade-up" onClick={e=>e.stopPropagation()}><Detail rental={selected} cars={cars} onEdit={()=>{setEditRental(selected);setSelected(null);setShowForm(true)}} onEnd={()=>endRental(selected.id)} onClose={()=>setSelected(null)}/></div></div>)}
      {showForm&&(<div className="modal-overlay" onClick={()=>{setShowForm(false);setEditRental(null)}}><div className="modal fade-up" onClick={e=>e.stopPropagation()}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><div style={{fontSize:17,fontWeight:700,color:"#F1F5F9"}}>{editRental?"Редактировать":"Новая аренда"}</div><button className="btn btn-ghost btn-sm" onClick={()=>{setShowForm(false);setEditRental(null)}}>✕</button></div><RentalForm cars={cars} initial={editRental||{}} onSave={saveRental} onCancel={()=>{setShowForm(false);setEditRental(null)}}/></div></div>)}
      {showCarForm&&(<div className="modal-overlay" onClick={()=>setShowCarForm(false)}><div className="modal fade-up" style={{maxWidth:380}} onClick={e=>e.stopPropagation()}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><div style={{fontSize:17,fontWeight:700,color:"#F1F5F9"}}>Добавить авто</div><button className="btn btn-ghost btn-sm" onClick={()=>setShowCarForm(false)}>✕</button></div><CarForm onSave={addCar} onCancel={()=>setShowCarForm(false)}/></div></div>)}
    </div>
  );
}

function Timeline({cars,days,today,monthLabel,monthOffset,setMonthOffset,rentalForDay,onRentalClick}){
  const CW=32,RH=44;
  function cellStyle(r,day,car){
    if(!r)return{};
    const s=parseDate(r.startDate);s.setHours(0,0,0,0);
    const e=parseDate(r.endDate);e.setHours(0,0,0,0);
    const iS=sameDay(day,s),iE=sameDay(day,e);
    const col=daysLeft(r.endDate)<0?"#EF4444":car.color;
    return{background:col+"28",borderTop:`2px solid ${col}`,borderBottom:`2px solid ${col}`,borderLeft:iS?`2px solid ${col}`:"none",borderRight:iE?`2px solid ${col}`:"none",borderRadius:iS&&iE?"6px":iS?"6px 0 0 6px":iE?"0 6px 6px 0":"0"};
  }
  return(
    <div className="card" style={{overflow:"hidden"}}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid #1E293B",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o-1)}>← Пред.</button>
        <div style={{fontSize:14,fontWeight:600,color:"#F1F5F9",textTransform:"capitalize"}}>{monthLabel}</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o+1)}>След. →</button>
      </div>
      <div style={{overflowX:"auto"}}>
        <div style={{minWidth:200+days.length*CW}}>
          <div style={{display:"flex",borderBottom:"1px solid #1E293B",position:"sticky",top:0,background:"#0F172A",zIndex:10}}>
            <div style={{width:200,minWidth:200,padding:"8px 14px",fontSize:11,color:"#475569",fontWeight:600,letterSpacing:".05em"}}>АВТОМОБИЛЬ</div>
            {days.map(day=>{const iT=sameDay(day,today),iW=day.getDay()===0||day.getDay()===6;return <div key={day.toISOString()} style={{width:CW,minWidth:CW,textAlign:"center",padding:"6px 0",fontSize:11,fontFamily:"'DM Mono'",color:iT?"#818CF8":iW?"#334155":"#475569",background:iT?"#6366F115":"transparent",fontWeight:iT?700:400,borderLeft:"1px solid #1E293B15"}}><div style={{fontSize:9,marginBottom:1}}>{["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][day.getDay()]}</div><div>{day.getDate()}</div></div>})}
          </div>
          {cars.map((car,ci)=>(
            <div key={car.id} style={{display:"flex",borderBottom:"1px solid #1E293B15",background:ci%2?"#0A1020":"transparent"}}>
              <div style={{width:200,minWidth:200,padding:"0 14px",display:"flex",alignItems:"center",gap:8,height:RH}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:car.color,flexShrink:0}}></div>
                <div style={{overflow:"hidden"}}><div style={{fontSize:12,fontWeight:600,color:"#E2E8F0",lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{car.brand} {car.model}</div>{car.plate&&<div style={{fontSize:10,color:"#475569",fontFamily:"'DM Mono'"}}>{car.plate}</div>}</div>
              </div>
              {days.map(day=>{
                const r=rentalForDay(car.id,day);
                const cs=cellStyle(r,day,car);
                const iS=r&&sameDay(day,parseDate(r.startDate));
                const iT=sameDay(day,today);
                return <div key={day.toISOString()} className={"tl-cell"+(r?" clickable":"")}
                  style={{width:CW,minWidth:CW,height:RH,display:"flex",alignItems:"center",position:"relative",borderLeft:iT?"1px solid #6366F130":"1px solid #1E293B08",...cs}}
                  onClick={()=>r&&onRentalClick(r)} title={r?`${r.clientName}${r.city?" · "+r.city:""} · до ${fmtRu(r.endDate)}`:""}>
                  {iS&&r&&<div style={{position:"absolute",left:4,fontSize:9,fontWeight:700,color:daysLeft(r.endDate)<0?"#EF4444":car.color,whiteSpace:"nowrap",overflow:"hidden",maxWidth:CW*5,pointerEvents:"none",zIndex:5}}>{r.clientName.split(" ")[0]}</div>}
                </div>;
              })}
            </div>
          ))}
        </div>
      </div>
      <div style={{padding:"10px 16px",borderTop:"1px solid #1E293B",display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        {cars.map(car=><div key={car.id} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#475569"}}><div style={{width:7,height:7,borderRadius:"50%",background:car.color}}></div>{car.brand} {car.model}</div>)}
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:5,fontSize:11,color:"#475569"}}><div style={{width:14,height:3,background:"#EF4444",borderRadius:2}}></div>Просрочено</div>
      </div>
    </div>
  );
}

function Cards({cars,activeRentals,onRentalClick}){
  return <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14}}>
    {cars.map(car=>{
      const r=activeRentals(car.id)[0]||null;
      const dl=r?daysLeft(r.endDate):null;
      const isFree=!r,isOv=r&&dl<0;
      return <div key={car.id} className="card" style={{padding:18,cursor:r?"pointer":"default"}} onClick={()=>r&&onRentalClick(r)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:car.color,marginTop:2,flexShrink:0}}></div>
            <div><div style={{fontSize:14,fontWeight:700,color:"#F1F5F9"}}>{car.brand} {car.model}</div>{car.plate&&<div style={{fontSize:11,color:"#475569",fontFamily:"'DM Mono'"}}>{car.plate}</div>}</div>
          </div>
          <span className="tag" style={{background:isFree?"#1E293B":isOv?"#EF444420":"#10B98120",color:isFree?"#475569":isOv?"#EF4444":"#10B981",flexShrink:0}}>{isFree?"Свободна":isOv?"Просрочена":"В аренде"}</span>
        </div>
        {r?<div style={{borderTop:"1px solid #1E293B",paddingTop:12}}>
          <div style={{fontSize:14,fontWeight:600,color:"#E2E8F0",marginBottom:3}}>{r.clientName}</div>
          <div style={{fontSize:12,color:"#475569",marginBottom:2}}>📞 {r.phone||"—"}</div>
          <div style={{fontSize:12,color:"#475569",marginBottom:8}}>📍 {r.city||"—"}</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,borderTop:"1px solid #1E293B15"}}>
            <div style={{fontSize:11,color:"#475569",fontFamily:"'DM Mono'"}}>{fmtRu(r.startDate)} → {fmtRu(r.endDate)}</div>
            <div style={{fontSize:13,fontWeight:700,fontFamily:"'DM Mono'",color:isOv?"#EF4444":dl<=2?"#F59E0B":"#10B981"}}>{dl<0?`-${Math.abs(dl)}д`:dl===0?"сегодня":`${dl}д`}</div>
          </div>
        </div>:<div style={{borderTop:"1px solid #1E293B",paddingTop:12,textAlign:"center",color:"#334155",fontSize:12}}>Свободна</div>}
      </div>;
    })}
  </div>;
}

function Detail({rental,cars,onEdit,onEnd,onClose}){
  const car=cars.find(c=>c.id===rental.carId);
  const dl=daysLeft(rental.endDate),isOv=dl<0;
  return <>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
      <div>
        <div style={{fontSize:18,fontWeight:700,color:"#F1F5F9"}}>{rental.clientName}</div>
        {car&&<div style={{fontSize:13,color:"#475569",marginTop:2,display:"flex",alignItems:"center",gap:6}}><div style={{width:7,height:7,borderRadius:"50%",background:car.color}}></div>{car.brand} {car.model}{rental.fromGoogle&&<span className="tag" style={{background:"#4285F420",color:"#4285F4",fontSize:10}}>📅 Google</span>}</div>}
      </div>
      <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
      {[{l:"ТЕЛЕФОН",v:rental.phone,c:"#818CF8"},{l:"ГОРОД",v:rental.city},{l:"МЕСТО ПОДАЧИ",v:rental.location||"—"},{l:"ЦЕНА",v:rental.price?`${rental.price} €`:"—",c:"#10B981"}].map(f=>(
        <div key={f.l} style={{background:"#080B14",borderRadius:10,padding:"11px 13px"}}><div style={{fontSize:10,color:"#334155",marginBottom:3,letterSpacing:".06em"}}>{f.l}</div><div style={{fontSize:13,fontWeight:600,color:f.c||"#CBD5E1"}}>{f.v||"—"}</div></div>
      ))}
    </div>
    <div style={{background:"#080B14",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
      <div style={{fontSize:10,color:"#334155",marginBottom:8,letterSpacing:".06em"}}>ПЕРИОД</div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontFamily:"'DM Mono'",fontSize:13}}>{fmtRu(rental.startDate)}</span>
        <div style={{flex:1,height:2,background:"#1E293B",borderRadius:1}}></div>
        <span style={{fontFamily:"'DM Mono'",fontSize:13}}>{fmtRu(rental.endDate)}</span>
        <span className="tag" style={{background:isOv?"#EF444420":"#10B98120",color:isOv?"#EF4444":"#10B981"}}>{isOv?`-${Math.abs(dl)} дн.`:dl===0?"сегодня":`${dl} дн.`}</span>
      </div>
    </div>
    {rental.notes&&<div style={{background:"#080B14",borderRadius:10,padding:"11px 13px",marginBottom:12}}><div style={{fontSize:10,color:"#334155",marginBottom:3,letterSpacing:".06em"}}>ОПИСАНИЕ / ПРИМЕЧАНИЯ</div><div style={{fontSize:13,color:"#CBD5E1",lineHeight:1.6}}>{rental.notes}</div></div>}
    <div style={{display:"flex",gap:8,marginTop:4}}>
      <button className="btn btn-ghost" style={{flex:1}} onClick={onEdit}>✏️ Редактировать</button>
      <button className="btn btn-danger" style={{flex:1}} onClick={onEnd}>Завершить аренду</button>
    </div>
  </>;
}

function RentalForm({cars,initial,onSave,onCancel}){
  const[f,setF]=useState({carId:"",clientName:"",phone:"",city:"",location:"",startDate:fmtDate(new Date()),endDate:"",price:"",documents:"",notes:"",...initial,carId:initial.carId?String(initial.carId):""});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function submit(){if(!f.carId||!f.clientName||!f.endDate)return alert("Заполните обязательные поля");onSave({...f,carId:Number(f.carId)})}
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>АВТОМОБИЛЬ *</label><select className="input" value={f.carId} onChange={e=>s("carId",e.target.value)}><option value="">Выберите авто...</option>{cars.map(c=><option key={c.id} value={c.id}>{c.brand} {c.model}{c.plate?" · "+c.plate:""}</option>)}</select></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>ИМЯ *</label><input className="input" value={f.clientName} onChange={e=>s("clientName",e.target.value)} placeholder="Владислав"/></div>
      <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>ТЕЛЕФОН</label><input className="input" value={f.phone} onChange={e=>s("phone",e.target.value)} placeholder="+34 644 136 487"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>ГОРОД</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="Валенсия"/></div>
      <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>МЕСТО ПОДАЧИ</label><input className="input" value={f.location} onChange={e=>s("location",e.target.value)} placeholder="Аэропорт"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
      <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>НАЧАЛО</label><input className="input" type="date" value={f.startDate} onChange={e=>s("startDate",e.target.value)}/></div>
      <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>КОНЕЦ *</label><input className="input" type="date" value={f.endDate} onChange={e=>s("endDate",e.target.value)}/></div>
      <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>ЦЕНА €</label><input className="input" type="number" value={f.price} onChange={e=>s("price",e.target.value)} placeholder="0"/></div>
    </div>
    <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>ДОКУМЕНТЫ</label><input className="input" value={f.documents} onChange={e=>s("documents",e.target.value)} placeholder="Паспорт, права, депозит..."/></div>
    <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>ПРИМЕЧАНИЯ</label><textarea className="input" rows={2} value={f.notes} onChange={e=>s("notes",e.target.value)} style={{resize:"vertical"}}/></div>
    <div style={{display:"flex",gap:8,marginTop:4}}>
      <button className="btn btn-ghost" style={{flex:1}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-primary" style={{flex:2}} onClick={submit}>Сохранить</button>
    </div>
  </div>;
}

function CarForm({onSave,onCancel}){
  const[f,setF]=useState({brand:"",model:"",plate:""});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function submit(){if(!f.brand||!f.model)return alert("Заполните марку и модель");onSave(f)}
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>МАРКА *</label><input className="input" value={f.brand} onChange={e=>s("brand",e.target.value)} placeholder="Toyota"/></div>
      <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>МОДЕЛЬ *</label><input className="input" value={f.model} onChange={e=>s("model",e.target.value)} placeholder="Yaris"/></div>
    </div>
    <div><label style={{fontSize:11,color:"#475569",display:"block",marginBottom:5}}>НОМЕР</label><input className="input" value={f.plate} onChange={e=>s("plate",e.target.value)} placeholder="1234 AB"/></div>
    <div style={{display:"flex",gap:8,marginTop:4}}>
      <button className="btn btn-ghost" style={{flex:1}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-primary" style={{flex:2}} onClick={submit}>Добавить</button>
    </div>
  </div>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
