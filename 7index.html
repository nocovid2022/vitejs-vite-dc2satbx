<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetDesk — Auto in Spain</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;
  --bg2:#111111;
  --bg3:#1A1A1A;
  --border:#252525;
  --border2:#333;
  --teal:#4EC8C8;
  --teal2:#3AAFAF;
  --teal-dim:#4EC8C820;
  --teal-dim2:#4EC8C810;
  --text:#F0F0F0;
  --text2:#A0A0A0;
  --text3:#555;
  --green:#27AE60;
  --yellow:#E67E22;
  --red:#C0392B;
  --green-dim:#27AE6018;
  --yellow-dim:#E67E2218;
  --red-dim:#C0392B18;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;font-size:14px}
::-webkit-scrollbar{height:4px;width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:8px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-teal{background:var(--teal);color:#000;padding:8px 16px;font-size:13px;font-weight:700}.btn-teal:hover{background:var(--teal2)}
.btn-ghost{background:transparent;color:var(--text2);padding:8px 16px;font-size:13px;border:1px solid var(--border2)}.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn-red{background:var(--red-dim);color:#E74C3C;padding:7px 14px;font-size:13px;border:1px solid #E74C3C30}
.btn-sm{padding:6px 12px;font-size:12px}
.input{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:10px 13px;color:var(--text);font-size:13px;width:100%;outline:none;transition:all .15s;font-family:inherit}.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;display:block;margin-bottom:5px;text-transform:uppercase}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;transition:all .2s}.card:hover{border-color:var(--border2)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.view-pill{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);padding:7px 14px;border-radius:8px;transition:all .15s}
.view-pill.active{background:var(--bg3);color:var(--teal);border:1px solid var(--border2)}
.tab-btn{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);padding:10px 16px;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal)}
.section{background:var(--bg3);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
.section-row{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.section-row:last-child{border-bottom:none}
.tl-bar{border-radius:5px;cursor:pointer;display:flex;align-items:center;padding:0 8px;overflow:hidden;position:absolute;transition:all .1s}
.tl-bar:hover{filter:brightness(1.12);transform:scaleY(.93)}
.tl-bar::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.09),transparent);border-radius:inherit;pointer-events:none}
.stat-card{border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:12;cursor:pointer;transition:all .15s;border:1px solid transparent}
.stat-card:hover{transform:translateY(-2px);filter:brightness(1.08)}

/* Draggable modal */
.drag-modal{position:fixed;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;box-shadow:0 20px 60px #000000CC;z-index:300;min-width:460px;max-width:540px;width:100%;overflow:hidden}
.drag-modal-header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);cursor:grab;user-select:none;background:var(--bg3)}
.drag-modal-header:active{cursor:grabbing}
.drag-modal-body{padding:20px;max-height:76vh;overflow-y:auto}
.drag-modal-overlay{position:fixed;inset:0;background:#00000070;backdrop-filter:blur(6px);z-index:299}

@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}.fade-in{animation:fadeIn .18s ease}
@keyframes spin{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:spin 1s linear infinite}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;
const CLIENT_ID="546196176766-060ji046vk8r8kem36ko66dr6d4gme9n.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/calendar";

const CAR_COLORS=["#4EC8C8","#3498DB","#9B59B6","#E67E22","#1ABC9C","#E74C3C","#F1C40F","#2ECC71","#16A085","#8E44AD","#D35400","#27AE60"];

  {id:12,brand:"Toyota",model:"Yaris",plate:"",city:"",color:CAR_COLORS[11],lastServiceMileage:"",nextServiceMileage:""},
];

const CAR_KW=[
  {id:1,kw:["polo","vw polo","volkswagen polo"]},
  {id:2,kw:["golf","vw golf","volkswagen golf"]},
  {id:3,kw:["lexus","ct200","ct 200"]},
  {id:4,kw:["yaris hybrid","yaris гибрид"]},
  {id:5,kw:["scala"]},
  {id:6,kw:["ionic","ioniq"]},
  {id:7,kw:["superb"]},
  {id:8,kw:["passat"]},
  {id:9,kw:["500e alicante","500 alicante","fiat alicante"]},
  {id:10,kw:["500e","fiat 500","500 valencia","fiat 500e"]},
  {id:11,kw:["218","gran tourer","218d","bmw 218"]},
  {id:12,kw:["yaris"]},
];

function getRentalStatus(r){
  if(!r||!r.active)return"done";
  const now=new Date();now.setHours(0,0,0,0);
  const s=parseDate(r.startDate);s.setHours(0,0,0,0);
  const e=parseDate(r.endDate);e.setHours(0,0,0,0);
  if(e<now)return"overdue";if(s>now)return"reserved";return"active";
}
const SC={
  active:{label:"В аренде",color:"#27AE60",bg:"#27AE6018",dot:"#27AE60"},
  reserved:{label:"Резерв",color:"#E67E22",bg:"#E67E2218",dot:"#E67E22"},
  overdue:{label:"Просрочено",color:"#E74C3C",bg:"#E74C3C18",dot:"#E74C3C"},
  free:{label:"Свободна",color:"#555",bg:"#55555518",dot:"#444"},
  done:{label:"Завершено",color:"#4EC8C8",bg:"#4EC8C818",dot:"#4EC8C8"},
};
function getCarStatus(carId,rentals){
  const active=rentals.filter(r=>r.active&&r.carId===carId);
  if(!active.length)return{status:"free",rental:null};
  const cur=active.find(r=>getRentalStatus(r)==="active");if(cur)return{status:"active",rental:cur};
  const ov=active.find(r=>getRentalStatus(r)==="overdue");if(ov)return{status:"overdue",rental:ov};
  const res=active.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate))[0];
  return{status:"reserved",rental:res};
}
function findCarId(text,cars){
  const t=text.toLowerCase();
  for(const ck of CAR_KW){if(ck.kw.some(k=>t.includes(k)))return ck.id}
  for(const c of cars){if(t.includes(c.model.toLowerCase())||t.includes((c.brand+" "+c.model).toLowerCase()))return c.id}
  return null;
}
function parseEvent(ev,cars){
  const title=ev.summary||"",desc=ev.description||"";
  const phoneMatch=title.match(/\+[\d\s\-()]{8,15}/);
  const phone=phoneMatch?phoneMatch[0].trim():"";
  let rest=title.replace(/\+[\d\s\-()]{8,15}/,"").trim();
  rest=rest.replace(/оплата.*/i,"").replace(/аванс.*/i,"").replace(/залог.*/i,"").trim();
  const carId=findCarId(rest,cars)||findCarId(title,cars);
  let rem=rest;
  if(carId){
    const ck=CAR_KW.find(x=>x.id===carId);
    if(ck)for(const k of ck.kw)rem=rem.replace(new RegExp(k,"gi"),"").trim();
    const car=cars.find(c=>c.id===carId);
    if(car)rem=rem.replace(new RegExp(car.model,"gi"),"").replace(new RegExp(car.brand,"gi"),"").trim();
  }
  rem=rem.replace(/\s+/g," ").replace(/^[-,·\s]+|[-,·\s]+$/g,"").trim();
  const parts=rem.split(/\s+/).filter(Boolean);
  const CITIES=["валенсия","мадрид","барселона","аликанте","севилья","малага","valencia","madrid","barcelona","alicante","sevilla","malaga","бенидорм","торревьеха","murcia","мурсия","benidorm","torrevieja"];
  let city="",clientName="";
  if(parts.length>0&&CITIES.includes(parts[0].toLowerCase())){city=parts[0];clientName=parts.slice(1).join(" ")}
  else clientName=parts.join(" ");
  const g=k=>{const m=desc.match(new RegExp(k+"[:\\s]+([^\\n]+)","i"));return m?m[1].trim():""};
  return{id:ev.id,googleEventId:ev.id,carId,clientName:clientName||title,phone,city:city||g("город")||g("city"),location:g("место")||g("location"),price:g("цена")||g("price"),documents:g("документы")||g("docs"),notes:desc,startDate:ev.start?.date||(ev.start?.dateTime?ev.start.dateTime.split("T")[0]:""),endDate:ev.end?.date||(ev.end?.dateTime?ev.end.dateTime.split("T")[0]:""),active:true,fromGoogle:true};
}
function toGoogleEvent(r,cars){
  const car=cars.find(c=>c.id===r.carId);
  const label=car?`${car.brand} ${car.model}`:"";
  const title=`${r.city?r.city+" ":""}${r.clientName} ${label}${r.phone?" "+r.phone:""}`.trim();
  const lines=[r.price&&`Цена: ${r.price} €`,r.location&&`Место: ${r.location}`,r.documents&&`Документы: ${r.documents}`].filter(Boolean);
  return{summary:title,description:lines.join("\n"),start:{date:r.startDate},end:{date:r.endDate}};
}
function fmtDate(d){return d.toISOString().split("T")[0]}
function parseDate(s){if(!s)return new Date();const[y,m,d]=s.split("-");return new Date(+y,+m-1,+d)}
function daysLeft(e){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(e)-n)/86400000)}
function daysUntil(s){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(s)-n)/86400000)}
function fmtRu(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})}
function fmtRuFull(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"})}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function useDraggable(init){
  const[pos,setPos]=useState(init);
  const drag=useRef(false);const off=useRef({x:0,y:0});
  const down=useCallback((e)=>{if(e.target.closest('.no-drag'))return;drag.current=true;off.current={x:e.clientX-pos.x,y:e.clientY-pos.y};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)},[pos]);
  const move=useCallback((e)=>{if(!drag.current)return;setPos({x:e.clientX-off.current.x,y:e.clientY-off.current.y})},[]);
  const up=useCallback(()=>{drag.current=false;document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)},[]);
  useEffect(()=>()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)},[]);
  return{pos,down};
}

function DragModal({title,onClose,children,ix,iy,width}){
  const{pos,down}=useDraggable({x:ix!=null?ix:window.innerWidth/2-240,y:iy!=null?iy:80});
  return <>
    <div className="drag-modal-overlay" onClick={onClose}/>
    <div className="drag-modal fade-in" style={{left:Math.max(0,Math.min(pos.x,window.innerWidth-480)),top:Math.max(0,Math.min(pos.y,window.innerHeight-100)),width:width||480}}>
      <div className="drag-modal-header" onMouseDown={down}>
        <div style={{fontSize:14,fontWeight:700,color:"var(--text)"}}>{title}</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:10,color:"#444",userSelect:"none"}}>✥ перетащи</span>
          <button className="btn btn-ghost btn-sm no-drag" onClick={onClose} style={{padding:"3px 10px"}}>✕</button>
        </div>
      </div>
      <div className="drag-modal-body">{children}</div>
    </div>
  </>;
}

}

// Quick list modal — показывается при клике на стат
function QuickList({title,rentals,cars,color,onClose,onSelect}){
  return <>
    <div style={{marginBottom:14,fontSize:12,color:"var(--text3)"}}>Нажми на карточку чтобы открыть подробности</div>
    {rentals.length===0&&<div style={{textAlign:"center",padding:"30px",color:"var(--text3)"}}>Нет записей</div>}
    {rentals.map(r=>{
      const car=cars.find(c=>c.id===r.carId);
      const dl=daysLeft(r.endDate);
      const status=getRentalStatus(r);
      return(
        <div key={r.id} style={{background:"var(--bg3)",borderRadius:10,padding:"12px 14px",marginBottom:8,cursor:"pointer",border:`1px solid ${color}20`,transition:"all .15s"}}
          onClick={()=>{onSelect(r);onClose()}}
          onMouseEnter={e=>e.currentTarget.style.borderColor=color}
          onMouseLeave={e=>e.currentTarget.style.borderColor=`${color}20`}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:"var(--text)"}}>{r.clientName}</div>
              {car&&<div style={{fontSize:11,color:"var(--text3)",display:"flex",alignItems:"center",gap:5,marginTop:2}}><div style={{width:5,height:5,borderRadius:"50%",background:car.color}}></div>{car.brand} {car.model}</div>}
            </div>
            <div style={{textAlign:"right"}}>
              {r.phone&&<div style={{fontSize:12,color:"var(--teal)",fontWeight:500}}>{r.phone}</div>}
              {r.city&&<div style={{fontSize:11,color:"var(--text3)"}}>{r.city}</div>}
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,borderTop:"1px solid var(--border)"}}>
            <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{fmtRu(r.startDate)} → {fmtRu(r.endDate)}</div>
            <div style={{fontSize:11,fontWeight:700,color}}>
              {status==="reserved"?`через ${daysUntil(r.startDate)} дн.`:status==="overdue"?`просрочено ${Math.abs(dl)} дн.`:dl===0?"сегодня возврат":`${dl} дн. осталось`}
              {r.price&&<span style={{color:"#27AE60",marginLeft:8}}>{r.price} €</span>}
            </div>
          </div>
        </div>
      );
    })}
  </>;
}

function AvailabilityChecker({cars,rentals}){
  const[from,setFrom]=useState(fmtDate(new Date()));
  const[to,setTo]=useState("");
  const[results,setResults]=useState(null);
  function check(){
    const f=parseDate(from);f.setHours(0,0,0,0);
    const t=to?parseDate(to):f;t.setHours(0,0,0,0);
    const res=cars.map(car=>{
      const conflicts=rentals.filter(r=>{
        if(!r.active||r.carId!==car.id)return false;
        const s=parseDate(r.startDate);s.setHours(0,0,0,0);
        const e=parseDate(r.endDate);e.setHours(0,0,0,0);
        return s<=t&&e>=f;
      });
      if(!conflicts.length)return{car,status:"free",conflict:null};
      const act=conflicts.find(r=>getRentalStatus(r)==="active");
      return{car,status:act?"busy":"reserved",conflict:act||conflicts[0]};
    });
    setResults(res);
  }
  const free=results?.filter(r=>r.status==="free")||[];
  const busy=results?.filter(r=>r.status!=="free")||[];
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <div><label className="label">С какого числа</label><input className="input" type="date" value={from} onChange={e=>setFrom(e.target.value)}/></div>
      <div><label className="label">По какое (необязательно)</label><input className="input" type="date" value={to} onChange={e=>setTo(e.target.value)}/></div>
    </div>
    <button className="btn btn-teal" style={{width:"100%",justifyContent:"center",marginBottom:16}} onClick={check}>Проверить доступность</button>
    {results&&<>
      {free.length>0&&<>
        <div style={{fontSize:12,fontWeight:700,color:"#27AE60",marginBottom:8}}>✓ Свободно: {free.length} авто</div>
        {free.map(({car})=>(
          <div key={car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"#27AE6012",borderRadius:8,marginBottom:6,border:"1px solid #27AE6025"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:car.color}}></div>
            <div style={{fontWeight:600,fontSize:13}}>{car.brand} {car.model}</div>
            {car.plate&&<div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginLeft:"auto"}}>{car.plate}</div>}
            <span className="tag" style={{background:"#27AE6020",color:"#27AE60"}}>Свободна</span>
          </div>
        ))}
      </>}
      {busy.length>0&&<>
        <div style={{fontSize:12,fontWeight:700,color:"var(--text3)",marginTop:12,marginBottom:8}}>Занято: {busy.length} авто</div>
        {busy.map(({car,status,conflict})=>(
          <div key={car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:status==="busy"?"#E74C3C10":"#E67E2210",borderRadius:8,marginBottom:6,border:`1px solid ${status==="busy"?"#E74C3C25":"#E67E2225"}`}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:car.color}}></div>
            <div>
              <div style={{fontWeight:600,fontSize:13}}>{car.brand} {car.model}</div>
              {conflict&&<div style={{fontSize:11,color:"var(--text3)"}}>{conflict.clientName} · {fmtRu(conflict.startDate)}–{fmtRu(conflict.endDate)}</div>}
            </div>
            <span className="tag" style={{background:status==="busy"?"#E74C3C20":"#E67E2220",color:status==="busy"?"#E74C3C":"#E67E22",marginLeft:"auto"}}>{status==="busy"?"В аренде":"Резерв"}</span>
          </div>
        ))}
      </>}
      {results.length>0&&free.length===0&&<div style={{textAlign:"center",padding:"16px",color:"#E74C3C",fontSize:13,fontWeight:600}}>На эти даты все машины заняты</div>}
    </>}
  </div>;
}

function App(){
  const[cars,setCars]=useState(()=>{try{const s=localStorage.getItem(CARS_KEY);return s?JSON.parse(s):DEFAULT_CARS}catch{return DEFAULT_CARS}});
  const[rentals,setRentals]=useState(()=>{try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):[]}catch{return[]}});
  const[view,setView]=useState("timeline");
  const[clientsTab,setClientsTab]=useState("active");
  const[monthOffset,setMonthOffset]=useState(0);
  const[showForm,setShowForm]=useState(false);
  const[showCarForm,setShowCarForm]=useState(false);
  const[editCarId,setEditCarId]=useState(null);
  const[showGuide,setShowGuide]=useState(false);
  const[showAvail,setShowAvail]=useState(false);
  const[editRental,setEditRental]=useState(null);
  const[selected,setSelected]=useState(null);
  const[quickList,setQuickList]=useState(null); // {title, rentals, color}
  const[gapiReady,setGapiReady]=useState(false);
  const[gisReady,setGisReady]=useState(false);
  const[signedIn,setSignedIn]=useState(false);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[syncCount,setSyncCount]=useState(0);
  const[tokenClient,setTokenClient]=useState(null);
  const carsRef=useRef(cars);
  useEffect(()=>{carsRef.current=cars},[cars]);
  useEffect(()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(rentals))},[rentals]);
  useEffect(()=>{localStorage.setItem(CARS_KEY,JSON.stringify(cars))},[cars]);

  useEffect(()=>{
    const s1=document.createElement("script");s1.src="https://apis.google.com/js/api.js";
    s1.onload=()=>{window.gapi.load("client",async()=>{await window.gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"]});setGapiReady(true)})};
    document.head.appendChild(s1);
    const s2=document.createElement("script");s2.src="https://accounts.google.com/gsi/client";
    s2.onload=()=>{const tc=window.google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:(r)=>{if(!r.error){setSignedIn(true);doSync()}}});setTokenClient(tc);setGisReady(true)};
    document.head.appendChild(s2);
  },[]);

  async function doSync(){
    setSyncStatus("syncing");
    try{
      const now=new Date();
      const r=await window.gapi.client.calendar.events.list({calendarId:"primary",timeMin:new Date(now.getFullYear(),now.getMonth()-6,1).toISOString(),timeMax:new Date(now.getFullYear(),now.getMonth()+6,1).toISOString(),singleEvents:true,orderBy:"startTime",maxResults:500});
      const cc=carsRef.current;
      const evs=(r.result.items||[]).filter(e=>e.summary&&e.summary.trim().length>1).map(e=>parseEvent(e,cc)).filter(x=>x.carId&&x.startDate&&x.endDate);
      setRentals(prev=>{
        const manual=prev.filter(x=>!x.fromGoogle);
        const merged=evs.map(nw=>{
          const ex=prev.find(x=>x.googleEventId===nw.googleEventId);
          if(ex)return{...ex,clientName:nw.clientName,phone:nw.phone,city:nw.city||ex.city,location:nw.location||ex.location,price:nw.price||ex.price,documents:nw.documents||ex.documents,startDate:nw.startDate,endDate:nw.endDate,carId:nw.carId||ex.carId,fromGoogle:true,active:true};
          return nw;
        });
        return[...manual,...merged];
      });
      setSyncCount(evs.length);setSyncStatus("done");setTimeout(()=>setSyncStatus("idle"),4000);
    }catch(e){console.error(e);setSyncStatus("error")}
  }

  async function createCalEvent(r){if(!signedIn)return null;try{const res=await window.gapi.client.calendar.events.insert({calendarId:"primary",resource:toGoogleEvent(r,cars)});return res.result.id}catch{return null}}
  async function updateCalEvent(r){if(!signedIn||!r.googleEventId)return;try{await window.gapi.client.calendar.events.update({calendarId:"primary",eventId:r.googleEventId,resource:toGoogleEvent(r,cars)})}catch{}}

  async function saveRental(data){
    if(editRental){const u={...editRental,...data};await updateCalEvent(u);setRentals(r=>r.map(x=>x.id===editRental.id?u:x))}
    else{const n={...data,id:Date.now(),active:true};const gid=await createCalEvent(n);if(gid)n.googleEventId=gid;setRentals(r=>[...r,n])}
    setShowForm(false);setEditRental(null);
  }

  // ЗАВЕРШИТЬ АРЕНДУ — НЕ удаляем из календаря, только меняем статус
  function endRental(id){
    setRentals(r=>r.map(x=>x.id===id?{...x,active:false,endedAt:fmtDate(new Date())}:x));
    setSelected(null);
  }

  function saveCar(data){
    if(editCarId)setCars(c=>c.map(x=>x.id===editCarId?{...x,...data}:x));
    else{const color=CAR_COLORS[cars.length%CAR_COLORS.length];setCars(c=>[...c,{...data,id:Date.now(),color,lastServiceMileage:"",nextServiceMileage:""}])}
    setShowCarForm(false);setEditCarId(null);
  }

  const today=new Date();today.setHours(0,0,0,0);
  const vm=new Date(today.getFullYear(),today.getMonth()+monthOffset,1);
  const days=Array.from({length:new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate()},(_,i)=>new Date(vm.getFullYear(),vm.getMonth(),i+1));
  const monthLabel=vm.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  function rentalForDay(cid,day){return rentals.find(r=>{if(!r.active||r.carId!==cid)return false;const s=parseDate(r.startDate);s.setHours(0,0,0,0);const e=parseDate(r.endDate);e.setHours(0,0,0,0);return day>=s&&day<=e})}

  const activeR=rentals.filter(r=>r.active&&getRentalStatus(r)==="active");
  const reservedR=rentals.filter(r=>r.active&&getRentalStatus(r)==="reserved");
  const overdueR=rentals.filter(r=>r.active&&getRentalStatus(r)==="overdue");
  const doneR=rentals.filter(r=>!r.active);
  const freeCount=cars.filter(c=>getCarStatus(c.id,rentals).status==="free").length;

  const clientTabs=[
    {key:"active",label:"В аренде",count:activeR.length,color:"#27AE60"},
    {key:"reserved",label:"Резерв",count:reservedR.length,color:"#E67E22"},
    {key:"overdue",label:"Просрочено",count:overdueR.length,color:"#E74C3C"},
    {key:"done",label:"Завершённые",count:doneR.length,color:"var(--teal)"},
  ];
  const tabRentals={active:activeR,reserved:reservedR,overdue:overdueR,done:doneR};

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      {/* Header */}
      <div style={{background:"#0D0D0DEE",backdropFilter:"blur(20px)",borderBottom:"1px solid var(--border)",padding:"11px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,flexWrap:"wrap",gap:8}}>
        <Logo/>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowAvail(true)} style={{color:"var(--teal)",borderColor:"var(--teal)",background:"var(--teal-dim2)"}}>🔍 Доступность</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowGuide(true)}>📋 Формат</button>
          {!signedIn?(
            <button className="btn btn-ghost btn-sm" onClick={()=>gapiReady&&gisReady&&tokenClient.requestAccessToken({prompt:""})}>
              <svg width="13" height="13" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              {gapiReady&&gisReady?"Google Calendar":"Загрузка..."}
            </button>
          ):(
            <button className="btn btn-ghost btn-sm" onClick={doSync} disabled={syncStatus==="syncing"} style={{color:syncStatus==="done"?"#27AE60":undefined}}>
              <span className={syncStatus==="syncing"?"spin":""}>🔄</span>
              {syncStatus==="syncing"?"Синхр...":syncStatus==="done"?`✓ ${syncCount}`:syncStatus==="error"?"Ошибка":"Синхронизировать"}
            </button>
          )}
          <div style={{background:"var(--bg3)",borderRadius:9,padding:"3px",display:"flex",border:"1px solid var(--border)"}}>
            <button className={"view-pill"+(view==="timeline"?" active":"")} onClick={()=>setView("timeline")}>📅 Таймлайн</button>
            <button className={"view-pill"+(view==="cars"?" active":"")} onClick={()=>setView("cars")}>🚗 Авто</button>
            <button className={"view-pill"+(view==="clients"?" active":"")} onClick={()=>setView("clients")}>👤 Клиенты</button>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setEditCarId(null);setShowCarForm(true)}}>+ Авто</button>
          <button className="btn btn-teal btn-sm" onClick={()=>{setEditRental(null);setShowForm(true)}}>+ Аренда</button>
        </div>
      </div>

      <div style={{padding:"20px 24px",maxWidth:1600,margin:"0 auto"}}>
        {/* Clickable stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12,marginBottom:20}}>
          <StatCard icon="🚗" label="Всего авто" value={cars.length} color="var(--teal)" bg="var(--teal-dim)" onClick={()=>setQuickList(null)}/>
          <StatCard icon="🔑" label="В аренде" value={activeR.length} color="#27AE60" bg="#27AE6018" onClick={()=>setQuickList({title:"В аренде прямо сейчас",rentals:activeR,color:"#27AE60"})}/>
          <StatCard icon="📅" label="Резерв" value={reservedR.length} color="#E67E22" bg="#E67E2218" onClick={()=>setQuickList({title:"Предстоящий резерв",rentals:reservedR,color:"#E67E22"})}/>
          <StatCard icon="⚠️" label="Просрочено" value={overdueR.length} color="#E74C3C" bg="#E74C3C18" onClick={()=>setQuickList({title:"Просроченные аренды",rentals:overdueR,color:"#E74C3C"})}/>
          <StatCard icon="🅿️" label="Свободно" value={freeCount} color="#555" bg="#33333320" onClick={()=>setQuickList({title:"Свободные авто",rentals:[],color:"#555",isFree:true,cars:cars.filter(c=>getCarStatus(c.id,rentals).status==="free")})}/>
        </div>

        {view==="timeline"&&<Timeline cars={cars} days={days} today={today} monthLabel={monthLabel} monthOffset={monthOffset} setMonthOffset={setMonthOffset} rentalForDay={rentalForDay} onRentalClick={setSelected}/>}

        {view==="cars"&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
            {cars.map(car=>{
              const{status,rental}=getCarStatus(car.id,rentals);
              const sc=SC[status];
              return(
                <div key={car.id} className="card">
                  <div style={{padding:"13px 15px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:34,height:34,borderRadius:9,background:car.color+"20",border:`1px solid ${car.color}40`,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:10,height:10,borderRadius:"50%",background:car.color}}></div></div>
                      <div>
                        <div style={{fontSize:14,fontWeight:700}}>{car.brand} {car.model}</div>
                        <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginTop:1}}>{car.plate||"Нет номера"}{car.city?` · ${car.city}`:""}</div>
                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span className="tag" style={{background:sc.bg,color:sc.color}}><span style={{width:5,height:5,borderRadius:"50%",background:sc.dot,display:"inline-block"}}></span>{sc.label}</span>
                      <button className="btn btn-ghost btn-sm" style={{padding:"4px 8px"}} onClick={()=>{setEditCarId(car.id);setShowCarForm(true)}}>✏️</button>
                    </div>
                  </div>
                  {/* Service info */}
                  {(car.lastServiceMileage||car.nextServiceMileage)&&(
                    <div style={{padding:"8px 15px",borderBottom:"1px solid var(--border)",display:"flex",gap:16,background:"var(--bg3)"}}>
                      {car.lastServiceMileage&&<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ПОСЛ. ТО</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{car.lastServiceMileage} км</div></div>}
                      {car.nextServiceMileage&&<div><div style={{fontSize:9,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>СЛЕД. ТО</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--teal)"}}>{car.nextServiceMileage} км</div></div>}
                    </div>
                  )}
                  {rental?(
                    <div style={{padding:"13px 15px",cursor:"pointer"}} onClick={()=>setSelected(rental)}>
                      <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>{rental.clientName}</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:6}}>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ТЕЛЕФОН</div><div style={{fontSize:12,color:"var(--teal)",fontWeight:500}}>{rental.phone||"—"}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ГОРОД</div><div style={{fontSize:12}}>{rental.city||"—"}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>НАЧАЛО</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{fmtRu(rental.startDate)}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>КОНЕЦ</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{fmtRu(rental.endDate)}</div></div>
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",paddingTop:8,borderTop:"1px solid var(--border)"}}>
                        {rental.price?<div style={{fontSize:13,fontWeight:700,color:"#27AE60"}}>{rental.price} €</div>:<div/>}
                        <div style={{fontSize:11,fontWeight:600,color:sc.color}}>
                          {status==="reserved"?`Через ${daysUntil(rental.startDate)} дн.`:status==="overdue"?`Просрочено ${Math.abs(daysLeft(rental.endDate))} дн.`:daysLeft(rental.endDate)===0?"Сегодня возврат":`${daysLeft(rental.endDate)} дн.`}
                        </div>
                      </div>
                    </div>
                  ):(
                    <div style={{padding:"13px 15px",textAlign:"center"}}>
                      <div style={{color:"var(--text3)",fontSize:13,marginBottom:10}}>Машина свободна</div>
                      <button className="btn btn-teal btn-sm" style={{width:"100%",justifyContent:"center"}} onClick={()=>{setEditRental(null);setShowForm(true)}}>+ Аренда</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {view==="clients"&&(
          <div>
            <div className="card" style={{marginBottom:14,overflow:"hidden"}}>
              <div style={{display:"flex",overflowX:"auto",padding:"0 8px",borderBottom:"1px solid var(--border)"}}>
                {clientTabs.map(t=>(
                  <button key={t.key} className={"tab-btn"+(clientsTab===t.key?" active":"")} onClick={()=>setClientsTab(t.key)} style={{color:clientsTab===t.key?t.color:"var(--text3)",borderBottomColor:clientsTab===t.key?t.color:"transparent"}}>
                    {t.label}<span style={{background:clientsTab===t.key?t.color+"25":"var(--bg3)",color:clientsTab===t.key?t.color:"var(--text3)",borderRadius:20,padding:"1px 7px",fontSize:10,marginLeft:4,fontWeight:700}}>{t.count}</span>
                  </button>
                ))}
              </div>
            </div>
            {tabRentals[clientsTab].length===0?(
              <div style={{textAlign:"center",padding:"60px",color:"var(--text3)",fontSize:14}}>
                {clientsTab==="done"?"Завершённые аренды появятся здесь":"Нет записей"}
              </div>
            ):(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:12}}>
                {tabRentals[clientsTab].map(rental=>{
                  const car=cars.find(c=>c.id===rental.carId);
                  const status=getRentalStatus(rental);
                  const sc=SC[rental.active?status:"done"];
                  return(
                    <div key={rental.id} className="card" style={{padding:15,cursor:"pointer"}} onClick={()=>setSelected(rental)}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                        <div>
                          <div style={{fontSize:15,fontWeight:700,marginBottom:3}}>{rental.clientName}</div>
                          {car&&<div style={{fontSize:12,color:"var(--text3)",display:"flex",alignItems:"center",gap:5}}><div style={{width:6,height:6,borderRadius:"50%",background:car.color}}></div>{car.brand} {car.model}</div>}
                        </div>
                        <span className="tag" style={{background:sc.bg,color:sc.color,flexShrink:0}}>{sc.label}</span>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ТЕЛЕФОН</div><div style={{fontSize:13,color:"var(--teal)",fontWeight:500}}>{rental.phone||"—"}</div></div>
                        <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:2}}>ГОРОД</div><div style={{fontSize:13}}>{rental.city||"—"}</div></div>
                      </div>
                      {rental.location&&<div style={{fontSize:12,color:"var(--text2)",marginBottom:8}}>📍 {rental.location}</div>}
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,borderTop:"1px solid var(--border)"}}>
                        <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{fmtRu(rental.startDate)} → {fmtRu(rental.endDate)}</div>
                        <div style={{display:"flex",gap:8,alignItems:"center"}}>
                          {rental.endedAt&&<div style={{fontSize:10,color:"var(--teal)"}}>завершена {fmtRu(rental.endedAt)}</div>}
                          {rental.price&&<div style={{fontSize:13,fontWeight:700,color:"#27AE60"}}>{rental.price} €</div>}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Quick list modal */}
      {quickList&&(
        <DragModal title={quickList.title} onClose={()=>setQuickList(null)} ix={window.innerWidth/2-240} iy={80} width={500}>
          {quickList.isFree?(
            <div>
              <div style={{fontSize:12,color:"var(--text3)",marginBottom:14}}>Автомобили без активных аренд</div>
              {(quickList.cars||[]).map(car=>(
                <div key={car.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"var(--bg3)",borderRadius:8,marginBottom:6,border:"1px solid var(--border)"}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:car.color}}></div>
                  <div style={{fontWeight:600,fontSize:13}}>{car.brand} {car.model}</div>
                  {car.plate&&<div style={{fontSize:11,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginLeft:"auto"}}>{car.plate}</div>}
                  {car.city&&<div style={{fontSize:11,color:"var(--text3)"}}>{car.city}</div>}
                </div>
              ))}
              {(quickList.cars||[]).length===0&&<div style={{textAlign:"center",padding:"30px",color:"var(--text3)"}}>Все машины заняты</div>}
            </div>
          ):(
            <QuickList title={quickList.title} rentals={quickList.rentals} cars={cars} color={quickList.color} onClose={()=>setQuickList(null)} onSelect={setSelected}/>
          )}
        </DragModal>
      )}

      {showAvail&&<DragModal title="🔍 Проверить доступность" onClose={()=>setShowAvail(false)} ix={window.innerWidth/2-240} iy={100}><AvailabilityChecker cars={cars} rentals={rentals}/></DragModal>}

      {showGuide&&<DragModal title="📋 Формат Google Calendar" onClose={()=>setShowGuide(false)} ix={window.innerWidth/2-240} iy={80}>
        <div style={{background:"#0D1A2E",borderRadius:10,padding:"14px",marginBottom:14,border:"1px solid #1A3A5A"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#4EC8C8",marginBottom:8}}>НАЗВАНИЕ СОБЫТИЯ</div>
          <div style={{fontFamily:"'JetBrains Mono'",fontSize:13,background:"var(--bg)",borderRadius:8,padding:"10px 12px",color:"#7BB3FF",border:"1px solid #1A3A5A"}}>Валенсия Владислав Passat +34644136487</div>
          <div style={{fontSize:12,color:"#4EC8C8",marginTop:8}}>Формат: <b>Город Имя Модель Телефон</b></div>
        </div>
        <div style={{background:"var(--bg3)",borderRadius:10,padding:"14px",marginBottom:14,border:"1px solid var(--border2)"}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--text3)",marginBottom:8}}>ОПИСАНИЕ СОБЫТИЯ</div>
          <div style={{fontFamily:"'JetBrains Mono'",fontSize:12,lineHeight:2,color:"var(--text2)"}}>Цена: 420<br/>Место: Аэропорт T4<br/>Документы: Паспорт РФ</div>
        </div>
        <div style={{fontSize:11,fontWeight:700,color:"var(--text3)",marginBottom:10}}>МОДЕЛИ ДЛЯ РАСПОЗНАВАНИЯ</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {cars.map(c=><div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"var(--bg3)",borderRadius:8,fontSize:12,border:"1px solid var(--border)"}}><div style={{width:6,height:6,borderRadius:"50%",background:c.color}}></div><span style={{fontFamily:"'JetBrains Mono'",color:"var(--text2)"}}>{c.model}</span></div>)}
        </div>
      </DragModal>}

      {selected&&<DragModal title={selected.clientName} onClose={()=>setSelected(null)} ix={window.innerWidth/2-240} iy={80}>
        <Detail rental={selected} cars={cars} onEdit={()=>{setEditRental(selected);setSelected(null);setShowForm(true)}} onEnd={()=>endRental(selected.id)}/>
      </DragModal>}

      {showForm&&<DragModal title={editRental?"Редактировать аренду":"Новая аренда"} onClose={()=>{setShowForm(false);setEditRental(null)}} ix={window.innerWidth/2-240} iy={60}>
        <RentalForm cars={cars} initial={editRental||{}} onSave={saveRental} onCancel={()=>{setShowForm(false);setEditRental(null)}}/>
      </DragModal>}

      {showCarForm&&<DragModal title={editCarId?"Редактировать авто":"Добавить авто"} onClose={()=>{setShowCarForm(false);setEditCarId(null)}} ix={window.innerWidth/2-240} iy={100} width={460}>
        <CarForm initial={editCarId?cars.find(c=>c.id===editCarId):null} onSave={saveCar} onCancel={()=>{setShowCarForm(false);setEditCarId(null)}}/>
      </DragModal>}
    </div>
  );
}

function Timeline({cars,days,today,monthLabel,monthOffset,setMonthOffset,rentalForDay,onRentalClick}){
  const CW=32,RH=40,LW=192;
  function getBlocks(carId){
    const blocks=[];let i=0;
    while(i<days.length){const r=rentalForDay(carId,days[i]);if(r){let j=i;while(j<days.length&&rentalForDay(carId,days[j])?.id===r.id)j++;blocks.push({rental:r,startIdx:i,dayCount:j-i});i=j}else i++}
    return blocks;
  }
  return(
    <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden"}}>
      <div style={{padding:"11px 16px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg3)"}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o-1)}>← Пред.</button>
        <div style={{fontSize:14,fontWeight:700,textTransform:"capitalize"}}>{monthLabel}</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>setMonthOffset(o=>o+1)}>След. →</button>
      </div>
      <div style={{padding:"7px 16px",borderBottom:"1px solid var(--border)",display:"flex",gap:20,background:"var(--bg3)"}}>
        {[{c:"#27AE60",l:"В аренде"},{c:"#E67E22",l:"Резерв"},{c:"#E74C3C",l:"Просрочено"}].map(x=>(
          <div key={x.l} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text3)"}}>
            <div style={{width:20,height:5,background:x.c,borderRadius:3,opacity:.8}}></div>{x.l}
          </div>
        ))}
      </div>
      <div style={{overflowX:"auto"}}>
        <div style={{minWidth:LW+days.length*CW}}>
          <div style={{display:"flex",borderBottom:"1px solid var(--border)",background:"var(--bg3)",position:"sticky",top:0,zIndex:10}}>
            <div style={{width:LW,minWidth:LW,padding:"7px 14px",fontSize:11,fontWeight:700,color:"var(--text3)",letterSpacing:".05em"}}>АВТОМОБИЛЬ</div>
            {days.map(day=>{
              const iT=sameDay(day,today),iW=day.getDay()===0||day.getDay()===6;
              return <div key={day.toISOString()} style={{width:CW,minWidth:CW,textAlign:"center",padding:"4px 0",fontSize:10,fontFamily:"'JetBrains Mono'",color:iT?"var(--teal)":iW?"#2A2A2A":"var(--text3)",background:iT?"var(--teal-dim2)":"transparent",fontWeight:iT?800:400,borderLeft:"1px solid var(--border)"}}>
                <div style={{fontSize:8,marginBottom:1}}>{["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][day.getDay()]}</div>
                <div style={{width:iT?17:undefined,height:iT?17:undefined,background:iT?"var(--teal)":undefined,color:iT?"#000":undefined,borderRadius:iT?"50%":undefined,display:iT?"inline-flex":undefined,alignItems:iT?"center":undefined,justifyContent:iT?"center":undefined,fontSize:10,fontWeight:800,lineHeight:iT?"17px":undefined}}>{day.getDate()}</div>
              </div>;
            })}
          </div>
          {cars.map((car,ci)=>{
            const blocks=getBlocks(car.id);
            return(
              <div key={car.id} style={{display:"flex",borderBottom:"1px solid var(--border)",background:ci%2?"#111":"var(--bg2)",position:"relative",height:RH}}>
                <div style={{width:LW,minWidth:LW,padding:"0 14px",display:"flex",alignItems:"center",gap:8,borderRight:"1px solid var(--border)",position:"sticky",left:0,background:ci%2?"#111":"var(--bg2)",zIndex:5}}>
                  <div style={{width:7,height:7,borderRadius:"50%",background:car.color,flexShrink:0,boxShadow:`0 0 5px ${car.color}50`}}></div>
                  <div style={{overflow:"hidden"}}>
                    <div style={{fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{car.brand} {car.model}</div>
                    {car.plate&&<div style={{fontSize:9,color:"var(--text3)",fontFamily:"'JetBrains Mono'"}}>{car.plate}</div>}
                  </div>
                </div>
                <div style={{display:"flex",flex:1,position:"relative"}}>
                  {days.map(day=>{const iT=sameDay(day,today);return <div key={day.toISOString()} style={{width:CW,minWidth:CW,height:RH,background:iT?"var(--teal-dim2)":"transparent",borderLeft:iT?"1px solid var(--teal)20":"1px solid transparent",flexShrink:0}}/>})}
                  {blocks.map(({rental:r,startIdx,dayCount})=>{
                    const status=getRentalStatus(r);
                    const col=status==="overdue"?"#E74C3C":status==="reserved"?"#E67E22":car.color;
                    const dl=status==="reserved"?daysUntil(r.startDate):daysLeft(r.endDate);
                    return(
                      <div key={r.id} className="tl-bar" onClick={()=>onRentalClick(r)}
                        style={{left:startIdx*CW+2,top:5,width:dayCount*CW-4,height:RH-10,background:`linear-gradient(135deg,${col}D0,${col}90)`,boxShadow:`0 2px 8px ${col}35,inset 0 1px 0 rgba(255,255,255,.08)`,border:`1px solid ${col}35`}}
                        title={`${r.clientName} · ${fmtRu(r.startDate)}–${fmtRu(r.endDate)}`}>
                        {dayCount*CW>44&&<div style={{display:"flex",alignItems:"center",gap:5,minWidth:0,position:"relative",zIndex:1}}>
                          <div style={{width:20,height:20,borderRadius:"50%",background:"rgba(0,0,0,.35)",border:"1px solid rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,flexShrink:0,fontWeight:800,color:"#fff"}}>{r.clientName.charAt(0).toUpperCase()}</div>
                          <div style={{overflow:"hidden",minWidth:0}}>
                            <div style={{fontSize:10,fontWeight:700,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",lineHeight:1.3,textShadow:"0 1px 3px rgba(0,0,0,.6)"}}>{r.clientName.split(" ")[0]}</div>
                            {dayCount*CW>88&&<div style={{fontSize:9,color:"rgba(255,255,255,.7)",fontFamily:"'JetBrains Mono'",lineHeight:1}}>{status==="reserved"?`↑${dl}д`:status==="overdue"?`!${Math.abs(dl)}д`:`${dl}д`}</div>}
                          </div>
                        </div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Detail({rental,cars,onEdit,onEnd}){
  const car=cars.find(c=>c.id===rental.carId);
  const status=getRentalStatus(rental);
  const sc=SC[rental.active?status:"done"];
  const dl=daysLeft(rental.endDate);
  return <>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
      <span className="tag" style={{background:sc.bg,color:sc.color}}>{sc.label}</span>
      {!rental.active&&rental.endedAt&&<span style={{fontSize:11,color:"var(--teal)"}}>Завершена {fmtRuFull(rental.endedAt)}</span>}
      {rental.fromGoogle&&<span className="tag" style={{background:"var(--teal-dim)",color:"var(--teal)",fontSize:10}}>📅 Google</span>}
    </div>
    {car&&<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"9px 12px",background:"var(--bg3)",borderRadius:10,border:"1px solid var(--border)"}}>
      <div style={{width:8,height:8,borderRadius:"50%",background:car.color,boxShadow:`0 0 5px ${car.color}50`}}></div>
      <span style={{fontSize:13,fontWeight:600}}>{car.brand} {car.model}</span>
      {car.plate&&<span style={{fontSize:12,color:"var(--text3)",fontFamily:"'JetBrains Mono'",marginLeft:4}}>{car.plate}</span>}
    </div>}
    <div className="section">
      {[{l:"Клиент",v:rental.clientName,big:true},{l:"Телефон",v:rental.phone,c:"var(--teal)"},{l:"Город",v:rental.city},{l:"Место подачи",v:rental.location||"—"},{l:"Цена",v:rental.price?`${rental.price} €`:"—",c:"#27AE60"}].map(f=>(
        <div key={f.l} className="section-row">
          <div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>{f.l.toUpperCase()}</div>
          <div style={{fontSize:f.big?16:14,fontWeight:f.big?700:500,color:f.c||"var(--text)"}}>{f.v||"—"}</div>
        </div>
      ))}
    </div>
    <div className="section">
      <div className="section-row">
        <div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em",marginBottom:8}}>ПЕРИОД АРЕНДЫ</div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{textAlign:"center"}}><div style={{fontSize:9,color:"var(--text3)"}}>НАЧАЛО</div><div style={{fontFamily:"'JetBrains Mono'",fontSize:14,fontWeight:700}}>{fmtRu(rental.startDate)}</div></div>
          <div style={{flex:1,height:2,background:"var(--border2)",borderRadius:2}}><div style={{height:"100%",background:sc.color,borderRadius:2,opacity:.5}}></div></div>
          <div style={{textAlign:"center"}}><div style={{fontSize:9,color:"var(--text3)"}}>КОНЕЦ</div><div style={{fontFamily:"'JetBrains Mono'",fontSize:14,fontWeight:700}}>{fmtRu(rental.endDate)}</div></div>
          {rental.active&&<span className="tag" style={{background:sc.bg,color:sc.color,fontFamily:"'JetBrains Mono'",flexShrink:0}}>
            {status==="reserved"?`через ${daysUntil(rental.startDate)} дн.`:status==="overdue"?`-${Math.abs(dl)} дн.`:dl===0?"сегодня":`${dl} дн.`}
          </span>}
        </div>
      </div>
    </div>
    {(rental.mileageOut||rental.mileageIn)&&<div className="section"><div className="section-row" style={{flexDirection:"row",gap:20,flexWrap:"wrap"}}>
      {rental.mileageOut&&<div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ПРОБЕГ ВЫДАЧА</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'",color:"var(--teal)"}}>{rental.mileageOut} км</div></div>}
      {rental.mileageIn&&<div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ПРОБЕГ ВОЗВРАТ</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'",color:"var(--teal)"}}>{rental.mileageIn} км</div></div>}
      {rental.mileageOut&&rental.mileageIn&&<div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ЗА АРЕНДУ</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'",color:"var(--teal)"}}>{rental.mileageIn-rental.mileageOut} км</div></div>}
    </div></div>}
    {rental.documents&&<div className="section"><div className="section-row"><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ДОКУМЕНТЫ</div><div style={{fontSize:13}}>{rental.documents}</div></div></div>}
    {rental.notes&&<div className="section"><div className="section-row"><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:".05em"}}>ПРИМЕЧАНИЯ</div><div style={{fontSize:13,color:"var(--text2)",lineHeight:1.6}}>{rental.notes}</div></div></div>}
    <div style={{display:"flex",gap:8,marginTop:12}}>
      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={onEdit}>✏️ Редактировать</button>
      {rental.active&&<button className="btn btn-red" style={{flex:1,justifyContent:"center"}} onClick={onEnd}>Завершить аренду</button>}
    </div>
  </>;
}

function RentalForm({cars,initial,onSave,onCancel}){
  const[f,setF]=useState({carId:"",clientName:"",phone:"",city:"",location:"",startDate:fmtDate(new Date()),endDate:"",price:"",documents:"",notes:"",mileageOut:"",mileageIn:"",...initial,carId:initial.carId?String(initial.carId):""});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function submit(){if(!f.carId||!f.clientName||!f.endDate)return alert("Заполните: авто, имя, дата окончания");onSave({...f,carId:Number(f.carId)})}
  return <div style={{display:"flex",flexDirection:"column",gap:13}}>
    <div><label className="label">Автомобиль *</label><select className="input" value={f.carId} onChange={e=>s("carId",e.target.value)} style={{background:"var(--bg)"}}><option value="">Выберите...</option>{cars.map(c=><option key={c.id} value={c.id}>{c.brand} {c.model}{c.plate?" · "+c.plate:""}</option>)}</select></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Имя *</label><input className="input" value={f.clientName} onChange={e=>s("clientName",e.target.value)} placeholder="Владислав"/></div>
      <div><label className="label">Телефон</label><input className="input" value={f.phone} onChange={e=>s("phone",e.target.value)} placeholder="+34 644 136 487"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Город</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="Валенсия"/></div>
      <div><label className="label">Место подачи</label><input className="input" value={f.location} onChange={e=>s("location",e.target.value)} placeholder="Аэропорт T4"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
      <div><label className="label">Начало</label><input className="input" type="date" value={f.startDate} onChange={e=>s("startDate",e.target.value)}/></div>
      <div><label className="label">Конец *</label><input className="input" type="date" value={f.endDate} onChange={e=>s("endDate",e.target.value)}/></div>
      <div><label className="label">Цена €</label><input className="input" type="number" value={f.price} onChange={e=>s("price",e.target.value)} placeholder="420"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Пробег выдача, км</label><input className="input" type="number" value={f.mileageOut} onChange={e=>s("mileageOut",e.target.value)} placeholder="45230"/></div>
      <div><label className="label">Пробег возврат, км</label><input className="input" type="number" value={f.mileageIn} onChange={e=>s("mileageIn",e.target.value)} placeholder="46100"/></div>
    </div>
    <div><label className="label">Документы</label><input className="input" value={f.documents} onChange={e=>s("documents",e.target.value)} placeholder="Паспорт РФ, права..."/></div>
    <div><label className="label">Примечания</label><textarea className="input" rows={2} value={f.notes} onChange={e=>s("notes",e.target.value)} style={{resize:"vertical"}} placeholder="Депозит, условия..."/></div>
    <div style={{display:"flex",gap:8}}>
      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-teal" style={{flex:2,justifyContent:"center"}} onClick={submit}>Сохранить</button>
    </div>
  </div>;
}

function CarForm({initial,onSave,onCancel}){
  const[f,setF]=useState({brand:"",model:"",plate:"",city:"",lastServiceMileage:"",nextServiceMileage:"",...(initial||{})});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function submit(){if(!f.brand||!f.model)return alert("Укажите марку и модель");onSave(f)}
  return <div style={{display:"flex",flexDirection:"column",gap:13}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Марка *</label><input className="input" value={f.brand} onChange={e=>s("brand",e.target.value)} placeholder="Toyota"/></div>
      <div><label className="label">Модель *</label><input className="input" value={f.model} onChange={e=>s("model",e.target.value)} placeholder="Yaris"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Гос. номер</label><input className="input" value={f.plate} onChange={e=>s("plate",e.target.value)} placeholder="1234 ABC"/></div>
      <div><label className="label">Город базирования</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="Valencia"/></div>
    </div>
    <div style={{height:1,background:"var(--border)",margin:"4px 0"}}/>
    <div style={{fontSize:11,fontWeight:700,color:"var(--text3)",letterSpacing:".05em",marginBottom:-4}}>ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Пробег последнего ТО, км</label><input className="input" type="number" value={f.lastServiceMileage} onChange={e=>s("lastServiceMileage",e.target.value)} placeholder="45000"/></div>
      <div><label className="label">Пробег следующего ТО, км</label><input className="input" type="number" value={f.nextServiceMileage} onChange={e=>s("nextServiceMileage",e.target.value)} placeholder="55000"/></div>
    </div>
    {f.model&&!initial&&<div style={{background:"#1A1000",borderRadius:8,padding:"9px 12px",fontSize:12,color:"#E67E22",border:"1px solid #E67E2220"}}>В Google Calendar пиши <b>«{f.model}»</b> в названии события.</div>}
    <div style={{display:"flex",gap:8}}>
      <button className="btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-teal" style={{flex:2,justifyContent:"center"}} onClick={submit}>{initial?"Сохранить изменения":"Добавить авто"}</button>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
