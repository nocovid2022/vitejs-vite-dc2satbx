<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetDesk — Auto in Spain</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F2F2F7;color:#1C1C1E;font-family:'Inter',sans-serif;min-height:100vh;font-size:14px}
::-webkit-scrollbar{height:5px;width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C7C7CC;border-radius:3px}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:10px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-blue{background:#007AFF;color:#fff;padding:8px 16px;font-size:13px}.btn-blue:hover{background:#0066CC;transform:scale(.98)}
.btn-light{background:#fff;color:#007AFF;padding:8px 16px;font-size:13px;border:1px solid #E5E5EA}.btn-light:hover{background:#F2F2F7}
.btn-red{background:#FFF1F0;color:#FF3B30;padding:7px 14px;font-size:13px;border:1px solid #FFD5D3}.btn-red:hover{background:#FFE4E2}
.btn-green{background:#F0FFF4;color:#34C759;padding:7px 14px;font-size:13px;border:1px solid #C6F6D5}
.btn-sm{padding:6px 12px;font-size:12px}
.input{background:#fff;border:1.5px solid #E5E5EA;border-radius:10px;padding:10px 13px;color:#1C1C1E;font-size:14px;width:100%;outline:none;transition:all .15s;font-family:inherit}
.input:focus{border-color:#007AFF;box-shadow:0 0 0 4px #007AFF18}
.label{font-size:11px;font-weight:600;color:#8E8E93;letter-spacing:.06em;display:block;margin-bottom:5px;text-transform:uppercase}
.modal-overlay{position:fixed;inset:0;background:#00000060;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:#F2F2F7;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;padding:0 0 40px}
.modal-handle{width:36px;height:4px;background:#C7C7CC;border-radius:2px;margin:10px auto 0}
.modal-header{padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E5E5EA;background:#F2F2F7;position:sticky;top:0;z-index:5}
.modal-body{padding:20px}
.section{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px}
.section-row{padding:12px 16px;border-bottom:1px solid #F2F2F7;display:flex;flex-direction:column;gap:4px}
.section-row:last-child{border-bottom:none}
.card-ios{background:#fff;border-radius:14px;overflow:hidden;transition:all .2s}
.card-ios:active{transform:scale(.98)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.view-pill{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#8E8E93;padding:7px 14px;border-radius:9px;transition:all .15s}
.view-pill.active{background:#fff;color:#007AFF;box-shadow:0 1px 3px #0001}
.tab-btn{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#8E8E93;padding:10px 16px;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-btn.active{color:#007AFF;border-bottom-color:#007AFF}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.slide-up{animation:slideUp .28s cubic-bezier(.4,0,.2,1)}
@keyframes spin{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:spin 1s linear infinite}

/* Timeline modern styles */
.tl-bar{border-radius:6px;transition:all .15s;cursor:pointer;display:flex;align-items:center;padding:0 8px;overflow:hidden;position:relative}
.tl-bar:hover{filter:brightness(.93);transform:scaleY(.95)}
.tl-bar::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);border-radius:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;
const CLIENT_ID="546196176766-060ji046vk8r8kem36ko66dr6d4gme9n.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/calendar";
const STORAGE_KEY="fleet_v5";
const CARS_KEY="fleet_cars_v5";
const CAR_COLORS=["#007AFF","#34C759","#FF9500","#FF3B30","#AF52DE","#5AC8FA","#FF6B35","#FF2D55","#00C7BE","#30D158","#FF375F","#BF5AF2"];

const DEFAULT_CARS=[
  {id:1,brand:"Volkswagen",model:"Polo",plate:"",city:"",color:CAR_COLORS[0]},
  {id:2,brand:"Volkswagen",model:"Golf",plate:"",city:"",color:CAR_COLORS[1]},
  {id:3,brand:"Lexus",model:"CT200h",plate:"",city:"",color:CAR_COLORS[2]},
  {id:4,brand:"Toyota",model:"Yaris Hybrid",plate:"",city:"",color:CAR_COLORS[3]},
  {id:5,brand:"Skoda",model:"Scala",plate:"",city:"",color:CAR_COLORS[4]},
  {id:6,brand:"Hyundai",model:"Ionic",plate:"",city:"",color:CAR_COLORS[5]},
  {id:7,brand:"Skoda",model:"Superb",plate:"",city:"",color:CAR_COLORS[6]},
  {id:8,brand:"Volkswagen",model:"Passat",plate:"",city:"",color:CAR_COLORS[7]},
  {id:9,brand:"Fiat",model:"500e Alicante",plate:"",city:"Alicante",color:CAR_COLORS[8]},
  {id:10,brand:"Fiat",model:"500e Valencia",plate:"",city:"Valencia",color:CAR_COLORS[9]},
  {id:11,brand:"BMW",model:"218d Gran Tourer",plate:"",city:"",color:CAR_COLORS[10]},
  {id:12,brand:"Toyota",model:"Yaris",plate:"",city:"",color:CAR_COLORS[11]},
];

const CAR_KW=[
  {id:1,kw:["polo","vw polo","volkswagen polo"]},
  {id:2,kw:["golf","vw golf","volkswagen golf"]},
  {id:3,kw:["lexus","ct200","ct 200"]},
  {id:4,kw:["yaris hybrid","yaris гибрид"]},
  {id:5,kw:["scala"]},
  {id:6,kw:["ionic","ioniq"]},
  {id:7,kw:["superb"]},
  {id:8,kw:["passat"]},
  {id:9,kw:["500e alicante","500 alicante","fiat alicante"]},
  {id:10,kw:["500e","fiat 500","500 valencia","fiat 500e"]},
  {id:11,kw:["218","gran tourer","218d","bmw 218"]},
  {id:12,kw:["yaris"]},
];

function getRentalStatus(r){
  if(!r||!r.active)return"done";
  const now=new Date();now.setHours(0,0,0,0);
  const s=parseDate(r.startDate);s.setHours(0,0,0,0);
  const e=parseDate(r.endDate);e.setHours(0,0,0,0);
  if(e<now)return"overdue";
  if(s>now)return"reserved";
  return"active";
}

const SC={
  active:{label:"В аренде",color:"#34C759",bg:"#F0FFF4",dot:"#34C759"},
  reserved:{label:"Резерв",color:"#FF9500",bg:"#FFF8F0",dot:"#FF9500"},
  overdue:{label:"Просрочено",color:"#FF3B30",bg:"#FFF1F0",dot:"#FF3B30"},
  free:{label:"Свободна",color:"#8E8E93",bg:"#F2F2F7",dot:"#C7C7CC"},
  done:{label:"Завершено",color:"#8E8E93",bg:"#F2F2F7",dot:"#C7C7CC"},
};

function getCarStatus(carId,rentals){
  const active=rentals.filter(r=>r.active&&r.carId===carId);
  if(!active.length)return{status:"free",rental:null};
  const cur=active.find(r=>getRentalStatus(r)==="active");
  if(cur)return{status:"active",rental:cur};
  const ov=active.find(r=>getRentalStatus(r)==="overdue");
  if(ov)return{status:"overdue",rental:ov};
  const res=active.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate))[0];
  return{status:"reserved",rental:res};
}

function findCarId(text,cars){
  const t=text.toLowerCase();
  for(const ck of CAR_KW){if(ck.kw.some(k=>t.includes(k)))return ck.id}
  for(const c of cars){
    if(t.includes(c.model.toLowerCase())||t.includes((c.brand+" "+c.model).toLowerCase()))return c.id;
  }
  return null;
}

function parseEvent(ev,cars){
  const title=ev.summary||"";
  const desc=ev.description||"";
  const phoneMatch=title.match(/\+[\d\s\-()]{8,15}/);
  const phone=phoneMatch?phoneMatch[0].trim():"";
  let rest=title.replace(/\+[\d\s\-()]{8,15}/,"").trim();
  rest=rest.replace(/оплата.*/i,"").replace(/аванс.*/i,"").replace(/залог.*/i,"").trim();
  const carId=findCarId(rest,cars)||findCarId(title,cars);
  let rem=rest;
  if(carId){
    const ck=CAR_KW.find(x=>x.id===carId);
    if(ck){for(const k of ck.kw)rem=rem.replace(new RegExp(k,"gi"),"").trim()}
    const car=cars.find(c=>c.id===carId);
    if(car){rem=rem.replace(new RegExp(car.model,"gi"),"").replace(new RegExp(car.brand,"gi"),"").trim()}
  }
  rem=rem.replace(/\s+/g," ").replace(/^[-,·\s]+|[-,·\s]+$/g,"").trim();
  const parts=rem.split(/\s+/).filter(Boolean);
  const CITIES=["валенсия","мадрид","барселона","аликанте","севилья","малага","valencia","madrid","barcelona","alicante","sevilla","malaga","бенидорм","торревьеха","murcia","мурсия","benidorm","torrevieja"];
  let city="",clientName="";
  if(parts.length>0&&CITIES.includes(parts[0].toLowerCase())){city=parts[0];clientName=parts.slice(1).join(" ")}
  else clientName=parts.join(" ");
  const g=k=>{const m=desc.match(new RegExp(k+"[:\\s]+([^\\n]+)","i"));return m?m[1].trim():""};
  return{
    id:ev.id,googleEventId:ev.id,carId,
    clientName:clientName||title,phone,
    city:city||g("город")||g("city"),
    location:g("место")||g("location"),
    price:g("цена")||g("price"),
    documents:g("документы")||g("docs"),
    notes:desc,
    startDate:ev.start?.date||(ev.start?.dateTime?ev.start.dateTime.split("T")[0]:""),
    endDate:ev.end?.date||(ev.end?.dateTime?ev.end.dateTime.split("T")[0]:""),
    active:true,fromGoogle:true,
    // Дашбордные поля — не перезаписываем при синхронизации
    _dashboardOnly:true,
  };
}

function toGoogleEvent(r,cars){
  const car=cars.find(c=>c.id===r.carId);
  const label=car?`${car.brand} ${car.model}`:"";
  const title=`${r.city?r.city+" ":""}${r.clientName} ${label}${r.phone?" "+r.phone:""}`.trim();
  const lines=[r.price&&`Цена: ${r.price} €`,r.location&&`Место: ${r.location}`,r.documents&&`Документы: ${r.documents}`].filter(Boolean);
  return{summary:title,description:lines.join("\n"),start:{date:r.startDate},end:{date:r.endDate}};
}

function fmtDate(d){return d.toISOString().split("T")[0]}
function parseDate(s){if(!s)return new Date();const[y,m,d]=s.split("-");return new Date(+y,+m-1,+d)}
function daysLeft(e){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(e)-n)/86400000)}
function daysUntil(s){const n=new Date();n.setHours(0,0,0,0);return Math.round((parseDate(s)-n)/86400000)}
function fmtRu(s){if(!s)return"—";return parseDate(s).toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function App(){
  const[cars,setCars]=useState(()=>{try{const s=localStorage.getItem(CARS_KEY);return s?JSON.parse(s):DEFAULT_CARS}catch{return DEFAULT_CARS}});
  const[rentals,setRentals]=useState(()=>{try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):[]}catch{return[]}});
  const[view,setView]=useState("timeline");
  const[clientsTab,setClientsTab]=useState("active");
  const[monthOffset,setMonthOffset]=useState(0);
  const[showForm,setShowForm]=useState(false);
  const[showCarForm,setShowCarForm]=useState(false);
  const[editCarId,setEditCarId]=useState(null);
  const[showGuide,setShowGuide]=useState(false);
  const[editRental,setEditRental]=useState(null);
  const[selected,setSelected]=useState(null);
  const[gapiReady,setGapiReady]=useState(false);
  const[gisReady,setGisReady]=useState(false);
  const[signedIn,setSignedIn]=useState(false);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[syncCount,setSyncCount]=useState(0);
  const[tokenClient,setTokenClient]=useState(null);
  const carsRef=useRef(cars);
  useEffect(()=>{carsRef.current=cars},[cars]);
  useEffect(()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(rentals))},[rentals]);
  useEffect(()=>{localStorage.setItem(CARS_KEY,JSON.stringify(cars))},[cars]);

  useEffect(()=>{
    const s1=document.createElement("script");s1.src="https://apis.google.com/js/api.js";
    s1.onload=()=>{window.gapi.load("client",async()=>{await window.gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"]});setGapiReady(true)})};
    document.head.appendChild(s1);
    const s2=document.createElement("script");s2.src="https://accounts.google.com/gsi/client";
    s2.onload=()=>{const tc=window.google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:(r)=>{if(!r.error){setSignedIn(true);doSync()}}});setTokenClient(tc);setGisReady(true)};
    document.head.appendChild(s2);
  },[]);

  // УМНАЯ СИНХРОНИЗАЦИЯ — не затирает дашбордные поля
  async function doSync(){
    setSyncStatus("syncing");
    try{
      const now=new Date();
      const r=await window.gapi.client.calendar.events.list({
        calendarId:"primary",
        timeMin:new Date(now.getFullYear(),now.getMonth()-3,1).toISOString(),
        timeMax:new Date(now.getFullYear(),now.getMonth()+6,1).toISOString(),
        singleEvents:true,orderBy:"startTime",maxResults:500
      });
      const cc=carsRef.current;
      const evs=(r.result.items||[]).filter(e=>e.summary&&e.summary.trim().length>1).map(e=>parseEvent(e,cc)).filter(x=>x.carId&&x.startDate&&x.endDate);

      setRentals(prev=>{
        const manual=prev.filter(x=>!x.fromGoogle);
        const merged=evs.map(newEv=>{
          // Ищем существующую запись по googleEventId
          const existing=prev.find(x=>x.googleEventId===newEv.googleEventId);
          if(existing){
            // Обновляем только "календарные" поля, сохраняем дашбордные
            return{
              ...existing,
              clientName:newEv.clientName,
              phone:newEv.phone,
              city:newEv.city||existing.city,
              location:newEv.location||existing.location,
              price:newEv.price||existing.price,
              documents:newEv.documents||existing.documents,
              startDate:newEv.startDate,
              endDate:newEv.endDate,
              carId:newEv.carId||existing.carId,
              fromGoogle:true,
              active:true,
            };
          }
          return newEv;
        });
        return[...manual,...merged];
      });
      setSyncCount(evs.length);setSyncStatus("done");setTimeout(()=>setSyncStatus("idle"),4000);
    }catch(e){console.error(e);setSyncStatus("error")}
  }

  async function createCalEvent(r){if(!signedIn)return null;try{const res=await window.gapi.client.calendar.events.insert({calendarId:"primary",resource:toGoogleEvent(r,cars)});return res.result.id}catch{return null}}
  async function updateCalEvent(r){if(!signedIn||!r.googleEventId)return;try{await window.gapi.client.calendar.events.update({calendarId:"primary",eventId:r.googleEventId,resource:toGoogleEvent(r,cars)})}catch{}}
  async function deleteCalEvent(id){if(!signedIn||!id)return;try{await window.gapi.client.calendar.events.delete({calendarId:"primary",eventId:id})}catch{}}

  async function saveRental(data){
    if(editRental){
      const u={...editRental,...data};
      await updateCalEvent(u);
      setRentals(r=>r.map(x=>x.id===editRental.id?u:x));
    } else {
      const n={...data,id:Date.now(),active:true};
      const gid=await createCalEvent(n);
      if(gid)n.googleEventId=gid;
      setRentals(r=>[...r,n]);
    }
    setShowForm(false);setEditRental(null);
  }

  async function endRental(id){
    const r=rentals.find(x=>x.id===id);
    if(r?.googleEventId)await deleteCalEvent(r.googleEventId);
    setRentals(r=>r.map(x=>x.id===id?{...x,active:false,endedAt:fmtDate(new Date())}:x));
    setSelected(null);
  }

  function saveCar(data){
    if(editCarId){
      setCars(c=>c.map(x=>x.id===editCarId?{...x,...data}:x));
    } else {
      const color=CAR_COLORS[cars.length%CAR_COLORS.length];
      setCars(c=>[...c,{...data,id:Date.now(),color}]);
    }
    setShowCarForm(false);setEditCarId(null);
  }

  const today=new Date();today.setHours(0,0,0,0);
  const vm=new Date(today.getFullYear(),today.getMonth()+monthOffset,1);
  const days=Array.from({length:new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate()},(_,i)=>new Date(vm.getFullYear(),vm.getMonth(),i+1));
  const monthLabel=vm.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});

  function rentalForDay(cid,day){
    return rentals.find(r=>{
      if(!r.active||r.carId!==cid)return false;
      const s=parseDate(r.startDate);s.setHours(0,0,0,0);
      const e=parseDate(r.endDate);e.setHours(0,0,0,0);
      return day>=s&&day<=e;
    });
  }

  const activeR=rentals.filter(r=>r.active&&getRentalStatus(r)==="active");
  const reservedR=rentals.filter(r=>r.active&&getRentalStatus(r)==="reserved");
  const overdueR=rentals.filter(r=>r.active&&getRentalStatus(r)==="overdue");
  const doneR=rentals.filter(r=>!r.active);
  const freeCount=cars.filter(c=>getCarStatus(c.id,rentals).status==="free").length;

  const clientTabs=[
    {key:"active",label:"В аренде",count:activeR.length,color:"#34C759"},
    {key:"reserved",label:"Резерв",count:reservedR.length,color:"#FF9500"},
    {key:"overdue",label:"Просрочено",count:overdueR.length,color:"#FF3B30"},
    {key:"done",label:"Архив",count:doneR.length,color:"#8E8E93"},
  ];
  const tabRentals={active:activeR,reserved:reservedR,overdue:overdueR,done:doneR};

  return(
    <div style={{minHeight:"100vh",background:"#F2F2F7"}}>
      {/* Header */}
      <div style={{background:"rgba(242,242,247,0.9)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderBottom:"1px solid #E5E5EA",padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:36,height:36,background:"linear-gradient(135deg,#007AFF,#5AC8FA)",borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,boxShadow:"0 2px 8px #007AFF40"}}>🚗</div>
          <div>
            <div style={{fontSize:16,fontWeight:800,letterSpacing:"-.03em"}}>Auto in Spain</div>
            <div style={{fontSize:11,color:"#8E8E93",fontFamily:"'JetBrains Mono'"}}>{activeR.length} аренда · {reservedR.length} резерв · {freeCount} свободно</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-light btn-sm" onClick={()=>setShowGuide(true)}>📋</button>
          {!signedIn?(
            <button className="btn btn-light btn-sm" onClick={()=>gapiReady&&gisReady&&tokenClient.requestAccessToken({prompt:""})}>
              <svg width="13" height="13" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              {gapiReady&&gisReady?"Подключить Google":"Загрузка..."}
            </button>
          ):(
            <button className="btn btn-light btn-sm" onClick={doSync} disabled={syncStatus==="syncing"}>
              <span className={syncStatus==="syncing"?"spin":""}>🔄</span>
              {syncStatus==="syncing"?"Синхр...":syncStatus==="done"?`✓ ${syncCount}`:syncStatus==="error"?"Ошибка":"Синхронизировать"}
            </button>
          )}
          <div style={{background:"#E5E5EA",borderRadius:11,padding:"3px",display:"flex"}}>
            <button className={"view-pill"+(view==="timeline"?" active":"")} onClick={()=>setView("timeline")}>📅</button>
            <button className={"view-pill"+(view==="cars"?" active":"")} onClick={()=>setView("cars")}>🚗</button>

function ModernTimeline({cars,days,today,monthLabel,monthOffset,setMonthOffset,rentalForDay,onRentalClick}){
  const CW=32,RH=42,LW=196;

  // Собираем блоки аренды для каждой строки
  function getBlocks(carId){
    const blocks=[];
    let i=0;
    while(i<days.length){
      const day=days[i];
      const r=rentalForDay(carId,day);
      if(r){
        // Найти конец блока
        let j=i;
        while(j<days.length&&rentalForDay(carId,days[j])?.id===r.id)j++;
        blocks.push({rental:r,startIdx:i,endIdx:j-1,dayCount:j-i});
        i=j;
      } else i++;
    }
    return blocks;
  }

  return(
    <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 1px 3px #0001"}}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid #F2F2F7",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#fff"}}>
        <button className="btn btn-light btn-sm" onClick={()=>setMonthOffset(o=>o-1)}>←</button>
        <div style={{fontSize:14,fontWeight:700,textTransform:"capitalize"}}>{monthLabel}</div>
        <button className="btn btn-light btn-sm" onClick={()=>setMonthOffset(o=>o+1)}>→</button>
      </div>

      {/* Legend */}
      <div style={{padding:"6px 16px",borderBottom:"1px solid #F2F2F7",display:"flex",gap:16,background:"#FAFAFA"}}>
        {[{c:"#34C759",l:"В аренде"},{c:"#FF9500",l:"Резерв"},{c:"#FF3B30",l:"Просрочено"}].map(x=>(
          <div key={x.l} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"#8E8E93"}}>
            <div style={{width:20,height:6,background:x.c,borderRadius:3,opacity:.8}}></div>{x.l}
          </div>
        ))}
      </div>

      <div style={{overflowX:"auto"}}>
        <div style={{minWidth:LW+days.length*CW}}>
          {/* Day headers */}
          <div style={{display:"flex",borderBottom:"1px solid #F2F2F7",background:"#FAFAFA",position:"sticky",top:0,zIndex:10}}>
            <div style={{width:LW,minWidth:LW,padding:"7px 14px",fontSize:11,fontWeight:700,color:"#8E8E93",letterSpacing:".05em"}}>АВТОМОБИЛЬ</div>
            {days.map(day=>{
              const iT=sameDay(day,today);
              const iW=day.getDay()===0||day.getDay()===6;
              return <div key={day.toISOString()} style={{width:CW,minWidth:CW,textAlign:"center",padding:"5px 0",fontSize:10,fontFamily:"'JetBrains Mono'",color:iT?"#007AFF":iW?"#C7C7CC":"#8E8E93",background:iT?"#EFF6FF":"transparent",fontWeight:iT?800:400,borderLeft:"1px solid #F5F5F5"}}>
                <div style={{fontSize:8,marginBottom:1}}>{["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][day.getDay()]}</div>
                <div style={{width:iT?18:undefined,height:iT?18:undefined,background:iT?"#007AFF":undefined,color:iT?"#fff":undefined,borderRadius:iT?"50%":undefined,display:iT?"inline-flex":undefined,alignItems:iT?"center":undefined,justifyContent:iT?"center":undefined,fontSize:10}}>{day.getDate()}</div>
              </div>;
            })}
          </div>

          {/* Car rows — modern bar rendering */}
          {cars.map((car,ci)=>{
            const blocks=getBlocks(car.id);
            return(
              <div key={car.id} style={{display:"flex",borderBottom:"1px solid #F5F5F5",background:ci%2?"#FAFAFA":"#fff",position:"relative",height:RH}}>
                {/* Car label */}
                <div style={{width:LW,minWidth:LW,padding:"0 14px",display:"flex",alignItems:"center",gap:8,borderRight:"1px solid #F2F2F7",position:"sticky",left:0,background:ci%2?"#FAFAFA":"#fff",zIndex:5}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:car.color,flexShrink:0,boxShadow:`0 0 0 2px ${car.color}30`}}></div>
                  <div style={{overflow:"hidden"}}>
                    <div style={{fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{car.brand} {car.model}</div>
                    {car.plate&&<div style={{fontSize:9,color:"#C7C7CC",fontFamily:"'JetBrains Mono'"}}>{car.plate}</div>}
                  </div>
                </div>

                {/* Day cells — just for today highlight */}
                <div style={{display:"flex",flex:1,position:"relative"}}>
                  {days.map(day=>{
                    const iT=sameDay(day,today);
                    return <div key={day.toISOString()} style={{width:CW,minWidth:CW,height:RH,background:iT?"#007AFF08":"transparent",borderLeft:iT?"1px solid #007AFF25":"1px solid transparent",flexShrink:0}}/>;
                  })}

                  {/* Rental bars — absolutely positioned on top */}
                  {blocks.map(({rental:r,startIdx,dayCount})=>{
                    const status=getRentalStatus(r);
                    const col=status==="overdue"?"#FF3B30":status==="reserved"?"#FF9500":car.color;
                    const barLeft=startIdx*CW+2;
                    const barWidth=dayCount*CW-4;
                    const dl=status==="reserved"?daysUntil(r.startDate):daysLeft(r.endDate);
                    return(
                      <div key={r.id}
                        className="tl-bar"
                        onClick={()=>onRentalClick(r)}
                        style={{
                          position:"absolute",
                          left:barLeft,
                          top:6,
                          width:barWidth,
                          height:RH-12,
                          background:`linear-gradient(135deg, ${col}E0, ${col}B0)`,
                          boxShadow:`0 2px 8px ${col}40`,
                          border:`1px solid ${col}30`,
                        }}
                        title={`${r.clientName} · ${fmtRu(r.startDate)}–${fmtRu(r.endDate)}`}
                      >
                        {barWidth>50&&<div style={{display:"flex",alignItems:"center",gap:5,minWidth:0}}>
                          <div style={{width:18,height:18,borderRadius:"50%",background:"rgba(255,255,255,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,flexShrink:0,fontWeight:700,color:"#fff"}}>
                            {r.clientName.charAt(0).toUpperCase()}
                          </div>
                          <div style={{overflow:"hidden",minWidth:0}}>
                            <div style={{fontSize:10,fontWeight:700,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",lineHeight:1.2}}>{r.clientName.split(" ")[0]}</div>
                            {barWidth>90&&<div style={{fontSize:9,color:"rgba(255,255,255,.75)",fontFamily:"'JetBrains Mono'",lineHeight:1}}>{status==="reserved"?`↑${dl}д`:status==="overdue"?`!${Math.abs(dl)}д`:`${dl}д`}</div>}
                          </div>
                        </div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

          <div style={{textAlign:"center"}}><div style={{fontSize:9,color:"#8E8E93"}}>НАЧАЛО</div><div style={{fontFamily:"'JetBrains Mono'",fontSize:14,fontWeight:700}}>{fmtRu(rental.startDate)}</div></div>
          <div style={{flex:1,height:3,background:"#E5E5EA",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",background:sc.color,borderRadius:2,width:"100%",opacity:.6}}></div></div>
          <div style={{textAlign:"center"}}><div style={{fontSize:9,color:"#8E8E93"}}>КОНЕЦ</div><div style={{fontFamily:"'JetBrains Mono'",fontSize:14,fontWeight:700}}>{fmtRu(rental.endDate)}</div></div>
          <span className="tag" style={{background:sc.bg,color:sc.color,fontFamily:"'JetBrains Mono'",flexShrink:0}}>
            {status==="reserved"?`через ${daysUntil(rental.startDate)} дн.`:status==="overdue"?`-${Math.abs(dl)} дн.`:dl===0?"сегодня":`${dl} дн.`}
          </span>
        </div>
      </div>
    </div>
    {(rental.mileageOut||rental.mileageIn)&&<div className="section">
      <div className="section-row" style={{flexDirection:"row",gap:20}}>
        {rental.mileageOut&&<div><div style={{fontSize:10,color:"#8E8E93",fontWeight:600,letterSpacing:".05em"}}>ПРОБЕГ ВЫДАЧА</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'"}}>{rental.mileageOut} км</div></div>}
        {rental.mileageIn&&<div><div style={{fontSize:10,color:"#8E8E93",fontWeight:600,letterSpacing:".05em"}}>ПРОБЕГ ВОЗВРАТ</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'"}}>{rental.mileageIn} км</div></div>}
        {rental.mileageOut&&rental.mileageIn&&<div><div style={{fontSize:10,color:"#8E8E93",fontWeight:600,letterSpacing:".05em"}}>ПРОБЕГ ЗА АРЕНДУ</div><div style={{fontSize:14,fontWeight:700,fontFamily:"'JetBrains Mono'",color:"#007AFF"}}>{rental.mileageIn-rental.mileageOut} км</div></div>}
      </div>
    </div>}
    {rental.documents&&<div className="section"><div className="section-row"><div style={{fontSize:10,color:"#8E8E93",fontWeight:600,letterSpacing:".05em"}}>ДОКУМЕНТЫ</div><div style={{fontSize:13}}>{rental.documents}</div></div></div>}
    {rental.notes&&<div className="section"><div className="section-row"><div style={{fontSize:10,color:"#8E8E93",fontWeight:600,letterSpacing:".05em"}}>ПРИМЕЧАНИЯ</div><div style={{fontSize:13,color:"#3C3C43",lineHeight:1.6}}>{rental.notes}</div></div></div>}
    <div style={{display:"flex",gap:8,marginTop:16}}>
      <button className="btn btn-light" style={{flex:1,justifyContent:"center"}} onClick={onEdit}>✏️ Редактировать</button>
      {rental.active&&<button className="btn btn-red" style={{flex:1,justifyContent:"center"}} onClick={onEnd}>Завершить</button>}
    </div>
  </>;
}

function RentalForm({cars,initial,onSave,onCancel}){
  const[f,setF]=useState({carId:"",clientName:"",phone:"",city:"",location:"",startDate:fmtDate(new Date()),endDate:"",price:"",documents:"",notes:"",mileageOut:"",mileageIn:"",...initial,carId:initial.carId?String(initial.carId):""});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function submit(){if(!f.carId||!f.clientName||!f.endDate)return alert("Заполните: авто, имя, дата окончания");onSave({...f,carId:Number(f.carId)})}
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div><label className="label">Автомобиль *</label><select className="input" value={f.carId} onChange={e=>s("carId",e.target.value)}><option value="">Выберите...</option>{cars.map(c=><option key={c.id} value={c.id}>{c.brand} {c.model}{c.plate?" · "+c.plate:""}</option>)}</select></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Имя клиента *</label><input className="input" value={f.clientName} onChange={e=>s("clientName",e.target.value)} placeholder="Владислав"/></div>
      <div><label className="label">Телефон</label><input className="input" value={f.phone} onChange={e=>s("phone",e.target.value)} placeholder="+34 644 136 487"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Город</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="Валенсия"/></div>
      <div><label className="label">Место подачи</label><input className="input" value={f.location} onChange={e=>s("location",e.target.value)} placeholder="Аэропорт T4"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
      <div><label className="label">Начало</label><input className="input" type="date" value={f.startDate} onChange={e=>s("startDate",e.target.value)}/></div>
      <div><label className="label">Конец *</label><input className="input" type="date" value={f.endDate} onChange={e=>s("endDate",e.target.value)}/></div>
      <div><label className="label">Цена €</label><input className="input" type="number" value={f.price} onChange={e=>s("price",e.target.value)} placeholder="420"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Пробег при выдаче, км</label><input className="input" type="number" value={f.mileageOut} onChange={e=>s("mileageOut",e.target.value)} placeholder="45230"/></div>
      <div><label className="label">Пробег при возврате, км</label><input className="input" type="number" value={f.mileageIn} onChange={e=>s("mileageIn",e.target.value)} placeholder="46100"/></div>
    </div>
    <div><label className="label">Документы</label><input className="input" value={f.documents} onChange={e=>s("documents",e.target.value)} placeholder="Паспорт РФ, права..."/></div>
    <div><label className="label">Примечания</label><textarea className="input" rows={2} value={f.notes} onChange={e=>s("notes",e.target.value)} style={{resize:"vertical"}} placeholder="Депозит, условия..."/></div>
    <div style={{display:"flex",gap:8,marginTop:4}}>
      <button className="btn btn-light" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-blue" style={{flex:2,justifyContent:"center"}} onClick={submit}>Сохранить</button>
    </div>
  </div>;
}

function CarForm({initial,onSave,onCancel}){
  const[f,setF]=useState({brand:"",model:"",plate:"",city:"",...(initial||{})});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function submit(){if(!f.brand||!f.model)return alert("Укажите марку и модель");onSave(f)}
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Марка *</label><input className="input" value={f.brand} onChange={e=>s("brand",e.target.value)} placeholder="Toyota"/></div>
      <div><label className="label">Модель *</label><input className="input" value={f.model} onChange={e=>s("model",e.target.value)} placeholder="Yaris"/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div><label className="label">Гос. номер</label><input className="input" value={f.plate} onChange={e=>s("plate",e.target.value)} placeholder="1234 ABC"/></div>
      <div><label className="label">Город базирования</label><input className="input" value={f.city} onChange={e=>s("city",e.target.value)} placeholder="Valencia"/></div>
    </div>
    {f.model&&!initial&&<div style={{background:"#FFFBEB",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#92400E"}}>
      В Google Calendar пиши <b>«{f.model}»</b> в названии события.
    </div>}
    <div style={{display:"flex",gap:8}}>
      <button className="btn btn-light" style={{flex:1,justifyContent:"center"}} onClick={onCancel}>Отмена</button>
      <button className="btn btn-blue" style={{flex:2,justifyContent:"center"}} onClick={submit}>{initial?"Сохранить":"Добавить авто"}</button>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
